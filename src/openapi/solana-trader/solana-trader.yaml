  "/{apiKey}/build":
    get:
      summary: Build Swap Instructions
      description: "Returns raw Solana swap instructions rather than a pre-built transaction."
      x-compute-units: 100
      x-rate-limit-cus: 100
      operationId: build-swap-instructions
      parameters:
        - $ref: "#/components/parameters/apiKey"
        - $ref: "#/components/parameters/InputMint"
        - $ref: "#/components/parameters/OutputMint"
        - $ref: "#/components/parameters/Amount"
        - name: taker
          in: query
          required: true
          description: >
            Public key of the wallet that will sign the swap instructions.
            Required for `/build` since the instructions must reference concrete
            source and destination accounts.
          schema:
            type: string
          example: GkwFnmMDvn3HGMpJpWBg8tgJxr3NxNvg3AXxvXVPbRGJ
        - name: payer
          in: query
          required: false
          description: >
            Optional public key of a sponsor. Rewrites rent and
            account-creation instructions onto the sponsor using the same
            rules as `/order`'s `payer`: the trade itself stays with the taker
            (`inAmount` on `ExactIn`), and a native SOL debit moves to the
            sponsor only when it is exactly one token-account's rent (or is
            split when it is the trade plus exactly that rent). Any other
            taker SOL debit produces a `502`.

            `/build` does NOT default `payer` to `taker`, and `payer` does not
            pay signature or priority fees — the caller still chooses account
            zero when they compile the transaction, so gas stays with whoever
            they put there. A `payer` equal to `taker` therefore changes
            nothing. Malformed key: `400 {"error":"Invalid payer"}`. The
            `/build` response has no `gasless` field and no fee-payer fields.
          schema:
            type: string
        - name: slippageBps
          in: query
          required: false
          description: >
            Slippage tolerance in basis points (0-10000 integer). Metis
            defaults to 50 when omitted. The literal string `rtse` returns
            `501 {"error":"slippageBps=rtse is not supported; use a number
            between 0 and 10000"}` on `/build`; on `/order` the same string
            returns `400` (see that operation).
          schema:
            oneOf:
              - type: integer
                minimum: 0
                maximum: 10000
              - type: string
                enum: [rtse]
          example: 50
        - name: dexes
          in: query
          required: false
          description: >
            Comma-separated list of DEX labels to allow-list for routing
            (labels are case-sensitive). Mutually exclusive with `excludeDexes`.
          schema:
            type: string
        - name: excludeDexes
          in: query
          required: false
          description: >
            Comma-separated list of DEX labels to exclude from routing (labels
            are case-sensitive). Mutually exclusive with `dexes`.
          schema:
            type: string
        - name: platformFeeBps
          in: query
          required: false
          description: >
            Integrator fee in basis points (0-10000). When set to a positive
            value, `feeAccount` is required. Mutually exclusive with
            `referralFee` / `referralAccount`; sending them together returns
            `400 {"error":"referralFee and referralAccount are mutually
            exclusive with platformFeeBps and feeAccount"}`.
          schema:
            type: integer
            minimum: 0
            maximum: 10000
        - name: feeAccount
          in: query
          required: false
          description: >
            Token account that receives the integrator fee. Required when
            `platformFeeBps` is positive. The value is only checked as a valid
            pubkey — no PDA derivation is performed. Mutually exclusive with
            `referralFee` / `referralAccount`; sending them together returns
            `400 {"error":"referralFee and referralAccount are mutually
            exclusive with platformFeeBps and feeAccount"}`.
          schema:
            type: string
        - name: maxAccounts
          in: query
          required: false
          description: >
            Upper bound on the number of accounts the swap transaction can
            reference (1-64). Lower values keep the transaction well within the
            Solana account limit at the cost of narrower routing.
          schema:
            type: integer
            minimum: 1
            maximum: 64
        - name: wrapAndUnwrapSol
          in: query
          required: false
          description: >
            When `true`, Metis inserts wrap-SOL and unwrap-SOL instructions
            around the swap so native SOL can be used directly as input or
            output.
          schema:
            type: boolean
        - name: destinationTokenAccount
          in: query
          required: false
          description: >
            Explicit destination SPL token account for the output tokens.
            Mutually exclusive with `nativeDestinationAccount`.
          schema:
            type: string
        - name: nativeDestinationAccount
          in: query
          required: false
          description: >
            Explicit destination wallet for native SOL output. Mutually
            exclusive with `destinationTokenAccount`.
          schema:
            type: string
        - name: blockhashSlotsToExpiry
          in: query
          required: false
          description: >
            Number of slots the returned blockhash remains valid for (1-300).
            Metis types this as `uint8`, so values in the 256-300 range return
            `501` rather than `400`.
          schema:
            type: integer
            minimum: 1
            maximum: 300
        - name: tipAmount
          in: query
          required: false
          description: >
            Not supported on `/build`. Any value returns
            `501 {"error":"tipAmount is not supported; Jupiter's tip is only
            redeemable through tx.jup.ag"}`. This is a Jupiter-native tip and
            not a Jito tip; the `tipInstruction` field in the response is
            always `null`. If you need a Jito tip, request it on `/order` via
            `jitoTipLamports` and set an appropriate `broadcastFeeType`.
          schema:
            type: integer
            minimum: 1
        - name: computeUnitPricePercentile
          in: query
          required: false
          description: >
            Priority-fee percentile to target. Accepted string values are
            `medium`, `high`, and `veryHigh`; the server maps them one rung
            down from Jupiter's naming: `medium` → 25th percentile, `high` →
            50th percentile, `veryHigh` → 75th percentile.

            When omitted, the server uses the same Alchemy priority-fee
            estimate that `/order` uses by default: Medium (50th percentile,
            which is Jupiter's `high` rung) — omitting this parameter does not
            leave Metis's own price in place.

            A numeric percentile returns
            `501 {"error":"numeric computeUnitPricePercentile is not
            supported; use medium, high, or veryHigh"}`. A failed estimate
            returns `502`. A zero estimate is still emitted as
            `SetComputeUnitPrice(0)`. The total priority fee is capped at
            1,000,000 lamports.
          schema:
            type: string
            enum: [medium, high, veryHigh]
        - name: mode
          in: query
          required: false
          description: >
            Reserved for future routing modes. Only `fast` is currently valid;
            any other value returns `400`. Accepting it does not change
            routing.
          schema:
            type: string
            enum: [fast]
        - name: forJitoBundle
          in: query
          required: false
          description: >
            Set to `true` when you plan to submit the swap inside a Jito
            bundle. Adjusts instruction ordering and priority-fee handling for
            bundle inclusion.
          schema:
            type: boolean
        - name: referralFee
          in: query
          required: false
          description: >
            Integrator fee in basis points. Must be an integer in the range
            50-255 and must be sent together with `referralAccount`. Mutually
            exclusive with `platformFeeBps` and `feeAccount`.

            Errors:

            * Out of range or not a number: `400 {"error":"referralFee must be
              a number between 50 and 255"}`.
            * One of `referralFee` / `referralAccount` without the other:
              `400 {"error":"referralFee and referralAccount must be provided
              together"}`.
            * Sent together with `platformFeeBps` or `feeAccount`:
              `400 {"error":"referralFee and referralAccount are mutually
              exclusive with platformFeeBps and feeAccount"}`.

            The `/build` response does NOT include the `feeBps` or `platformFee`
            fields returned by `/order`.
          schema:
            type: integer
            minimum: 50
            maximum: 255
        - name: referralAccount
          in: query
          required: false
          description: >
            Referral project account used to derive the destination fee token
            account. Must be sent together with `referralFee`. Mutually
            exclusive with `platformFeeBps` and `feeAccount`.

            The fee is deposited into the PDA
            `["referral_ata", referralAccount, feeMint]` under
            `REFER4ZgmyYx9c6He5XfaTMiGfdLwRnkV4RPp9t9iF3`. On `/build` the fee
            mint is always the output mint (Metis's `/build` has no
            `swapMode`). That token account must already exist; this API cannot
            create it.

            Errors:

            * Missing (uninitialized) fee account:
              `400 {"error":"referral account is not initialized"}`.
            * One of `referralFee` / `referralAccount` without the other:
              `400 {"error":"referralFee and referralAccount must be provided
              together"}`.
            * Malformed key: `400 {"error":"Invalid referralAccount"}`.
            * Sent together with `platformFeeBps` or `feeAccount`:
              `400 {"error":"referralFee and referralAccount are mutually
              exclusive with platformFeeBps and feeAccount"}`.
          schema:
            type: string
      responses:
        "200":
          description: Quote fields plus decomposed swap instructions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuildResponse"
              example:
                inputMint: So11111111111111111111111111111111111111112
                outputMint: EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v
                inAmount: "1000000000"
                outAmount: "234506710"
                otherAmountThreshold: "233333336"
                swapMode: ExactIn
                slippageBps: 50
                priceImpact: -0.05
                priceImpactPct: "-0.0005"
                routePlan:
                  - swapInfo:
                      ammKey: 5Q544fKrFoe6tsEbD7S8EmxGTJYAKtTVhAW5Q5pge4j1
                      label: Orca V2
                      inputMint: So11111111111111111111111111111111111111112
                      outputMint: EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v
                      inAmount: "1000000000"
                      outAmount: "234506710"
                    percent: 100
                    bps: 10000
                    usdValue: 234.3
                setupInstructions: []
                swapInstruction:
                  programId: JUP6LkbZbjS1jKKwapdHNy74zcZ3tLUZoi5QNyVTaV4
                  accounts:
                    - pubkey: GkwFnmMDvn3HGMpJpWBg8tgJxr3NxNvg3AXxvXVPbRGJ
                      isSigner: true
                      isWritable: true
                  data: AQAAAA...
                cleanupInstruction: null
                computeBudgetInstructions:
                  - programId: ComputeBudget111111111111111111111111111111
                    accounts: []
                    data: AgAAAA==
                otherInstructions: []
                tipInstruction: null
                addressesByLookupTableAddress:
                  AddrLookupTab1e1111111111111111111111111111:
                    - EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v
                    - So11111111111111111111111111111111111111112
                blockhashWithMetadata:
                  blockhash:
                    [
                      12,
                      34,
                      56,
                      78,
                      90,
                      12,
                      34,
                      56,
                      78,
                      90,
                      12,
                      34,
                      56,
                      78,
                      90,
                      12,
