  "/{apiKey}/swap/v2/execute":
    post:
      summary: Execute Gasless Order
      description: >
        Submits a gasless order to Solana. Send the transaction from a
        `gasless=true` [Get Order](/docs/chains/solana/solana-trader-api/get-swap-order)
        response after the `taker` signs it, together with that response's
        `requestId`. Alchemy checks the transaction, adds the sponsor's
        signature, and sends it to the network. A gasless transaction can only
        be sent through this endpoint, since it can't land without Alchemy's
        signature.


        The response returns `Pending` right away and doesn't include the
        transaction signature. To see the result, watch the taker's wallet (for
        example, its token balances or `getSignaturesForAddress`) until
        `lastValidBlockHeight` has passed. After that height the transaction
        can never land. Each wallet can have one gasless transaction in flight
        at a time.
      x-compute-units: 100
      x-rate-limit-cus: 1
      operationId: execute-swap-order
      parameters:
        - $ref: "#/components/parameters/apiKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExecuteRequest"
      responses:
        "200":
          description: >
            The transaction was sent. Watch the taker's wallet until
            `lastValidBlockHeight` has passed. Calling this endpoint again with
            the same body sends nothing and returns `Pending` again, so don't
            retry in a loop. If the order expires without landing, request a
            new one from Get Order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExecuteResponse"
              example:
                status: Pending
                lastValidBlockHeight: "451815799"
        "400":
          description: >
            The request or the transaction was rejected. Nothing was sent or
            charged. If the transaction would fail (for example, after a price
            move or because the funds were moved), call Get Order again for a
            new order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                missingSignedTransaction:
                  summary: signedTransaction missing
                  value:
                    error: signedTransaction is required
                missingRequestId:
                  summary: requestId missing
                  value:
                    error: requestId is required
                invalidSignedTransaction:
                  summary: signedTransaction malformed
                  value:
                    error: Invalid signedTransaction
                invalidRequestId:
                  summary: requestId malformed
                  value:
                    error: Invalid requestId
                orderMismatch:
                  summary: Transaction changed after Get Order, or requestId from another order
                  value:
                    error: signedTransaction does not match the order
                missingSignature:
                  summary: Taker signature missing or wrong
                  value:
                    error: signedTransaction is missing a valid signature
                wouldFail:
                  summary: Transaction failed simulation
                  value:
                    error: the transaction would fail; request a new order
        "409":
          description: >
            Another gasless order from the same taker is still in flight. Wait
            until it lands or its `lastValidBlockHeight` passes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: another gasless order from this taker is still in flight; retry once it lands
        "502":
          description: Temporary submission failure. You can retry the same body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: could not submit the transaction

  "/{apiKey}/swap/v2/build":
    get:
      summary: Build Swap Instructions
      description: "Returns raw Solana swap instructions rather than a pre-built transaction."
      x-compute-units: 100
      x-rate-limit-cus: 60
      operationId: build-swap-instructions
      parameters:
        - $ref: "#/components/parameters/apiKey"
        - $ref: "#/components/parameters/InputMint"
        - $ref: "#/components/parameters/OutputMint"
        - name: amount
          in: query
          required: true
          description: >
            Amount of the input token to swap, in its smallest unit (lamports
            for SOL, base units for SPL tokens).
          schema:
            type: string
          example: "1000000000"
        - name: taker
          in: query
          required: true
          description: >
            Public key of the wallet that will sign the swap instructions.
            Required for `/build` since the instructions must reference concrete
            source and destination accounts.
          schema:
            type: string
          example: GkwFnmMDvn3HGMpJpWBg8tgJxr3NxNvg3AXxvXVPbRGJ
        - name: payer
          in: query
          required: false
          description: >
            Wallet that sponsors rent and account creation for `taker`. The
            taker still signs and pays the trade amount. To have this wallet
            also pay signature and priority fees, set it as the fee payer when
            you assemble the transaction. Any valid public key can be used; it
            has no effect when equal to `taker`.
          schema:
            type: string
        - name: slippageBps
          in: query
          required: false
          description: |
            Slippage tolerance in basis points, 0–10000.

            `rtse` (automatic slippage) is not supported.
          schema:
            type: integer
            minimum: 0
            maximum: 10000
            default: 50
          example: 50
        - name: dexes
          in: query
          required: false
          description: >
            Comma-separated list of DEX labels to allow-list for routing
            (labels are case-sensitive). Mutually exclusive with `excludeDexes`.
          schema:
            type: string
        - name: excludeDexes
          in: query
          required: false
          description: >
            Comma-separated list of DEX labels to exclude from routing (labels
            are case-sensitive). Mutually exclusive with `dexes`.
          schema:
            type: string
        - name: platformFeeBps
          in: query
          required: false
          description: "Integrator fee in basis points (0–10000). When greater than zero, `feeAccount` is required. Mutually exclusive with `referralFee` and `referralAccount`."
          schema:
            type: integer
            minimum: 0
            maximum: 10000
        - name: feeAccount
          in: query
          required: false
          description: "Token account that receives the integrator fee. Required when `platformFeeBps` is greater than zero. Only validated as a public key. Mutually exclusive with `referralFee` and `referralAccount`."
          schema:
            type: string
        - name: maxAccounts
          in: query
          required: false
          description: "Maximum number of accounts the selected route may use, from 1 to 64. Lower values may restrict available routes."
          schema:
            type: integer
            minimum: 1
            maximum: 64
        - name: wrapAndUnwrapSol
          in: query
          required: false
          description: >
            When `true`, Metis inserts wrap-SOL and unwrap-SOL instructions
            around the swap so native SOL can be used directly as input or
            output.
          schema:
            type: boolean
        - name: destinationTokenAccount
          in: query
          required: false
          description: >
            Explicit destination SPL token account for the output tokens.
            Mutually exclusive with `nativeDestinationAccount`.
          schema:
            type: string
        - name: nativeDestinationAccount
          in: query
          required: false
          description: >
            Explicit destination wallet for native SOL output. Mutually
            exclusive with `destinationTokenAccount`.
          schema:
            type: string
        - name: blockhashSlotsToExpiry
          in: query
          required: false
          description: "Number of slots the returned blockhash remains valid for, from 1 to 255."
          schema:
            type: integer
            minimum: 1
            maximum: 255
        - name: tipAmount
          in: query
          required: false
          description: "Not supported."
          schema:
            type: integer
            minimum: 1
        - name: computeUnitPricePercentile
          in: query
          required: false
          description: "Priority-fee level to target: `medium` (25th percentile), `high` (50th), or `veryHigh` (75th). If omitted, the 50th percentile is used. Numeric percentiles are not supported. The total priority fee is capped at 1,000,000 lamports."
          schema:
            type: string
            enum: [medium, high, veryHigh]
        - name: mode
          in: query
          required: false
          description: "Only `fast` is accepted; it currently has no effect on routing."
          schema:
            type: string
            enum: [fast]
        - name: forJitoBundle
          in: query
          required: false
          description: "Set to `true` when quoting a swap intended for a Jito bundle. Forwarded to the routing engine."
          schema:
            type: boolean
        - name: referralFee
          in: query
          required: false
          description: "Integrator fee in basis points (50–255). Must be sent with `referralAccount`. Mutually exclusive with `platformFeeBps` and `feeAccount`."
          schema:
            type: integer
            minimum: 50
            maximum: 255
        - name: referralAccount
          in: query
          required: false
          description: >
            Referral account in the referral program. Must be sent with
            `referralFee`. The fee is charged in the output token and paid into
            that mint’s fee token account under this referral account. That
            token account must already exist. Mutually exclusive with
            `platformFeeBps` and `feeAccount`.
          schema:
            type: string
      responses:
        "200":
          description: Quote fields plus decomposed swap instructions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuildResponse"
              example:
                inputMint: So11111111111111111111111111111111111111112
                outputMint: EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v
                inAmount: "1000000000"
                outAmount: "234506710"
                otherAmountThreshold: "233333336"
                swapMode: ExactIn
                slippageBps: 50
                priceImpact: -0.05
                priceImpactPct: "-0.0005"
                routePlan:
                  - swapInfo:
                      ammKey: 5Q544fKrFoe6tsEbD7S8EmxGTJYAKtTVhAW5Q5pge4j1
                      label: Orca V2
                      inputMint: So11111111111111111111111111111111111111112
                      outputMint: EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v
                      inAmount: "1000000000"
                      outAmount: "234506710"
                    percent: 100
                    bps: 10000
                    usdValue: 234.3
                setupInstructions: []
                swapInstruction:
                  programId: JUP6LkbZbjS1jKKwapdHNy74zcZ3tLUZoi5QNyVTaV4
                  accounts:
                    - pubkey: GkwFnmMDvn3HGMpJpWBg8tgJxr3NxNvg3AXxvXVPbRGJ
                      isSigner: true
                      isWritable: true
                  data: AQAAAA...
                cleanupInstruction: null
                computeBudgetInstructions:
                  - programId: ComputeBudget111111111111111111111111111111
                    accounts: []
                    data: AgAAAA==
                otherInstructions: []
                tipInstruction: null
                addressesByLookupTableAddress:
                  AddrLookupTab1e1111111111111111111111111111:
                    - EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v
                    - So11111111111111111111111111111111111111112
                blockhashWithMetadata:
                  blockhash:
                    [
                      12,
                      34,
                      56,
                      78,
                      90,
                      12,
                      34,
                      56,
                      78,
                      90,
                      12,
                      34,
                      56,
                      78,
                      90,
                      12,
                      34,
                      56,
                      78,
                      90,
                      12,
                      34,
                      56,
                      78,
                      90,
                      12,
                      34,
                      56,
                      78,
                      90,
                      12,
                      34,
                    ]
                  lastValidBlockHeight: 300000000
                  fetchedAt:
                    secs_since_epoch: 1750000000
                    nanos_since_epoch: 0

  "/{apiKey}/quote-multiple-output-mints":
    post:
      summary: Quote Multiple Output Mints
      description: >
        Returns quotes for a single input mint against up to 32 candidate
        output mints in one call. Useful for pricing a basket or comparing
        outputs without issuing N separate requests. Each quote in the
        response carries only `inAmount` and `outAmount`; use `/order` for the
        full quote surface (route plan, fees, transaction) on a single mint
        pair.
      x-compute-units: 100
      x-rate-limit-cus: 100
      operationId: quote-multiple-output-mints
      parameters:
        - $ref: "#/components/parameters/apiKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MultiQuoteRequest"
      responses:
        "200":
          description: >
            An object keyed by output mint (in request order) with the priced
            amounts for each, plus a shared `contextSlot`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MultiQuoteResponse"
              example:
                quotes:
                  EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v:
                    inAmount: "1000000000"
                    outAmount: "234506710"
                  Es9vMFrzaCERmJfrF4H2FYD4KCoNkY11McCe8BenwNYB:
                    inAmount: "1000000000"
                    outAmount: "234481933"
                contextSlot: 300000000

components:
  securitySchemes:
    apiKey:
      type: apiKey
      name: Authorization
      in: header
      description: >
        Trader API requests carry the API key in the URL path, not in a header.
        This scheme is defined to satisfy tooling and is unused by the
        endpoints.
      x-default: Bearer API_KEY
  parameters:
    apiKey:
      name: apiKey
      in: path
      required: true
      schema:
        type: string
        default: docs-demo
      description: For higher throughput, [create your own API key](https://dashboard.alchemy.com/signup).
    InputMint:
      name: inputMint
      in: query
      required: true
      description: Mint address of the input token.
      schema:
        type: string
      example: So11111111111111111111111111111111111111112
    OutputMint:
      name: outputMint
      in: query
      required: true
      description: Mint address of the output token.
      schema:
        type: string
      example: EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v
    Amount:
      name: amount
      in: query
      required: true
      description: >
        Amount to swap in the smallest unit of the input token (lamports for
        native SOL, base units for SPL tokens). Refers to the input token by
        default, or to the output token when `swapMode` is `ExactOut`.
      schema:
        type: string
      example: "1000000000"
  schemas:
    OrderResponse:
      type: object
      description: Quote fields plus an assembled transaction when a taker was supplied.
      properties:
        mode:
          type: string
          description: >
            Compatibility mode label: `ultra` or `manual`. Informational only;
            both are processed identically.
        inputMint:
          type: string
          description: Mint of the input token, echoed back.
        outputMint:
          type: string
          description: Mint of the output token, echoed back.
        inAmount:
          type: string
          description: >
            Input amount used for the quote, in base units of the input mint.
            With `gasless=true`, this is the requested `amount` minus
            `gaslessFee.amount`.
        outAmount:
          type: string
          description: >
            Estimated output amount before slippage, in base units of the
            output mint.
        otherAmountThreshold:
          type: string
          description: >
            Slippage threshold, in base units. On `ExactIn` this is the minimum
            output amount after slippage; on `ExactOut` this is the maximum
            input amount after slippage. Always present.
        swapMode:
          type: string
          description: Swap mode used to build the quote.
          enum: [ExactIn, ExactOut]
        slippageBps:
          type: integer
          description: Slippage tolerance in basis points.
        priceImpact:
          type: number
          description: >
            Price impact of the swap, in percentage points (for example, `-0.1`
            means -0.1%). Always present.
        priceImpactPct:
          type: string
          description: >
            Price impact as a decimal fraction string. Divide `priceImpact` by
            100 to reconcile the two values.
        inUsdValue:
          type: number
          description: >
            USD value of the input amount at quote time. Omitted (not `null`)
            when the input mint cannot be priced.
        outUsdValue:
          type: number
          description: >
            USD value of the output amount at quote time. Omitted (not `null`)
            when the output mint cannot be priced.
        swapUsdValue:
          type: number
          description: >
            USD value of the swap, equal to either `inUsdValue` or
            `outUsdValue` depending on the token pair. Omitted when neither
            side can be priced.
        swapType:
          type: string
          description: Quote routing category. Always `aggregator`.
        gasless:
          type: boolean
          description: >
            `true` on a ready gasless transaction (`gasless=true`), or when a
            ready transaction uses a `payer` different from the `taker`;
            otherwise `false`.
        router:
          type: string
          description: Router that produced the quote. Always `metis`.
        routePlan:
          type: array
          description: Ordered list of route steps that make up the swap.
          items:
            $ref: "#/components/schemas/RoutePlanStep"
        transaction:
          type: ["string", "null"]
          description: >
            Base64-encoded unsigned Solana transaction. `null` when no `taker`
            was supplied; empty when funding was insufficient—see `errorCode`.
        taker:
          type: ["string", "null"]
          description: >
            Taker echoed back from the request. Always present. `null` when
            `taker` was not supplied.
        lastValidBlockHeight:
          type: string
          description: >
            Block height beyond which the assembled transaction is no longer
            valid, as a decimal string. Omitted (not `null`) when the response
            does not carry a usable transaction.
        signatureFeeLamports:
          type: integer
          description: >
            Estimated signature fee in lamports. `0` without a ready
            transaction. A sponsored transaction requires two signatures and
            reports `10000`.
        prioritizationFeeLamports:
          type: integer
          description: >
            Estimated priority fee, including any Jito tip, in lamports. `0`
            without a ready transaction.
        rentFeeLamports:
          type: integer
          description: >
            Estimated token-account rent in lamports. `0` without a ready
            transaction.
        signatureFeePayer:
          type: ["string", "null"]
          description: >
            Wallet that pays the signature fee. The sponsor when `payer`
            differs from `taker`; otherwise the taker. `null` without a ready
            transaction.
        prioritizationFeePayer:
          type: ["string", "null"]
          description: >
            Wallet that pays the priority fee and any Jito tip. The sponsor
            when `payer` differs from `taker`; otherwise the taker. `null`
            without a ready transaction.
        rentFeePayer:
          type: ["string", "null"]
          description: >
            Wallet that pays token-account rent. The sponsor when `payer`
            differs from `taker`; otherwise the taker. `null` without a ready
            transaction.
        totalTime:
          type: number
          description: Time in milliseconds spent producing the response.
        requestId:
          type: string
          description: >
            Identifier of a ready gasless order. Pass it to Execute Gasless
            Order together with the signed transaction. Present only when
            `gasless=true` returns a ready transaction.
        gaslessFee:
          $ref: "#/components/schemas/GaslessFee"
        feeBps:
          type: integer
          description: >
            Referral fee in basis points. Present only when `referralFee` and
            `referralAccount` were supplied.
        feeMint:
          type: string
          description: >
            Mint in which the referral fee is quoted: the output mint on
            ExactIn or input mint on ExactOut.
        platformFee:
          type: object
          description: >
            Quoted referral-fee details. Present only when `referralFee` and
            `referralAccount` were supplied.
          properties:
            amount:
              type: string
              description: Fee amount in the smallest unit of `feeMint`.
            feeBps:
              type: integer
              description: Referral fee in basis points, echoed back.
            feeMint:
              type: string
              description: >
                Mint of the token in which the fee is charged. Optional inside
                `platformFee`; when present, matches the top-level `feeMint`.
          required:
            - amount
            - feeBps
        errorCode:
          type: integer
          description: |
            Present only when `transaction` is empty because the order can't be
            filled. Branch on this code, not on the message text:

            * `1` — insufficient input funds
            * `2` — insufficient SOL for transaction costs
            * `3` — gasless order refused: the taker holds enough SOL to pay
              its own fees (retry without `gasless=true`), the swap is below
              the gasless minimum (increase the amount), or the route costs
              more to sponsor than the gasless fee covers (retry, or change the
              amount or pair)
        errorMessage:
          type: string
          description: >
            Human-readable error. Present with `errorCode`; match on the code
            instead of this message.
        error:
          type: string
          description: Duplicate of `errorMessage`, retained for compatibility.
      required:
        - mode
        - inputMint
        - outputMint
        - inAmount
        - outAmount
        - otherAmountThreshold
        - swapMode
        - slippageBps
        - priceImpact
        - priceImpactPct
        - swapType
        - gasless
        - router
        - routePlan
        - transaction
        - taker
        - signatureFeeLamports
        - prioritizationFeeLamports
        - rentFeeLamports
        - signatureFeePayer
        - prioritizationFeePayer
        - rentFeePayer
        - totalTime

    GaslessFee:
      type: object
      description: >
        Fee for a gasless order, taken out of the input token inside the same
        transaction: 0.5% of `amount` plus the exact network costs (two
        signatures, the priority fee, and rent for any token account the swap
        opens). Present only on a ready gasless order.
      properties:
        amount:
          type: string
          description: Total fee, in base units of `feeMint`.
        feeMint:
          type: string
          description: Mint the fee is taken in. Always the input token.
        feeBps:
          type: integer
          description: >
            Percentage part of the fee in basis points (`50` = 0.5%). The rest
            of `amount` covers network costs.
        swappedTo:
          type: string
          description: >
            Present when the input token isn't SOL, USDC, or USDT. Part of the
            input is swapped to this stablecoin inside the same transaction to
            pay the fee.
          enum:
            - EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v
            - Es9vMFrzaCERmJfrF4H2FYD4KCoNkY11McCe8BenwNYB
        minSwapOut:
          type: string
          description: >
            Present with `swappedTo`. Minimum amount of the stablecoin Alchemy
            receives, in its base units.
      required:
        - amount
        - feeMint
        - feeBps

    ExecuteRequest:
      type: object
      properties:
        signedTransaction:
          type: string
          description: >
            Base64-encoded transaction from the gasless Get Order response,
            signed by the `taker`. Don't change the transaction after Get
            Order.
          example: AgAAAA...base64-encoded-transaction-signed-by-taker...
        requestId:
          type: string
          description: "`requestId` from the same Get Order response."
          example: 1.451815799.cb38qqMuKzJgEkjr5Z8qYQzLAZpJntLbyPnteXDwD8A
      required:
        - signedTransaction
        - requestId

    ExecuteResponse:
      type: object
      properties:
        status:
          type: string
          description: >
            Always `Pending`. The response doesn't include the transaction
            signature; watch the taker's wallet for the result.
          enum: [Pending]
        lastValidBlockHeight:
          type: string
          description: >
            Block height after which the transaction can no longer land, as a
            decimal string.
      required:
        - status
        - lastValidBlockHeight

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          description: Error message.
      required:
        - error

    BuildResponse:
      type: object
      description: Quote fields plus decomposed swap instructions.
      properties:
        inputMint:
          type: string
          description: Mint of the input token, echoed back.
        outputMint:
          type: string
          description: Mint of the output token, echoed back.
        inAmount:
          type: string
          description: Input amount used for the quote, in base units of the input mint.
        outAmount:
          type: string
          description: >
            Estimated output amount before slippage, in base units of the
            output mint.
        otherAmountThreshold:
          type: string
          description: >
            Minimum output amount after slippage is applied, in base units of
            the output mint. `/build` is `ExactIn` only, so this is always a
            minimum output.
        swapMode:
          type: string
          description: >
            Swap mode used to build the instructions. `/build` supports
            `ExactIn` only.
          enum: [ExactIn]
        slippageBps:
          type: integer
          description: Slippage tolerance in basis points applied to the quote.
        priceImpact:
          type: number
          description: >
            Price impact of the swap, in percentage points (for example, `-0.1`
            means -0.1%). Same number as `/order`'s `priceImpact`. Always
            present.
        priceImpactPct:
          type: string
          description: >
            Price impact as a decimal fraction string. `priceImpact` divided
            by 100. Always present.
        routePlan:
          type: array
          description: Ordered list of route steps that make up the swap.
          items:
            $ref: "#/components/schemas/RoutePlanStep"
        setupInstructions:
          type: array
          description: >
            Instructions that must run before the swap (for example, create an
            associated token account or wrap SOL). Always present; may be
            empty.
          items:
            $ref: "#/components/schemas/Instruction"
        swapInstruction:
          $ref: "#/components/schemas/Instruction"
        cleanupInstruction:
          description: >
            Optional instruction that runs after the swap (for example, close a
            temporary wrapped-SOL account and reclaim rent). `null` when no
            cleanup is required.
          oneOf:
            - $ref: "#/components/schemas/Instruction"
            - type: "null"
        computeBudgetInstructions:
          type: array
          description: >
            Compute-budget instructions for the caller's transaction. Contains
            exactly one `SetComputeUnitPrice` and no `SetComputeUnitLimit`;
            other compute-budget instruction types may be preserved. The price
            uses the requested priority-fee level, or the 50th percentile when
            omitted. A zero estimate is emitted as `SetComputeUnitPrice(0)`.
            The price is capped using an estimated fee ceiling of 1,000,000
            lamports.
          items:
            $ref: "#/components/schemas/Instruction"
        otherInstructions:
          type: array
          description: >
            Additional instructions Metis wants included in the final
            transaction (for example, integrator fee transfers). Always
            present; may be empty.
          items:
            $ref: "#/components/schemas/Instruction"
        tipInstruction:
          description: >
            Reserved for a native tip. Always `null` on `/build`
            because `tipAmount` is not supported here (see the `tipAmount`
            parameter). If you need a Jito tip, use `/order`'s
            `jitoTipLamports` instead.
          oneOf:
            - $ref: "#/components/schemas/Instruction"
            - type: "null"
        addressesByLookupTableAddress:
          type: ["object", "null"]
          description: >
            Address lookup table accounts referenced by the swap, keyed by
            lookup-table address. Each value is the ordered list of accounts
            resolved from that table. `null` when the route uses no lookup
            tables. Never an empty object.
          additionalProperties:
            type: array
            items:
              type: string
        blockhashWithMetadata:
          $ref: "#/components/schemas/BlockhashWithMetadata"
      required:
        - inputMint
        - outputMint
        - inAmount
        - outAmount
        - otherAmountThreshold
        - swapMode
        - slippageBps
        - priceImpact
        - priceImpactPct
        - routePlan
        - setupInstructions
        - swapInstruction
        - cleanupInstruction
        - computeBudgetInstructions
        - otherInstructions
        - tipInstruction
        - addressesByLookupTableAddress
        - blockhashWithMetadata

    BlockhashWithMetadata:
      type: object
      description: >
        Recent blockhash Metis fetched for the swap transaction, plus its
        expiry and the timestamp this service stamped when building the
        response.
      properties:
        blockhash:
          type: array
          description: >
            Blockhash as an array of 32 unsigned bytes. It is not
            base58-encoded.
          minItems: 32
          maxItems: 32
          items:
            type: integer
            minimum: 0
            maximum: 255
        lastValidBlockHeight:
          type: integer
          description: >
            Block height beyond which the blockhash is no longer valid, as a
            JSON number. (On `/order`'s top-level response the equivalent
            `lastValidBlockHeight` is a decimal string; on `/build` here it is
            a number.)
        fetchedAt:
          type: object
          description: >
            Timestamp this service stamps when building the response. Keys are
            snake_case as returned.
          properties:
            secs_since_epoch:
              type: integer
              description: Seconds since Unix epoch.
            nanos_since_epoch:
              type: integer
              description: Nanoseconds portion of the timestamp.
          required:
            - secs_since_epoch
            - nanos_since_epoch
      required:
        - blockhash
        - lastValidBlockHeight
        - fetchedAt

    Instruction:
      type: object
      description: A Solana instruction in decomposed form.
      properties:
        programId:
          type: string
          description: ID of the program invoked by this instruction.
        accounts:
          type: array
          items:
            $ref: "#/components/schemas/AccountMeta"
        data:
          type: string
          description: Base64-encoded instruction data.
      required:
        - programId
        - accounts
        - data

    AccountMeta:
      type: object
      properties:
        pubkey:
          type: string
        isSigner:
          type: boolean
        isWritable:
          type: boolean
      required:
        - pubkey
        - isSigner
        - isWritable

    RoutePlanStep:
      type: object
      properties:
        swapInfo:
          $ref: "#/components/schemas/SwapInfo"
        percent:
          type: integer
          description: Router-assigned percentage for this route step, from 0 to 100.
          minimum: 0
          maximum: 100
        bps:
          type: integer
          description: Router-assigned share for this route step in basis points, from 0 to 10000.
          minimum: 0
          maximum: 10000
        usdValue:
          type: number
          description: >
            USD value of this step's input amount. Omitted when its input mint
            cannot be priced.
      required:
        - swapInfo
        - percent
        - bps

    SwapInfo:
      type: object
      properties:
        ammKey:
          type: string
          description: On-chain address of the AMM pool used for this step.
        label:
          type: string
          description: Human-readable DEX label (for example, `Orca V2`, `Raydium CLMM`).
        inputMint:
          type: string
        outputMint:
          type: string
        inAmount:
          type: string
        outAmount:
          type: string
      required:
        - ammKey
        - label
        - inputMint
        - outputMint
        - inAmount
        - outAmount

    MultiQuoteRequest:
      type: object
      properties:
        inputMint:
          type: string
          description: Mint address of the input token.
          example: So11111111111111111111111111111111111111112
        amount:
          type: string
          description: >
            Amount to price, in base units of the input mint (or the desired
            output amount when `swapMode` is `ExactOut`). Must be a JSON
            string; a JSON number returns `400`.
          example: "1000000000"
        outputMints:
          type: array
          description: >
            Mint addresses of the candidate output tokens (1-32). Entries must
            be unique and none may equal `inputMint`.
          minItems: 1
          maxItems: 32
          items:
            type: string
          example:
            - EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v
            - Es9vMFrzaCERmJfrF4H2FYD4KCoNkY11McCe8BenwNYB
        swapMode:
          type: string
          enum: [ExactIn, ExactOut]
          default: ExactIn
          description: >
            Swap mode applied to every quote in the batch. On `ExactOut`,
            `amount` is the desired output for each mint independently.
      required:
        - inputMint
        - amount
        - outputMints

    MultiQuoteResponse:
      type: object
      description: >
        Priced amounts for each requested output mint, plus a shared context
        slot. The response deliberately omits route plans, fees, transactions,
        and per-mint errors — use `/order` for the full quote surface on a
        single mint pair.
      properties:
        quotes:
          type: object
          description: >
            Object keyed by output mint (in request order). Each value carries
            the priced amounts only.
          additionalProperties:
            $ref: "#/components/schemas/MultiQuoteEntry"
        contextSlot:
          type: integer
          description: >
            Oldest slot any quote in `quotes` reported. Omitted when none of
            the quotes carried a slot.
      required:
        - quotes

    MultiQuoteEntry:
      type: object
      properties:
        inAmount:
          type: string
          description: Input amount in base units of the input mint.
        outAmount:
          type: string
          description: Priced output amount in base units of the output mint.
      required:
        - inAmount
        - outAmount
