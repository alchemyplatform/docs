# yaml-language-server: $schema=https://spec.openapis.org/oas/3.1/schema/2022-10-07
# Trader API spec — see DOCS-227 for the ongoing review.

openapi: 3.1.0
info:
  title: 💱 Solana Trader API
  description: >
    Alchemy's Solana Trader API returns swap quotes and, on request, an assembled
    signable transaction for routing token swaps on Solana, and can sponsor
    network costs for wallets that hold no SOL (gasless). Requests are
    authenticated with your Alchemy API key in the URL path, the same key that
    powers your other Solana RPC calls. Powered by Metis.
  version: "1.0"
servers:
  - url: https://solana-mainnet.g.alchemy.com/v2
    description: Solana Mainnet
paths:
  "/{apiKey}/swap/v2/order":
    get:
      summary: Get Order
      description: "Returns a swap quote for `inputMint` → `outputMint`."
      x-compute-units: 100
      x-rate-limit-cus: 80
      operationId: get-swap-order
      parameters:
        - $ref: "#/components/parameters/apiKey"
        - $ref: "#/components/parameters/InputMint"
        - $ref: "#/components/parameters/OutputMint"
        - $ref: "#/components/parameters/Amount"
        - name: taker
          in: query
          required: false
          description: >
            Public key of the wallet that will sign the transaction. When
            omitted, the response returns a quote only and `transaction` is
            `null`. Required to receive a gasless transaction with
            `gasless=true`.
          schema:
            type: string
          example: GkwFnmMDvn3HGMpJpWBg8tgJxr3NxNvg3AXxvXVPbRGJ
        - name: gasless
          in: query
          required: false
          description: >
            Set to `true` to have Alchemy pay the Solana network costs for a
            `taker` that holds no SOL. The taker repays those costs plus a 0.5%
            fee out of the input token, inside the same transaction. The
            response includes a `requestId`; sign the transaction and submit it
            with [Execute Gasless Order](/docs/chains/solana/solana-trader-api/execute-swap-order).
            Gasless orders are `ExactIn` only, need `slippageBps` of at least
            15, and can't be combined with `payer` or `jitoTipLamports`. See
            [Swap without SOL](/docs/chains/solana/solana-trader-api/swap-without-sol).
          schema:
            type: boolean
            default: false
        - name: receiver
          in: query
          required: false
          description: >
            Wallet to receive the output instead of `taker` (omit to keep it
            with `taker`). Expects a wallet address, not a token account.
            Missing ATAs are created automatically.
          schema:
            type: string
        - name: swapMode
          in: query
          required: false
          description: How `amount` is interpreted. `ExactOut` can't be combined with `gasless=true`.
          schema:
            type: string
            enum: [ExactIn, ExactOut]
            oneOf:
              - type: string
                title: ExactIn
                description: Spend exactly `amount`; slippage sets the minimum you receive.
              - type: string
                title: ExactOut
                description: Receive exactly `amount`; slippage sets the maximum you spend.
        - name: slippageBps
          in: query
          required: false
          description: |
            Slippage tolerance in basis points, 0–10000. With `gasless=true`,
            the minimum is 15.

            `rtse` (automatic slippage) is not supported.
          schema:
            type: integer
            minimum: 0
            maximum: 10000
            default: 50
          example: 50
        - name: priorityFeeLamports
          in: query
          required: false
          description: >
            Custom priority fee, in lamports. Only used when `broadcastFeeType`
            is set; otherwise ignored and the fee is estimated automatically.
            Added to `jitoTipLamports` (if set) to form the fee total that
            `broadcastFeeType` applies. With `gasless=true`, it can only lower
            Alchemy's priority fee, never raise it, and the maximum is 400,000
            lamports.
          schema:
            type: integer
        - name: jitoTipLamports
          in: query
          required: false
          description: >
            Custom Jito tip, in lamports (minimum 1000). Only used when
            `broadcastFeeType` is set; otherwise ignored and the fee is
            estimated automatically. Added to `priorityFeeLamports` (if set)
            to form the fee total that `broadcastFeeType` applies. Can't be
            combined with `gasless=true`.
          schema:
            type: integer
            minimum: 1000
        - name: broadcastFeeType
          in: query
          required: false
          description: |
            How your custom fee (`priorityFeeLamports` + `jitoTipLamports`) is applied.

            When omitted, or sent without `priorityFeeLamports` or `jitoTipLamports`, the fee is estimated automatically.
          schema:
            type: string
            enum: [maxCap, exactFee]
            oneOf:
              - type: string
                title: exactFee
                description: Use exactly your fee total.
              - type: string
                title: maxCap
                description: Use the automatic estimate, capped at your fee total.
        - name: excludeDexes
          in: query
          required: false
          description: >
            Comma-separated list of DEX labels to exclude from routing. Labels
            are case-sensitive (for example, `Raydium,Orca+V2,Meteora+DLMM`).
          schema:
            type: string
        - name: excludeRouters
          in: query
          required: false
          description: "Not supported yet; routing uses only `metis`, so excluding it returns an error."
          schema:
            type: string
        - name: payer
          in: query
          required: false
          description: >
            Wallet that pays transaction costs (fees, Jito tip, token-account
            rent) for `taker`; the taker still signs and pays the trade
            amount. Any public key can be used; no effect if equal to `taker`.
            See `errorCode` for funding failures. Does not change `mode`.
            Can't be combined with `gasless=true`.
          schema:
            type: string
        - name: referralFee
          in: query
          required: false
          description: "Integrator fee in basis points (50–255). Must be sent with `referralAccount`."
          schema:
            type: integer
            minimum: 50
            maximum: 255
        - name: referralAccount
          in: query
          required: false
          description: >
            Referral account in the referral program. Must be sent with
            `referralFee`. The fee is charged in the output token on `ExactIn`
            and in the input token on `ExactOut`, and is paid into that mint’s
            fee token account under this referral account. That account must
            already exist.
          schema:
            type: string
      responses:
        "200":
          description: "Quote, plus an unsigned transaction when a funded `taker` is supplied. With `gasless=true`, also a `requestId` and `gaslessFee`. Insufficient funding or an ineligible gasless order returns `200` with an empty transaction and error fields."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderResponse"
              examples:
                quoteOnly:
                  summary: Quote-only (no taker)
                  value:
                    mode: ultra
                    inputMint: So11111111111111111111111111111111111111112
                    outputMint: EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v
                    inAmount: "1000000000"
                    outAmount: "234506710"
