# yaml-language-server: $schema=https://spec.openapis.org/oas/3.1/schema/2022-10-07
# Trader API spec — see DOCS-227 for the ongoing review.

openapi: 3.1.0
info:
  title: 💱 Solana Trader API
  description: >
    Alchemy's Solana Trader API returns swap quotes and, on request, an assembled
    signable transaction for routing token swaps on Solana. Requests are
    authenticated with your Alchemy API key in the URL path, the same key that
    powers your other Solana RPC calls. Alchemy currently routes Trader API
    requests through Metis.
  version: "1.0"
servers:
  - url: https://solana-mainnet.g.alchemy.com/v2
    description: Solana Mainnet
paths:
  "/{apiKey}/order":
    get:
      summary: Get Order
      description: "Returns a swap quote for `inputMint` → `outputMint`."
      x-compute-units: 100
      x-rate-limit-cus: 100
      operationId: get-swap-order
      parameters:
        - $ref: "#/components/parameters/apiKey"
        - $ref: "#/components/parameters/InputMint"
        - $ref: "#/components/parameters/OutputMint"
        - $ref: "#/components/parameters/Amount"
        - name: taker
          in: query
          required: false
          description: >
            Public key of the wallet that will sign the transaction. When
            omitted, the response returns a quote only and `transaction` is
            `null`.
          schema:
            type: string
          example: GkwFnmMDvn3HGMpJpWBg8tgJxr3NxNvg3AXxvXVPbRGJ
        - name: receiver
          in: query
          required: false
          description: >
            Wallet to receive the output instead of `taker` (omit to keep it
            with `taker`). Expects a wallet address, not a token account.
            Missing ATAs are created automatically. Switches `mode` to
            `manual`.
          schema:
            type: string
        - name: swapMode
          in: query
          required: false
          description: |
            How `amount` is interpreted.

            Switches `mode` to `manual`.
          schema:
            type: string
            enum: [ExactIn, ExactOut]
            oneOf:
              - type: string
                title: ExactIn
                description: Spend exactly `amount`; slippage sets the minimum you receive.
              - type: string
                title: ExactOut
                description: Receive exactly `amount`; slippage sets the maximum you spend.
        - name: slippageBps
          in: query
          required: false
          description: |
            Slippage tolerance in basis points, 0–10000 (50 = 0.5%). Defaults to 50. Switches `mode` to `manual`.

            `rtse` (automatic slippage) is not supported.
          schema:
            type: integer
            minimum: 0
            maximum: 10000
          example: 50
        - name: priorityFeeLamports
          in: query
          required: false
          description: >
            Custom priority fee, in lamports. Only used when `broadcastFeeType`
            is set; otherwise ignored and the fee is estimated automatically.
            Added to `jitoTipLamports` (if set) to form the fee total that
            `broadcastFeeType` applies.
          schema:
            type: integer
        - name: jitoTipLamports
          in: query
          required: false
          description: >
            Custom Jito tip, in lamports (minimum 1000). Only used when
            `broadcastFeeType` is set; otherwise ignored and the fee is
            estimated automatically. Added to `priorityFeeLamports` (if set)
            to form the fee total that `broadcastFeeType` applies.
          schema:
            type: integer
            minimum: 1000
        - name: broadcastFeeType
          in: query
          required: false
          description: |
            How your custom fee (`priorityFeeLamports` + `jitoTipLamports`) is applied.

            When omitted, or sent without `priorityFeeLamports` or `jitoTipLamports`, the fee is estimated automatically. Otherwise, switches `mode` to `manual`.
          schema:
            type: string
            enum: [maxCap, exactFee]
            oneOf:
              - type: string
                title: exactFee
                description: Use exactly your fee total.
              - type: string
                title: maxCap
                description: Use the automatic estimate, capped at your fee total.
        - name: excludeDexes
          in: query
          required: false
          description: >
            Comma-separated list of DEX labels to exclude from routing. Labels
            are case-sensitive (for example, `Raydium,Orca+V2,Meteora+DLMM`).
            Switches `mode` to `manual`.
          schema:
            type: string
        - name: excludeRouters
          in: query
          required: false
          description: "Not supported yet; routing uses only `metis`, so excluding it returns an error."
          schema:
            type: string
        - name: payer
          in: query
          required: false
          description: >
            Wallet that pays transaction costs (fees, Jito tip, token-account
            rent) for `taker`; the taker still signs and pays the trade
            amount. Any public key can be used; no effect if equal to `taker`.
            See `errorCode` for funding failures. Does not change `mode`.
          schema:
            type: string
        - name: referralFee
          in: query
          required: false
          description: "Integrator fee in basis points (50–255), paid to `referralAccount`. Both must be sent together."
          schema:
            type: integer
            minimum: 50
            maximum: 255
        - name: referralAccount
          in: query
          required: false
          description: >
            Referral project account used to derive the destination fee token
            account. Must be sent together with `referralFee`.

            The fee is deposited into the PDA
            `["referral_ata", referralAccount, feeMint]` under
            `REFER4ZgmyYx9c6He5XfaTMiGfdLwRnkV4RPp9t9iF3`. The fee mint is the
            output mint on `ExactIn` and the input mint on `ExactOut`. That
            token account must already exist; this API cannot create it.

            Errors:

            * Missing (uninitialized) fee account:
              `400 {"error":"referral account is not initialized"}`.
            * One of `referralFee` / `referralAccount` without the other:
              `400 {"error":"referralFee and referralAccount must be provided
              together"}`.
            * Malformed key: `400 {"error":"Invalid referralAccount"}`.

            When both parameters are accepted, the response includes optional
            `feeBps`, `feeMint`, and `platformFee` fields.
          schema:
            type: string
      responses:
        "200":
          description: Quote, plus an assembled transaction when a `taker` was supplied.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderResponse"
              examples:
                quoteOnly:
                  summary: Quote-only (no taker)
                  value:
                    mode: ultra
                    inputMint: So11111111111111111111111111111111111111112
                    outputMint: EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v
                    inAmount: "1000000000"
                    outAmount: "234506710"
                    otherAmountThreshold: "233333336"
                    swapMode: ExactIn
                    slippageBps: 50
                    priceImpact: -0.05
                    priceImpactPct: "-0.0005"
                    inUsdValue: 234.5
                    outUsdValue: 234.2
                    swapUsdValue: 234.3
                    swapType: aggregator
                    gasless: false
                    router: metis
                    routePlan:
