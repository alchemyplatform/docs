                      12,
                      34,
                    ]
                  lastValidBlockHeight: 300000000
                  fetchedAt:
                    secs_since_epoch: 1750000000
                    nanos_since_epoch: 0

  "/{apiKey}/quote-multiple-output-mints":
    post:
      summary: Quote Multiple Output Mints
      description: >
        Returns quotes for a single input mint against up to 32 candidate
        output mints in one call. Useful for pricing a basket or comparing
        outputs without issuing N separate requests. Each quote in the
        response carries only `inAmount` and `outAmount`; use `/order` for the
        full quote surface (route plan, fees, transaction) on a single mint
        pair.
      x-compute-units: 100
      x-rate-limit-cus: 100
      operationId: quote-multiple-output-mints
      parameters:
        - $ref: "#/components/parameters/apiKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MultiQuoteRequest"
      responses:
        "200":
          description: >
            An object keyed by output mint (in request order) with the priced
            amounts for each, plus a shared `contextSlot`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MultiQuoteResponse"
              example:
                quotes:
                  EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v:
                    inAmount: "1000000000"
                    outAmount: "234506710"
                  Es9vMFrzaCERmJfrF4H2FYD4KCoNkY11McCe8BenwNYB:
                    inAmount: "1000000000"
                    outAmount: "234481933"
                contextSlot: 300000000

components:
  securitySchemes:
    apiKey:
      type: apiKey
      name: Authorization
      in: header
      description: >
        Trader API requests carry the API key in the URL path, not in a header.
        This scheme is defined to satisfy tooling and is unused by the
        endpoints.
      x-default: Bearer API_KEY
  parameters:
    apiKey:
      name: apiKey
      in: path
      required: true
      schema:
        type: string
        default: docs-demo
      description: For higher throughput, [create your own API key](https://dashboard.alchemy.com/signup).
    InputMint:
      name: inputMint
      in: query
      required: true
      description: Mint address of the input token.
      schema:
        type: string
        default: So11111111111111111111111111111111111111112
      example: So11111111111111111111111111111111111111112
    OutputMint:
      name: outputMint
      in: query
      required: true
      description: Mint address of the output token.
      schema:
        type: string
        default: EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v
      example: EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v
    Amount:
      name: amount
      in: query
      required: true
      description: >
        Amount to swap in the smallest unit of the input token (lamports for
        native SOL, base units for SPL tokens). Refers to the input token by
        default, or to the output token when `swapMode` is `ExactOut`.
      schema:
        type: string
        default: "1000000000"
      example: "1000000000"
  schemas:
    OrderResponse:
      type: object
      description: Quote fields plus an assembled transaction when a taker was supplied.
      properties:
        mode:
          type: string
          description: >
            Router mode used to price the quote. Defaults to `ultra`; becomes
            `manual` when the caller sets `slippageBps`, `swapMode`, `receiver`,
            `excludeDexes`, `excludeRouters`, or a `broadcastFeeType` together
            with `priorityFeeLamports` or `jitoTipLamports`. `payer` does not
            change `mode`. The value echoed here reflects the effective mode
            only — echoed request defaults such as `slippageBps: 50` or
            `swapMode: ExactIn` do not on their own indicate the caller set
            them.
        inputMint:
          type: string
          description: Mint of the input token, echoed back.
        outputMint:
          type: string
          description: Mint of the output token, echoed back.
        inAmount:
          type: string
          description: Input amount used for the quote, in base units of the input mint.
        outAmount:
          type: string
          description: >
            Estimated output amount before slippage, in base units of the
            output mint.
        otherAmountThreshold:
          type: string
          description: >
            Slippage threshold, in base units. On `ExactIn` this is the minimum
            output amount after slippage; on `ExactOut` this is the maximum
            input amount after slippage. Always present.
        swapMode:
          type: string
          description: Swap mode used to build the quote.
          enum: [ExactIn, ExactOut]
        slippageBps:
          type: integer
          description: Slippage tolerance in basis points.
        priceImpact:
          type: number
          description: >
            Price impact of the swap, in percentage points (for example, `-0.1`
            means -0.1%). Always present.
        priceImpactPct:
          type: string
          description: >
            Price impact as a decimal fraction string. Divide `priceImpact` by
            100 to reconcile the two values.
        inUsdValue:
          type: number
          description: >
            USD value of the input amount at quote time. Omitted (not `null`)
            when the input mint cannot be priced.
        outUsdValue:
          type: number
          description: >
            USD value of the output amount at quote time. Omitted (not `null`)
            when the output mint cannot be priced.
        swapUsdValue:
          type: number
          description: >
            USD value of the swap at quote time. Exactly one of the two legs
            (input or output): a fiat-backed mint wins first (`USDC`, `USDT`,
            `PYUSD`, `USDS`, `FDUSD`, `EURC`), then SOL, and the input side
            wins a tie. Omitted (not `null`) when neither leg can be priced.
        swapType:
          type: string
          description: Router category that produced the quote (for example, `aggregator`).
        gasless:
          type: boolean
          description: >
            `true` only when a ready transaction was actually built with a
            `payer` that is not the taker. A `payer` equal to `taker`, a
            missing `payer`, a quote with no `taker`, or a 200 rejection
            (`transaction: ""`) is not gasless, and `mode` stays whatever it
            already was.
        router:
          type: string
          description: >
            Router that produced the quote. Alchemy currently serves quotes
            through Metis only.
          enum: [metis]
        routePlan:
          type: array
          description: Ordered list of route steps that make up the swap.
          items:
            $ref: "#/components/schemas/RoutePlanStep"
        transaction:
          type: ["string", "null"]
          description: >
            Base64-encoded, unsigned Solana transaction. Always present. `null`
            when `taker` was not supplied. Empty string when `taker` was
            supplied but the router could not build a transaction — inspect
            `errorCode`, `errorMessage`, and `error` in that case.
        taker:
          type: ["string", "null"]
          description: >
            Taker echoed back from the request. Always present. `null` when
            `taker` was not supplied.
        lastValidBlockHeight:
          type: string
          description: >
            Block height beyond which the assembled transaction is no longer
            valid, as a decimal string. Omitted (not `null`) when the response
            does not carry a usable transaction.
        signatureFeeLamports:
          type: integer
          description: >
            Estimated signature fee in lamports. Always present. `0` when
            `taker` was not supplied or when the transaction was rejected.
            With a non-taker `payer` (sponsor), this is `10000` because both
            the sponsor and the taker sign.
        prioritizationFeeLamports:
          type: integer
          description: >
            Estimated priority fee plus any Jito tip, in lamports. Always
            present. `0` when `taker` was not supplied or when the transaction
            was rejected.
        rentFeeLamports:
          type: integer
          description: >
            Estimated rent fee in lamports (for example, to open the output
            token account when it does not already exist). Always present. `0`
            when `taker` was not supplied or when the transaction was
            rejected.
        signatureFeePayer:
          type: ["string", "null"]
          description: >
            Public key that pays the signature fee. `null` when `taker` was not
            supplied or when the transaction was rejected. When a non-taker
            `payer` is set, this names the sponsor.
        prioritizationFeePayer:
          type: ["string", "null"]
          description: >
            Public key that pays the priority fee and any Jito tip. `null` when
            `taker` was not supplied or when the transaction was rejected. When
            a non-taker `payer` is set, this names the sponsor.
        rentFeePayer:
          type: ["string", "null"]
          description: >
            Public key that pays the rent fee. `null` when `taker` was not
            supplied or when the transaction was rejected. When a non-taker
            `payer` is set, this names the sponsor.
        totalTime:
          type: integer
          description: >
            Time in milliseconds this service spent producing the response.
            Always present.
        feeBps:
          type: integer
          description: >
            Requested referral fee in basis points, echoed back. Present only
            when the request included a valid `referralFee` + `referralAccount`
            pair; omitted otherwise.
        feeMint:
          type: string
          description: >
            Mint of the token in which the referral fee is charged. On
            `ExactIn` this is the output mint; on `ExactOut` this is the input
            mint. Present only when the request included a valid `referralFee`
            + `referralAccount` pair; omitted otherwise.
        platformFee:
          type: object
          description: >
            Details of the integrator fee actually charged. Present only when
            the request included a valid `referralFee` + `referralAccount`
            pair; omitted otherwise.
          properties:
            amount:
              type: string
              description: Fee amount in the smallest unit of `feeMint`.
            feeBps:
              type: integer
              description: Referral fee in basis points, echoed back.
            feeMint:
              type: string
              description: >
                Mint of the token in which the fee is charged. Optional inside
                `platformFee`; when present, matches the top-level `feeMint`.
          required:
            - amount
            - feeBps
        errorCode:
          type: integer
          description: >
            Present only on a 200 rejection (`taker` was supplied but
            `transaction` is the empty string). Match on `errorCode` to
            identify the failure:

            * `1` — insufficient funds. Always describes the taker's input
              side, even when a `payer` is set.
            * `2` — insufficient SOL for gas. Without a sponsor this is the
              taker's SOL; with a `payer`, it describes the sponsor's SOL
              (signature, priority, associated-token rent, and any system
              lamports assigned to the sponsor).

            Code `3` is never returned by this service. Any other unexpected
            taker SOL debit surfaces as a `502`, not a 200 rejection that
            still bills the taker.
        errorMessage:
          type: string
          description: >
            Human-readable error description. Present on a 200 rejection
            alongside `errorCode`. Match on `errorCode` rather than parsing
            this string.
        error:
          type: string
          description: >
            Duplicate of `errorMessage`, kept for compatibility. Present on a
            200 rejection alongside `errorCode`.
      required:
        - mode
        - inputMint
        - outputMint
        - inAmount
        - outAmount
        - otherAmountThreshold
        - swapMode
        - slippageBps
        - priceImpact
        - priceImpactPct
        - swapType
        - gasless
        - router
        - routePlan
        - transaction
        - taker
        - signatureFeeLamports
        - prioritizationFeeLamports
        - rentFeeLamports
        - signatureFeePayer
        - prioritizationFeePayer
        - rentFeePayer
        - totalTime

    BuildResponse:
      type: object
      description: Quote fields plus decomposed swap instructions.
      properties:
        inputMint:
          type: string
          description: Mint of the input token, echoed back.
        outputMint:
          type: string
          description: Mint of the output token, echoed back.
        inAmount:
          type: string
          description: Input amount used for the quote, in base units of the input mint.
        outAmount:
          type: string
          description: >
            Estimated output amount before slippage, in base units of the
            output mint.
        otherAmountThreshold:
          type: string
          description: >
            Minimum output amount after slippage is applied, in base units of
            the output mint. `/build` is `ExactIn` only, so this is always a
            minimum output.
        swapMode:
          type: string
          description: >
            Swap mode used to build the instructions. `/build` supports
            `ExactIn` only.
          enum: [ExactIn]
        slippageBps:
          type: integer
          description: Slippage tolerance in basis points applied to the quote.
        priceImpact:
          type: number
          description: >
            Price impact of the swap, in percentage points (for example, `-0.1`
            means -0.1%). Same number as `/order`'s `priceImpact`. Always
            present.
        priceImpactPct:
          type: string
          description: >
            Price impact as a decimal fraction string. `priceImpact` divided
            by 100. Always present.
        routePlan:
          type: array
          description: Ordered list of route steps that make up the swap.
          items:
            $ref: "#/components/schemas/RoutePlanStep"
        setupInstructions:
          type: array
          description: >
            Instructions that must run before the swap (for example, create an
            associated token account or wrap SOL). Always present; may be
            empty.
          items:
            $ref: "#/components/schemas/Instruction"
        swapInstruction:
          $ref: "#/components/schemas/Instruction"
        cleanupInstruction:
          description: >
            Optional instruction that runs after the swap (for example, close a
            temporary wrapped-SOL account and reclaim rent). `null` when no
            cleanup is required.
          oneOf:
            - $ref: "#/components/schemas/Instruction"
            - type: "null"
        computeBudgetInstructions:
          type: array
          description: >
            Priority-fee instructions this service assembles for the caller —
            not Metis's own compute-budget instructions and not a compute-unit
            limit. The array is exactly one `SetComputeUnitPrice` instruction
            and never a `SetComputeUnitLimit`. Omitting
            `computeUnitPricePercentile` on the request does not leave Metis's
            own price in place: it uses the same Alchemy priority-fee estimate
            `/order` uses by default (Medium, 50th percentile, Jupiter's `high`
            rung). A zero estimate is still emitted as
            `SetComputeUnitPrice(0)`. The total priority fee is capped at
            1,000,000 lamports.
          items:
            $ref: "#/components/schemas/Instruction"
        otherInstructions:
          type: array
          description: >
            Additional instructions Metis wants included in the final
            transaction (for example, integrator fee transfers). Always
            present; may be empty.
          items:
            $ref: "#/components/schemas/Instruction"
        tipInstruction:
          description: >
            Reserved for a Jupiter-native tip. Always `null` on `/build`
            because `tipAmount` is not supported here (see the `tipAmount`
            parameter). If you need a Jito tip, use `/order`'s
            `jitoTipLamports` instead.
          oneOf:
            - $ref: "#/components/schemas/Instruction"
            - type: "null"
        addressesByLookupTableAddress:
          type: ["object", "null"]
          description: >
            Address lookup table accounts referenced by the swap, keyed by
            lookup-table address. Each value is the ordered list of accounts
            resolved from that table. `null` when the route uses no lookup
            tables. Never an empty object.
          additionalProperties:
            type: array
            items:
              type: string
        blockhashWithMetadata:
          $ref: "#/components/schemas/BlockhashWithMetadata"
      required:
        - inputMint
        - outputMint
        - inAmount
        - outAmount
        - otherAmountThreshold
        - swapMode
        - slippageBps
        - priceImpact
        - priceImpactPct
        - routePlan
        - setupInstructions
        - swapInstruction
        - cleanupInstruction
        - computeBudgetInstructions
        - otherInstructions
        - tipInstruction
        - addressesByLookupTableAddress
        - blockhashWithMetadata

    BlockhashWithMetadata:
      type: object
      description: >
        Recent blockhash Metis fetched for the swap transaction, plus its
        expiry and the timestamp this service stamped when building the
        response.
      properties:
        blockhash:
          type: array
          description: >
            Blockhash as a 32-byte little-endian array of unsigned integers,
            NOT base58-encoded.
          minItems: 32
          maxItems: 32
          items:
            type: integer
            minimum: 0
            maximum: 255
        lastValidBlockHeight:
          type: integer
          description: >
            Block height beyond which the blockhash is no longer valid, as a
            JSON number. (On `/order`'s top-level response the equivalent
            `lastValidBlockHeight` is a decimal string; on `/build` here it is
            a number.)
        fetchedAt:
          type: object
          description: >
            Timestamp this service stamps when building the response. Keys are
            snake_case as returned.
          properties:
            secs_since_epoch:
              type: integer
              description: Seconds since Unix epoch.
            nanos_since_epoch:
              type: integer
              description: Nanoseconds portion of the timestamp.
          required:
            - secs_since_epoch
            - nanos_since_epoch
      required:
        - blockhash
        - lastValidBlockHeight
        - fetchedAt

    Instruction:
      type: object
      description: A Solana instruction in decomposed form.
      properties:
        programId:
          type: string
          description: Program ID that owns the instruction.
        accounts:
          type: array
          items:
            $ref: "#/components/schemas/AccountMeta"
        data:
          type: string
          description: Base64-encoded instruction data.
      required:
        - programId
        - accounts
        - data

    AccountMeta:
      type: object
      properties:
        pubkey:
          type: string
        isSigner:
          type: boolean
        isWritable:
          type: boolean
      required:
        - pubkey
        - isSigner
        - isWritable

    RoutePlanStep:
      type: object
      properties:
        swapInfo:
          $ref: "#/components/schemas/SwapInfo"
        percent:
          type: integer
          description: Percentage of the total swap routed through this step (0-100).
          minimum: 0
          maximum: 100
        bps:
          type: integer
          description: Basis-points share of the total swap routed through this step (0-10000).
          minimum: 0
          maximum: 10000
        usdValue:
          type: number
          description: Optional USD value of this step at quote time.
      required:
        - swapInfo
        - percent
        - bps

    SwapInfo:
      type: object
      properties:
        ammKey:
          type: string
          description: On-chain address of the AMM pool used for this step.
        label:
          type: string
          description: Human-readable DEX label (for example, `Orca V2`, `Raydium CLMM`).
        inputMint:
          type: string
        outputMint:
          type: string
        inAmount:
          type: string
        outAmount:
          type: string
      required:
        - ammKey
        - label
        - inputMint
        - outputMint
        - inAmount
        - outAmount

    MultiQuoteRequest:
      type: object
      properties:
        inputMint:
          type: string
          description: Mint address of the input token.
          example: So11111111111111111111111111111111111111112
          default: So11111111111111111111111111111111111111112
        amount:
          type: string
          description: >
            Amount to price, in base units of the input mint (or the desired
            output amount when `swapMode` is `ExactOut`). Must be a JSON
            string; a JSON number returns `400`.
          example: "1000000000"
          default: "1000000000"
        outputMints:
          type: array
          description: >
            Mint addresses of the candidate output tokens (1-32). Entries must
            be unique and none may equal `inputMint`.
          minItems: 1
          maxItems: 32
          items:
            type: string
          example:
            - EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v
            - Es9vMFrzaCERmJfrF4H2FYD4KCoNkY11McCe8BenwNYB
        swapMode:
          type: string
          enum: [ExactIn, ExactOut]
          default: ExactIn
          description: >
            Swap mode applied to every quote in the batch. On `ExactOut`,
            `amount` is the desired output for each mint independently.
      required:
        - inputMint
        - amount
        - outputMints

    MultiQuoteResponse:
      type: object
      description: >
        Priced amounts for each requested output mint, plus a shared context
        slot. The response deliberately omits route plans, fees, transactions,
        and per-mint errors — use `/order` for the full quote surface on a
        single mint pair.
      properties:
        quotes:
          type: object
          description: >
            Object keyed by output mint (in request order). Each value carries
            the priced amounts only.
          additionalProperties:
            $ref: "#/components/schemas/MultiQuoteEntry"
        contextSlot:
          type: integer
          description: >
            Oldest slot any quote in `quotes` reported. Omitted when none of
            the quotes carried a slot.
      required:
        - quotes

    MultiQuoteEntry:
      type: object
      properties:
        inAmount:
          type: string
          description: Input amount in base units of the input mint.
        outAmount:
          type: string
          description: Priced output amount in base units of the output mint.
      required:
        - inAmount
        - outAmount
