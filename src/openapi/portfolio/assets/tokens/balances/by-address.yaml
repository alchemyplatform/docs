summary: Token Balances By Wallet
description: >
  Fetches fungible tokens (native, ERC-20, and SPL) for multiple wallet addresses and networks. Returns a list of tokens with balances for each wallet/network combination. This endpoint is supported on Ethereum, Solana, and 30+ EVM chains. See the full list of supported networks [here](https://dashboard.alchemy.com/chains)


  This endpoint fans out across every requested network and merges the results. If one or more networks fail (upstream error or per-network timeout: 5s on paginated requests, 10s on fetch-all), the response is still HTTP 200 with a top-level `error.partialErrors` array listing the failed networks. See [Handling partial failures](/docs/reference/portfolio-apis#handling-partial-failures) for the recommended client pattern.
tags: ["Portfolio API Endpoints"]
parameters:
  - $ref: "./../../../portfolio.yaml#/components/parameters/apiKey"
requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: "./../../../portfolio.yaml#/components/schemas/ByAddressRequestWith3PairsAnd20Networks"
      example:
        addresses:
          - address: "0x1E6E8695FAb3Eb382534915eA8d7Cc1D1994B152"
            networks:
              - eth-mainnet
              - base-mainnet
              - matic-mainnet
        includeNativeTokens: true
        includeErc20Tokens: false
responses:
  "200":
    description: Successful response!
    content:
      application/json:
        schema:
          $ref: "./../../../portfolio.yaml#/components/schemas/TokenBalancesResponse"
        examples:
          success:
            summary: All networks succeeded
            value:
              data:
                tokens:
                  - address: "0x1E6E8695FAb3Eb382534915eA8d7Cc1D1994B152"
                    network: "eth-mainnet"
                    tokenAddress: null
                    tokenBalance: "0x02c68af0bb140000"
                  - address: "0x1E6E8695FAb3Eb382534915eA8d7Cc1D1994B152"
                    network: "base-mainnet"
                    tokenAddress: null
                    tokenBalance: "0x016345785d8a0000"
                  - address: "0x1E6E8695FAb3Eb382534915eA8d7Cc1D1994B152"
                    network: "matic-mainnet"
                    tokenAddress: null
                    tokenBalance: "0x0de0b6b3a7640000"
          partialFailure:
            summary: One or more networks failed (HTTP 200)
            value:
              data:
                tokens:
                  - address: "0x1E6E8695FAb3Eb382534915eA8d7Cc1D1994B152"
                    network: "eth-mainnet"
                    tokenAddress: null
                    tokenBalance: "0x02c68af0bb140000"
              error:
                message: "Failed to fetch tokens on certain networks"
                partialErrors:
                  - network: "base-mainnet"
                    message: "Internal server error"
                  - network: "matic-mainnet"
                    message: "Internal server error"
  "400":
    description: "Bad Request: Invalid input (e.g., malformed JSON)."
    content:
      application/json:
        schema:
          $ref: "./../../../portfolio.yaml#/components/schemas/ErrorResponse"
  "429":
    description: "Too Many Requests: Rate limit exceeded."
    content:
      application/json:
        schema:
          $ref: "./../../../portfolio.yaml#/components/schemas/ErrorResponse"
operationId: get-token-balances-by-address
