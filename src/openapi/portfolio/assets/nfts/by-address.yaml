summary: NFTs By Wallet
description: >
  Fetches NFTs for multiple wallet addresses and networks. Returns a list of NFTs and metadata for each wallet/network combination.
tags: ["Portfolio API Endpoints"]
parameters:
  - $ref: "./../../portfolio.yaml#/components/parameters/apiKey"
requestBody:
  required: true
  content:
    application/json:
      schema:
        allOf:
          - $ref: "./../../portfolio.yaml#/components/schemas/ByAddressRequestWithNFTOptionsAndPaging"
          - type: object
            properties:
              orderBy:
                type: string
                enum: ["transferTime"]
                description: "Field to order results by"
              sortOrder:
                type: string
                enum: ["asc", "desc"]
                description: "Sort order for results"
responses:
  "200":
    description: Successful response!
    content:
      application/json:
        schema:
          $ref: "./../../portfolio.yaml#/components/schemas/NFTByOwnerResponse"
  "400":
    description: "Bad Request: Invalid input (e.g., malformed JSON)."
    content:
      application/json:
        schema:
          $ref: "./../../portfolio.yaml#/components/schemas/ErrorResponse"
  "429":
    description: "Too Many Requests: Rate limit exceeded."
    content:
      application/json:
        schema:
          $ref: "./../../portfolio.yaml#/components/schemas/ErrorResponse"
operationId: get-nfts-by-address
