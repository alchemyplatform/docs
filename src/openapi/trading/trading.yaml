      summary: "Get token metadata"
      operationId: "get-token-metadata"
      tags:
        - "Tokens"
      description: "Read token identity, description, social links, holder information, and security fields."
      parameters:
        - $ref: "#/components/parameters/apiKey"
        - $ref: "#/components/parameters/network"
        - $ref: "#/components/parameters/tokenAddress"
