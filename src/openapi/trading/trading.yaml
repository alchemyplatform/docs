  /{apiKey}/premium/wallets/{address}/pnl:
    get:
      summary: Get wallet PnL (Premium)
      operationId: get-wallet-pnl-premium
      tags:
        - Wallets
      x-shape-pending: true
      description: >-
        **Private preview:** Paths, parameters, response fields, and tier names are provisional.


        **Compute units:** 1,400 (proposed; pending validation).


        Measure realized profit or loss over the selected period. History is hourly for 1d and 7d,
        and daily for 30d and all. General and Premium use different methodologies and their numbers
        are not comparable.


        Omit networks to combine all supported EVM networks. To query Solana, set networks to
        solana-mainnet alone. Do not mix Solana and EVM networks.


        Each history point and the summary identify the combined networks in a networks array.
      parameters:
        - $ref: "#/components/parameters/apiKey"
        - name: networks
          in: query
          required: false
          description: >-
            Networks to combine. Omit to combine all supported EVM networks. Request solana-mainnet
            on its own; do not combine Solana with EVM networks.
          schema:
            type: array
            minItems: 1
            uniqueItems: true
            items:
              $ref: "#/components/schemas/NetworkDiscoveryPremium"
            oneOf:
              - items:
                  $ref: "#/components/schemas/NetworkWalletPremiumEvm"
              - maxItems: 1
                items:
                  type: string
                  enum:
                    - solana-mainnet
            x-shape-pending: true
          style: form
          explode: true
        - name: address
          in: path
          required: true
          schema:
            type: string
            description: Wallet address.
            x-shape-pending: true
          example: "0x7942262a7a5637e6eb0eec9b91b55ec232141f87"
        - name: period
          in: query
          schema:
            type: string
            enum:
              - 1d
              - 7d
              - 30d
              - all
            default: 30d
            x-shape-pending: true
          description: Realized PnL measurement period.
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PeriodPnlResponse"
              example:
                data:
                  history:
                    - timestamp: "2026-10-04T00:00:00Z"
                      realizedPnlUsd: "-864.9089818330417"
                      trades: 5
                      networks:
                        - eth-mainnet
                    - timestamp: "2026-10-05T00:00:00Z"
                      realizedPnlUsd: "-42.54051770975006"
                      trades: 1
                      networks:
