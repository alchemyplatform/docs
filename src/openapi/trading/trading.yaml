  /{apiKey}/pools/{network}/{poolAddress}/candles:
    get:
      summary: Get pool candles
      operationId: get-pool-candles
      tags:
        - Pools
      x-shape-pending: true
      description: >-
        **Private preview:** Paths, parameters, response fields, and tier names are provisional.


        **Compute units:** 400 (proposed; pending validation).


        Support for more networks is planned. Candles use Unix seconds UTC and USD decimal strings.
        Intervals without trades are omitted by default.


        Read tokenAddress on each candle to identify the token priced in USD.
      parameters:
