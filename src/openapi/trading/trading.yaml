# This local specification will move to a remote spec once the service exists.
openapi: 3.1.0
info:
  title: Trading API
  version: "1.0"
  description: >-
    DEX market data and wallet trading analytics. All paths and shapes are provisional
    private-preview contracts.
servers:
  - url: https://api.g.alchemy.com/trading/v1
    description: Provisional base URL; it will be confirmed before general availability.
tags:
  - name: Pools
    description: Inspect pools, candles, and trades.
  - name: Tokens
    description: Explore token markets and holders.
  - name: Discovery
    description: Find pools and tokens.
  - name: Wallets
    description: Analyze wallet trading outcomes.
paths:
  /{apiKey}/pools/{network}/{poolAddress}:
    get:
      summary: Get pool
      operationId: get-pool
      tags:
        - Pools
      x-shape-pending: true
      description: |-
        **Private preview:** Paths, parameters, response fields, and tier names are provisional.

        **Compute units:** 200 (proposed; pending validation).

        Inspect a pool and its market activity. Support for more networks is planned.

        tokenAddress identifies the token that priceUsd refers to.
      parameters:
        - $ref: "#/components/parameters/apiKey"
        - name: network
          in: path
          required: true
          description: Supported networks for this operation during private preview.
          schema:
            $ref: "#/components/schemas/NetworkPools"
            x-shape-pending: true
        - name: poolAddress
          in: path
          required: true
          schema:
            type: string
            description: Pool address or pool identifier.
            x-shape-pending: true
          example: "0x88e6a0c2ddd26feeb64f039a2c41296fcb3f5640"
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PoolResponse"
              example:
                data:
                  network: eth-mainnet
                  poolAddress: "0x88e6a0c2ddd26feeb64f039a2c41296fcb3f5640"
                  name: WETH/USDC 0.05%
                  priceUsd: "2243.05"
                  liquidityUsd: "78770522.8106"
                  volumeUsd: "362680573.741548"
                  createdAt: "2021-12-29T12:35:14Z"
                  tokenAddress: "0xc02aaa39b223fe8d0a0e5c4f27ead9083c756cc2"
                  buys: 6026
                  sells: 4750
                  feePercent: "0.05"
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "429":
          $ref: "#/components/responses/Error429"
        "503":
          $ref: "#/components/responses/Error503"
  /{apiKey}/premium/pools/{network}/{poolAddress}:
    get:
      summary: Get pool (Premium)
      operationId: get-pool-premium
      tags:
        - Pools
      x-shape-pending: true
      description: |-
        **Private preview:** Paths, parameters, response fields, and tier names are provisional.

        **Compute units:** 350 (proposed; pending validation).

        Inspect a pool and its market activity. Support for more networks is planned.

