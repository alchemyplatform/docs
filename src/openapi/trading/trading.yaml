components:
  parameters:
    apiKey:
      name: apiKey
      in: path
      required: true
      schema:
        type: string
        default: docs-demo
        description: For higher throughput, [create your own API key](https://dashboard.alchemy.com/signup)
    pageKey:
      name: pageKey
      in: query
      description: >-
        Omit for the first page. Reuse the returned key unchanged; stop when the response key is
        null.
      schema:
        type: string
        x-shape-pending: true
    pageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
        x-shape-pending: true
      description: Maximum rows per page; provisional limit.
    interval:
      name: interval
      in: query
      required: true
      schema:
        type: string
        enum:
          - 1m
          - 5m
          - 15m
          - 1h
          - 4h
          - 1d
        x-shape-pending: true
      description: Candle interval. Empty intervals are omitted by default.
    from:
      name: from
      in: query
      required: true
      schema:
        type: string
        format: date-time
        x-shape-pending: true
      description: Start of the requested UTC time range. Boundary inclusion is pending.
    to:
      name: to
      in: query
      required: true
      schema:
        type: string
        format: date-time
        x-shape-pending: true
      description: End of the requested UTC time range. Boundary inclusion is pending.
    sortBy:
      name: sortBy
      in: query
      schema:
        type: string
        enum:
          - realizedPnl
          - unrealizedPnl
          - buyVolume
          - sellVolume
        x-shape-pending: true
      description: Metric used to order token results. Default order and direction are pending.
  schemas:
    NetworkPools:
      type: string
      enum:
        - eth-mainnet
        - base-mainnet
        - arb-mainnet
        - bnb-mainnet
        - solana-mainnet
    NetworkTokensGeneral:
      type: string
      enum:
        - eth-mainnet
        - base-mainnet
        - arb-mainnet
        - opt-mainnet
        - matic-mainnet
        - bnb-mainnet
        - avax-mainnet
        - linea-mainnet
        - solana-mainnet
    NetworkTokensPremium:
      type: string
      enum:
        - eth-mainnet
        - base-mainnet
        - arb-mainnet
        - bnb-mainnet
        - avax-mainnet
        - solana-mainnet
        - hyperliquid-mainnet
    NetworkHoldersPremium:
      type: string
      enum:
        - eth-mainnet
        - base-mainnet
        - arb-mainnet
        - bnb-mainnet
        - avax-mainnet
        - hyperliquid-mainnet
    NetworkNewGeneral:
      type: string
      enum:
        - eth-mainnet
        - base-mainnet
        - arb-mainnet
        - opt-mainnet
        - matic-mainnet
        - bnb-mainnet
        - avax-mainnet
        - robinhood-mainnet
        - arc-mainnet
        - solana-mainnet
    NetworkNewPremium:
      type: string
      enum:
        - eth-mainnet
        - base-mainnet
        - arb-mainnet
        - bnb-mainnet
        - avax-mainnet
        - robinhood-mainnet
        - arc-mainnet
        - solana-mainnet
        - hyperliquid-mainnet
    NetworkDiscoveryGeneral:
      type: string
      enum:
        - eth-mainnet
        - base-mainnet
        - arb-mainnet
        - opt-mainnet
        - matic-mainnet
        - bnb-mainnet
        - avax-mainnet
        - linea-mainnet
        - robinhood-mainnet
        - arc-mainnet
        - solana-mainnet
    NetworkDiscoveryPremium:
      type: string
      enum:
        - eth-mainnet
        - base-mainnet
        - arb-mainnet
        - bnb-mainnet
        - avax-mainnet
        - robinhood-mainnet
        - arc-mainnet
        - solana-mainnet
        - tempo-mainnet
        - hyperliquid-mainnet
    NetworkWalletGeneral:
      type: string
      enum:
        - eth-mainnet
        - base-mainnet
        - arb-mainnet
        - opt-mainnet
        - matic-mainnet
        - bnb-mainnet
        - avax-mainnet
        - linea-mainnet
        - robinhood-mainnet
        - arc-mainnet
    NetworkWalletTradesGeneral:
      type: string
      enum:
        - bnb-mainnet
    NetworkWalletTradesPremium:
      type: string
      enum:
        - eth-mainnet
        - base-mainnet
        - bnb-mainnet
        - robinhood-mainnet
        - solana-mainnet
    Network:
      type: string
      enum:
        - eth-mainnet
        - base-mainnet
        - arb-mainnet
        - bnb-mainnet
        - solana-mainnet
        - opt-mainnet
        - matic-mainnet
        - avax-mainnet
        - linea-mainnet
        - hyperliquid-mainnet
        - robinhood-mainnet
        - arc-mainnet
        - tempo-mainnet
    PoolSummary:
      type: object
      properties:
        network:
          $ref: "#/components/schemas/Network"
          description: Alchemy network slug.
          x-shape-pending: true
        poolAddress:
          type: string
          description: Pool address or pool identifier.
          x-shape-pending: true
        name:
          type: string
          description: Human-readable pool name.
          x-shape-pending: true
        priceUsd:
          type:
            - string
            - "null"
          pattern: ^-?[0-9]+(\.[0-9]+)?$
          description: Price of the selected token in USD. Decimal string; null means unknown.
          x-shape-pending: true
        liquidityUsd:
          type:
            - string
            - "null"
          pattern: ^-?[0-9]+(\.[0-9]+)?$
          description: Pool liquidity in USD. Decimal string; null means unknown.
          x-shape-pending: true
        volumeUsd:
          type:
            - string
            - "null"
          pattern: ^-?[0-9]+(\.[0-9]+)?$
          description: Trading volume over the last 24 hours, in USD. Decimal string; null means unknown.
          x-shape-pending: true
        createdAt:
          type:
            - string
            - "null"
          format: date-time
          description: ISO 8601 UTC timestamp; null means unknown.
          x-shape-pending: true
        tokenAddress:
          type: string
          description: Token address that defines price and trade direction in this row.
          x-shape-pending: true
        dexName:
          type: string
          description: Human-readable DEX name, when available.
          x-shape-pending: true
        feePercent:
          type: string
          description: Pool fee as a percentage, expressed as a decimal string.
          x-shape-pending: true
        buys:
          type: integer
          minimum: 0
          description: Number of buys in the last 24 hours.
          x-shape-pending: true
        sells:
          type: integer
          minimum: 0
          description: Number of sells in the last 24 hours.
          x-shape-pending: true
      required:
        - network
        - poolAddress
    Candle:
      type: object
      properties:
        network:
          $ref: "#/components/schemas/Network"
          description: Alchemy network slug.
          x-shape-pending: true
        timestamp:
          type: integer
          description: Start of the candle interval, in Unix seconds UTC.
          x-shape-pending: true
        open:
          type:
            - string
            - "null"
          pattern: ^-?[0-9]+(\.[0-9]+)?$
          description: Opening price in USD. Decimal string; null means unknown.
          x-shape-pending: true
        high:
          type:
            - string
            - "null"
          pattern: ^-?[0-9]+(\.[0-9]+)?$
          description: Highest price in USD. Decimal string; null means unknown.
          x-shape-pending: true
        low:
          type:
            - string
            - "null"
          pattern: ^-?[0-9]+(\.[0-9]+)?$
          description: Lowest price in USD. Decimal string; null means unknown.
          x-shape-pending: true
        close:
          type:
            - string
            - "null"
          pattern: ^-?[0-9]+(\.[0-9]+)?$
          description: Closing price in USD. Decimal string; null means unknown.
          x-shape-pending: true
        volumeUsd:
          type:
            - string
            - "null"
          pattern: ^-?[0-9]+(\.[0-9]+)?$
          description: Trading volume during the interval in USD. Decimal string; null means unknown.
          x-shape-pending: true
        tokenAddress:
          type: string
          description: Token address that defines price and trade direction in this row.
          x-shape-pending: true
      required:
        - network
        - timestamp
        - open
        - high
        - low
        - close
        - volumeUsd
        - tokenAddress
    TradeRow:
      type: object
      properties:
        network:
          $ref: "#/components/schemas/Network"
          description: Alchemy network slug.
          x-shape-pending: true
        transactionHash:
          type: string
          description: Onchain transaction hash.
          x-shape-pending: true
        timestamp:
          type:
            - string
            - "null"
          format: date-time
          description: ISO 8601 UTC timestamp; null means unknown.
          x-shape-pending: true
        address:
          type: string
          description: Wallet address that made the trade.
          x-shape-pending: true
        poolAddress:
          type: string
          description: Pool address or pool identifier.
          x-shape-pending: true
