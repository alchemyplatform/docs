openapi: "3.1.0"
info:
  title: "Trading API"
  version: "1.0"
  description: "DEX market data and wallet trading analytics. Beta: endpoints and fields may change."
servers:
  - url: "https://api.g.alchemy.com/trading/v1"
    description: "Beta base URL."
tags:
  - name: "Tokens"
    description: "Token market data, metadata, OHLCV, trades, and holders."
  - name: "Pools"
    description: "Inspect pools, OHLCV, and trades."
  - name: "Discovery"
    description: "Find new, trending, and screened pools."
  - name: "Wallets"
    description: "Analyze wallet trading outcomes."
paths:
  /{apiKey}/tokens/market-data:
    post:
      summary: "Get token market data (batch)"
      operationId: "get-token-market-data-batch"
      tags:
        - "Tokens"
      description: "Get market data for up to 30 tokens in one request. Results are returned in input order."
      parameters:
        - $ref: "#/components/parameters/apiKey"
      responses:
        "200":
          description: "Successful response."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenListResponse"
              example:
                data:
                  - network: "eth-mainnet"
                    tokenAddress: "0xa0b86991c6218b36c1d19d4a2e9eb0ce3606eb48"
                    name: "USD Coin"
                    symbol: "USDC"
                    decimals: 6
                    logoUrl: null
                    priceUsd: "0.9994207409"
                    marketCapUsd: "69473200842.8992"
                    fdvUsd: "45053697116.2719"
                    liquidityUsd: "362774413.826085574"
                    volumeUsd:
                      h24: "1007567572.85251"
                    totalSupply: "45079867582.8485"
        "400":
          $ref: "#/components/responses/Error400"
        "429":
          $ref: "#/components/responses/Error429"
        "503":
          $ref: "#/components/responses/Error503"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: "object"
              required:
                - "tokens"
              properties:
                tokens:
                  type: "array"
                  items:
                    $ref: "#/components/schemas/NetworkAddressItem"
                  minItems: 1
                  maxItems: 30
            example:
              tokens:
                - network: "eth-mainnet"
                  address: "0xa0b86991c6218b36c1d19d4a2e9eb0ce3606eb48"
      x-shape-pending: true
  /{apiKey}/tokens/{network}/{tokenAddress}:
    get:
      summary: "Get token market data"
      operationId: "get-token-market-data"
      tags:
        - "Tokens"
      description: "Read token market data. Set include=topPools to add pool references."
      parameters:
        - $ref: "#/components/parameters/apiKey"
        - $ref: "#/components/parameters/network"
        - $ref: "#/components/parameters/tokenAddress"
        - name: "include"
          in: "query"
          required: false
          description: "Include references to the token’s top pools."
          schema:
            type: "string"
            enum:
              - "topPools"
      responses:
        "200":
          description: "Successful response."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
              example:
                data:
                  network: "eth-mainnet"
                  tokenAddress: "0xa0b86991c6218b36c1d19d4a2e9eb0ce3606eb48"
                  name: "USD Coin"
                  symbol: "USDC"
                  decimals: 6
                  logoUrl: null
                  priceUsd: "0.9994207409"
                  marketCapUsd: "69473200842.8992"
                  fdvUsd: "45053697116.2719"
                  liquidityUsd: "362774413.826085574"
                  volumeUsd:
                    h24: "1007567572.85251"
                  totalSupply: "45079867582.8485"
                  topPools:
                    - network: "eth-mainnet"
                      poolAddress: "0xa348fcea4d10b98fe574bee2294b32ae0d6ebc50cf1d5aa1d7048bbfae3d88f6"
                    - network: "eth-mainnet"
                      poolAddress: "0x88e6a0c2ddd26feeb64f039a2c41296fcb3f5640"
        "400":
          $ref: "#/components/responses/Error400"
        "404":
          $ref: "#/components/responses/Error404"
        "429":
          $ref: "#/components/responses/Error429"
        "503":
          $ref: "#/components/responses/Error503"
      x-shape-pending: true
  /{apiKey}/tokens/{network}/{tokenAddress}/metadata:
