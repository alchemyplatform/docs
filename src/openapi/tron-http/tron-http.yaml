  /wallet/deploycontract:
    post:
      summary: Deploy a smart contract
      description: >
        Deploys a new smart contract to the TRON blockchain. The owner address must have sufficient funds to pay for the deployment.
      tags:
        - Tron HTTP API Endpoints
      security:
        - apiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - owner_address
                - abi
                - bytecode
              properties:
                owner_address:
                  type: string
                  description: Base58 address of the contract deployer.
                  example: "TZ4UXDV5ZhNW7fb2AMSbgfAEZ7hWsnYS2g"
                abi:
                  type: string
                  description: JSON-encoded ABI string for the smart contract.
                  example: '[{"inputs":[{"internalType":"uint256","name":"x","type":"uint256"}],"name":"set","outputs":[],"stateMutability":"nonpayable","type":"function"}]'
                bytecode:
                  type: string
                  description: Hex-encoded bytecode of the smart contract.
                  example: "608060405234801561001057600080fd5b5061011e806100206000396000f3fe..."
                name:
                  type: string
                  description: Name for the contract.
                  example: "MyContract"
                consume_user_resource_percent:
                  type: integer
                  description: Percent of user resource consumption for contract execution (0-100).
                  example: 100
                origin_energy_limit:
                  type: integer
                  description: Maximum energy limit for contract execution.
                  example: 10000000
                parameter:
                  type: string
                  description: Constructor parameters, hex-encoded.
                  example: ""
                visible:
                  type: boolean
                  description: Indicates if the address is base58 (true) or hex (false).
                  example: true
      responses:
        "200":
          description: Unsigned transaction object for contract deployment.
          content:
            application/json:
              schema:
                type: object
                properties:
                  visible:
                    type: boolean
                  txID:
                    type: string
                  raw_data:
                    type: object
                  raw_data_hex:
                    type: string
              examples:
                response:
                  value:
                    visible: true
                    txID: "b1a2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f0a1b2"
                    raw_data:
                      contract:
                        - parameter:
                            value:
                              owner_address: "TZ4UXDV5ZhNW7fb2AMSbgfAEZ7hWsnYS2g"
                              abi: '[{"inputs":[{"internalType":"uint256","name":"x","type":"uint256"}],"name":"set","outputs":[],"stateMutability":"nonpayable","type":"function"}]'
                              bytecode: "608060405234801561001057600080fd5b5061011e806100206000396000f3fe..."
                              name: "MyContract"
                              consume_user_resource_percent: 100
                              origin_energy_limit: 10000000
                              parameter: ""
                            type_url: "type.googleapis.com/protocol.CreateSmartContract"
                          type: "CreateSmartContract"
                      ref_block_bytes: "abcd"
                      ref_block_hash: "12345678abcdef12"
