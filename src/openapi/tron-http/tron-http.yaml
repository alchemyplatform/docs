  /wallet/estimateenergy:
    post:
      summary: Estimate energy usage for contract call
      description: >
        Estimates the amount of energy that will be consumed by a smart contract call with given parameters.
      tags:
        - Tron HTTP API Endpoints
      security:
        - apiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - owner_address
                - contract_address
                - data
              properties:
                owner_address:
                  type: string
                  description: Base58 address calling the contract.
                  example: "TZ4UXDV5ZhNW7fb2AMSbgfAEZ7hWsnYS2g"
                contract_address:
                  type: string
                  description: Base58 address of the contract to call.
                  example: "TXYZopYRdj2D9XRtbG411XZZ3kM5VkAeBf"
                data:
                  type: string
                  description: Hex-encoded call data (function selector and arguments).
                  example: "a9059cbb0000000000000000000000001500f43493489e872ec5d8817813944dfce319d500000000000000000000000000000000000000000000000000000000813871c0"
                call_value:
                  type: integer
                  description: Amount of TRX to transfer with the call (in SUN).
                  example: 0
                visible:
                  type: boolean
                  description: Indicates if addresses are base58 (true) or hex (false).
                  example: true
      responses:
        "200":
          description: Energy estimation for contract call.
          content:
            application/json:
              schema:
                type: object
                properties:
                  energy_required:
                    type: integer
                    description: Estimated energy required for the call.
                  result:
                    type: boolean
                    description: Whether the estimation was successful.
                  message:
                    type: string
                    description: Additional message or error.
              examples:
                response:
                  value:
                    energy_required: 28560
                    result: true
                    message: "Estimation completed successfully"
