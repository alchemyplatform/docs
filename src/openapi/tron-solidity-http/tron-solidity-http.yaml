                                contract_address: "41a614f803b6fd780986a42c78ec9c7f77e6ded13c"
                              type_url: "type.googleapis.com/protocol.TriggerSmartContract"
                            type: "TriggerSmartContract"
                        ref_block_bytes: "cfcf"
                        ref_block_hash: "66e60bb35dff5e13"
