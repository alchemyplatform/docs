    name: Bitcoin Mainnet
  - url: https://bitcoin-signet.g.alchemy.com/v2
    name: Bitcoin Signet
  - url: https://bitcoin-testnet.g.alchemy.com/v2
    name: Bitcoin Testnet
  - url: https://bitcoin-testnet4.g.alchemy.com/v2
    name: Bitcoin Testnet4
methods:
