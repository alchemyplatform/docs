# yaml-language-server: $schema=https://meta.open-rpc.org/

$schema: https://meta.open-rpc.org/
openrpc: 1.2.4
info:
  title: Alchemy Bitcoin JSON-RPC Specification
  description: A specification of the standard JSON-RPC methods for Bitcoin.
  version: 0.0.0
servers:
