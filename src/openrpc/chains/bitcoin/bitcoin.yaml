      ../_components/bitcoin/methods.yaml#/components/methods//address-prefix/{prefix}
  - $ref: ../_components/bitcoin/methods.yaml#/components/methods//address/{address}
  - $ref: >-
      ../_components/bitcoin/methods.yaml#/components/methods//address/{address}/txs
  - $ref: >-
      ../_components/bitcoin/methods.yaml#/components/methods//address/{address}/txs/chain/{last_seen_txid}
