      description: Returns the range of blocks contained within a batch given by the batch number.
      params:
        - name: L1BatchNumber
          required: true
          description: The layer 1 batch number.
          schema:
            $ref: "./schemas.yaml#/components/schemas/uint32"
      result:
        name: Block range
        description: Array containing the beginning and end block numbers in hexadecimal.
        schema:
          type: array
          minItems: 2
          maxItems: 2
          items:
            $ref: "../evm/base-types.yaml#/components/schemas/uint"
      examples:
        - name: zks_getL1BatchBlockRange example
          params:
            - name: L1BatchNumber
              value: 12345
          result:
