    zks_sendRawTransactionWithDetailedOutput:
      name: zks_sendRawTransactionWithDetailedOutput
      summary: Executes a transaction and returns its hash, storage logs, and events that would have been generated if the transaction had already been included in the block.
      description: Executes a transaction and returns its hash, storage logs, and events that would have been generated if the transaction had already been included in the block.
      params:
        - name: data
          required: true
          description: The signed transaction. Typically, signed with a library such as ethers.js.
          schema:
            type: string
            pattern: "^0x[a-fA-F0-9]+$"
            description: Hex-encoded transaction data
      result:
        name: Transaction details
        description: Details about the transaction execution
        schema:
          type: object
          properties:
            transactionHash:
              type: string
              pattern: "^0x[a-fA-F0-9]{64}$"
              description: Hash of the transaction
            storageLogs:
              type: array
              description: Storage logs of the transaction
              items:
                type: object
                properties:
                  address:
                    $ref: "../evm/base-types.yaml#/components/schemas/address"
                  data:
                    type: string
                    pattern: "^0x[a-fA-F0-9]+$"
                    description: Hex-encoded data of the log
                  topics:
                    type: array
                    items:
                      type: string
                      pattern: "^0x[a-fA-F0-9]{64}$"
                      description: Hex-encoded topic of the log
      examples:
        - name: zks_getL2FairGasPrice example
          params: []
          result:
            name: Transaction details
            value:
              transactionHash: "0xd586a9381ac33a70d1c34704664209242ee90316878fc1695aa8e4cf553c8595"
              storageLogs:
                - address: "0x000000000000000000000000000000000000800b"
                  key: "0x7"
                  writtenValue: "0x40000000000000000000000006641f961"
                - address: "0x000000000000000000000000000000000000800b"
                  key: "0x6"
                  writtenValue: "0x5f5e100"
