    zks_getConfirmedTokens:
      name: zks_getConfirmedTokens
      summary: Retrieves the confirmed tokens on zkSync.
      description: Retrieves the confirmed tokens on zkSync.
      params:
        - name: From token ID
          required: true
          description: Token ID from which to start listing.
          schema:
            type: integer
            format: uint32
        - name: Limit
          required: true
          description: Maximum number of tokens to list.
          schema:
            type: integer
            format: uint8
      result:
        name: Confirmed tokens
        description: List of confirmed tokens on zkSync.
        schema:
          type: array
          items:
            type: object
            properties:
              l1Address:
                $ref: "../evm/base-types.yaml#/components/schemas/address"
                description: Layer 1 address of the token (Ethereum)
              l2Address:
                $ref: "../evm/base-types.yaml#/components/schemas/address"
                description: Layer 2 address of the token (ZKsync Chain)
              name:
                type: string
                description: Name of the token
              symbol:
                type: string
                description: Symbol of the token
              decimals:
                type: integer
                format: uint8
                description: Number of decimals the token uses
      examples:
        - name: zks_getConfirmedTokens example
          params:
            - name: From token ID
              value: 1
            - name: Limit
              value: 3
          result:
            name: Confirmed tokens
            value:
              - l1Address: "0xb6ed7644c69416d67b522e20bc294a9a9b405b31"
                l2Address: "0xfea352c0d005a1e4ac7e092ef14fca18b8e6c8fd"
                name: "0xBitcoin Token"
                symbol: "0xBTC"
                decimals: 8

    zks_getL1GasPrice:
      name: zks_getL1GasPrice
      summary: Retrieves the current L1 gas price.
      description: Retrieves the current L1 gas price.
      params: []
      result:
        name: L1 gas price
        description: Current L1 gas price.
