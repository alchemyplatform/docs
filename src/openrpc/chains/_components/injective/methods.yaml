# Injective-specific method definitions (extends shared custom methods where network coverage differs).
components:
  methods:
    eth_getBlockByNumber:
      name: eth_getBlockByNumber
      description: |
        Returns information about a block by its number.

        **Injective:** Alchemy's Injective endpoint provides historical block access starting at block **127,250,000** (`0x795ae50`), where Injective's native EVM upgrade was introduced.
      x-compute-units: 20
      params:
        - name: Block number or tag
          required: true
          description: The block number or special tags like 'latest', 'earliest', or 'pending'.
          schema:
            $ref: "../evm/block.yaml#/components/schemas/BlockNumberOrTag"
        - name: Hydrated transactions
          required: true
          description: If true, returns full transaction objects; if false, returns only transaction hashes.
          schema:
            title: hydrated
            type: boolean
      result:
        name: Block information
        description: The block object containing various properties of the block.
        schema:
          oneOf:
            - $ref: "../evm/base-types.yaml#/components/schemas/notFound"
            - $ref: "../evm/block.yaml#/components/schemas/Block"
      examples:
        - name: eth_getBlockByNumber example
          params:
            - name: Block number or tag
              value: "0x795ae50"
            - name: Hydrated transactions
              value: false
          result:
            name: Block information
            value:
              number: "0x795ae50"
              hash: "0xd5f1812548be429cbdc6376b29611fc49e06f1359758c4ceaaa3b393e2239f9c"
