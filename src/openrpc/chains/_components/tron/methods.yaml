components:
  methods:
    /wallet/accountpermissionupdate:
      name: /wallet/accountpermissionupdate
      summary: Update account permissions
      description: Update the permission structure of an account, including owner, witness, and active permissions.
      params:
        - name: owner_address
          required: true
          description: Account address in Base58 or hex format.
          schema:
            type: string
        - name: owner
          required: true
          description: Owner permission object with type, permission_name, threshold, and keys array.
          schema:
            type: object
        - name: actives
          required: true
          description: List of active permissions with type, permission_name, threshold, operations, and keys.
          schema:
            type: array
            items: { type: object }
        - name: witness
          required: false
          description: Witness permission object. Only required for Super Representatives.
          schema:
            type: object
        - name: visible
          required: false
          description: Whether to use Base58 address format. Defaults to false.
          schema:
            type: boolean
      result:
        name: transaction
        description: Unsigned transaction object.
        schema:
          type: object

    /wallet/broadcasthex:
      name: /wallet/broadcasthex
      summary: Broadcast hex transaction
      description: Broadcast a transaction that has been signed and serialized into hexadecimal format.
      params:
        - name: transaction
          required: true
          description: Hex-encoded signed transaction.
          schema:
            type: string
      result:
        name: result
        description: Broadcast result.
        schema:
          type: object
          properties:
            result: { type: boolean }
            txid: { type: string }

    /wallet/broadcasttransaction:
      name: /wallet/broadcasttransaction
      summary: Broadcast signed transaction
      description: Broadcast a signed transaction to the TRON network.
      params:
        - name: visible
          required: false
          description: Whether to use Base58 address format.
          schema:
            type: boolean
        - name: txID
          required: true
          description: Transaction ID.
          schema:
            type: string
        - name: raw_data
          required: true
          description: Raw transaction data including contract, ref_block_bytes, ref_block_hash, expiration, and timestamp.
          schema:
            type: object
        - name: raw_data_hex
          required: true
          description: Hex-encoded raw transaction data.
          schema:
            type: string
        - name: signature
          required: true
          description: Array of transaction signatures.
          schema:
            type: array
            items: { type: string }
      result:
        name: result
        description: Broadcast result.
        schema:
          type: object
          properties:
            result: { type: boolean }
            txid: { type: string }
          example:
            result: true
            txid: "0x..."

    /wallet/clearabi:
      name: /wallet/clearabi
      summary: Clear contract ABI
      description: Create a transaction to clear the ABI of a deployed smart contract.
      params:
        - name: owner_address
          required: true
          description: Account address.
          schema:
            type: string
        - name: contract_address
          required: true
          description: Contract address.
          schema:
            type: string
        - name: visible
          required: false
          description: Whether to use Base58 address format.
          schema:
            type: boolean
      result:
        name: transaction
        description: Unsigned transaction object.
        schema:
          type: object

    /wallet/createaccount:
      name: /wallet/createaccount
      summary: Activate account
      description: Activate a new account on the TRON network.
      params:
        - name: owner_address
          required: true
          description: Creator account address.
          schema:
            type: string
        - name: account_address
          required: true
          description: New account address to activate.
          schema:
            type: string
        - name: Permission_id
          required: false
          description: Permission ID for multi-signature.
          schema:
            type: integer
        - name: visible
          required: false
          description: Whether to use Base58 address format.
          schema:
            type: boolean
      result:
        name: transaction
        description: Unsigned transaction object.
        schema:
          type: object

    /wallet/createassetissue:
      name: /wallet/createassetissue
      summary: Issue TRC-10 token
      description: Create a transaction to issue a TRC-10 token. An account can only issue one token.
      params:
        - name: owner_address
          required: true
          description: Issuer account address.
          schema:
            type: string
        - name: name
          required: true
          description: Token name.
          schema:
            type: string
        - name: abbr
          required: true
          description: Token abbreviation or symbol.
          schema:
            type: string
        - name: total_supply
          required: true
          description: Total supply of the token.
          schema:
            type: integer
        - name: trx_num
          required: true
          description: Price ratio numerator in sun.
          schema:
            type: integer
        - name: num
          required: true
          description: Price ratio denominator.
          schema:
            type: integer
        - name: start_time
          required: true
          description: ICO start time in milliseconds.
          schema:
            type: integer
        - name: end_time
          required: true
          description: ICO end time in milliseconds.
          schema:
            type: integer
        - name: precision
          required: false
          description: Number of decimal places.
          schema:
            type: integer
        - name: visible
          required: false
          description: Whether to use Base58 address format.
          schema:
            type: boolean
      result:
        name: transaction
        description: Unsigned TRC-10 issuance transaction.
        schema:
          type: object

    /wallet/createshieldedcontractparameters:
      name: /wallet/createshieldedcontractparameters
      summary: Create shielded contract parameters
      description: Create parameters for shielded TRC-20 contract operations.
      params:
        - name: shielded_TRC20_contract_address
          required: true
          description: Shielded TRC-20 contract address.
          schema:
            type: string
        - name: ovk
          required: false
          description: Outgoing viewing key.
          schema:
            type: string
        - name: from_amount
          required: false
          description: From amount.
          schema:
            type: string
        - name: to_amount
          required: false
          description: To amount.
          schema:
            type: string
        - name: transparent_to_address
          required: false
          description: Transparent recipient address.
          schema:
            type: string
        - name: ask
          required: false
          description: Authorization spend key.
          schema:
            type: string
        - name: nsk
          required: false
          description: Nullifier spending key.
          schema:
            type: string
      result:
        name: parameters
        description: Shielded contract parameters.
        schema:
          type: object

    /wallet/createspendauthsig:
      name: /wallet/createspendauthsig
      summary: Create spend auth signature
      description: Create a spend authorization signature for shielded transactions.
      params:
        - name: ask
          required: true
          description: Authorization spend key.
          schema:
            type: string
        - name: tx_hash
          required: true
          description: Transaction hash.
          schema:
            type: string
        - name: alpha
          required: true
          description: Alpha value.
          schema:
            type: string
      result:
        name: signature
        description: Spend authorization signature.
        schema:
          type: object

    /wallet/createtransaction:
      name: /wallet/createtransaction
      summary: Create TRX transfer
      description: Create a TRX transfer transaction. If the recipient does not exist, the account will be automatically activated.
      params:
        - name: owner_address
          required: true
          description: Sender address.
          schema:
            type: string
        - name: to_address
          required: true
          description: Recipient address.
          schema:
            type: string
        - name: amount
          required: true
          description: Amount of TRX to transfer in sun (1 TRX = 1,000,000 sun).
          schema:
            type: integer
        - name: Permission_id
          required: false
          description: Permission ID for multi-signature.
          schema:
            type: integer
        - name: visible
          required: false
          description: Whether to use Base58 address format.
          schema:
            type: boolean
        - name: extra_data
          required: false
          description: Remarks in hex format.
          schema:
            type: string
      result:
        name: transaction
        description: Unsigned TRX transfer transaction.
        schema:
          type: object

    /wallet/delegateresource:
      name: /wallet/delegateresource
      summary: Delegate resource
      description: Delegate bandwidth or energy resources to another account under Stake 2.0.
      params:
        - name: owner_address
          required: true
          description: Delegator account address.
          schema:
            type: string
        - name: receiver_address
          required: true
          description: Resource receiver address.
          schema:
            type: string
        - name: balance
          required: true
          description: Amount of TRX staked for resources in sun.
          schema:
            type: integer
        - name: resource
          required: true
          description: Resource type, either "BANDWIDTH" or "ENERGY".
          schema:
            type: string
        - name: lock
          required: false
          description: Whether to lock the delegation.
          schema:
            type: boolean
        - name: lock_period
          required: false
          description: Lock duration in blocks (1 block ~ 3 seconds).
          schema:
            type: integer
        - name: Permission_id
          required: false
          description: Permission ID for multi-signature.
          schema:
            type: integer
        - name: visible
          required: false
          description: Whether to use Base58 address format.
          schema:
            type: boolean
      result:
        name: transaction
        description: Unsigned delegate resource transaction.
        schema:
          type: object

    /wallet/deploycontract:
      name: /wallet/deploycontract
      summary: Deploy smart contract
      description: Create a transaction to deploy a smart contract on the TRON network.
      params:
        - name: owner_address
          required: true
          description: Contract deployer address.
          schema:
            type: string
        - name: abi
          required: true
          description: Smart contract ABI as a JSON string.
          schema:
            type: string
        - name: bytecode
          required: true
          description: Compiled contract bytecode in hex.
          schema:
            type: string
        - name: fee_limit
          required: true
          description: Maximum TRX consumption in sun.
          schema:
            type: integer
        - name: parameter
          required: false
          description: ABI-encoded constructor parameters in hex.
          schema:
            type: string
        - name: origin_energy_limit
          required: false
          description: Maximum energy per transaction set by the creator.
          schema:
            type: integer
        - name: name
          required: false
          description: Contract name.
          schema:
            type: string
        - name: call_value
          required: false
          description: TRX transferred at deployment in sun.
          schema:
            type: integer
        - name: consume_user_resource_percent
          required: false
          description: User energy consumption percentage (0-100).
          schema:
            type: integer
        - name: visible
          required: false
          description: Whether to use Base58 address format.
          schema:
            type: boolean
      result:
        name: transaction
        description: Unsigned contract deployment transaction.
        schema:
          type: object

    /wallet/estimateenergy:
      name: /wallet/estimateenergy
      summary: Estimate energy
      description: Estimate the energy required for a smart contract transaction or contract deployment.
      params:
        - name: owner_address
          required: false
          description: Caller account address.
          schema:
            type: string
        - name: contract_address
          required: false
          description: Contract address.
          schema:
            type: string
        - name: function_selector
          required: false
          description: Function signature string, e.g. "transfer(address,uint256)".
          schema:
            type: string
        - name: parameter
          required: false
          description: ABI-encoded function parameters in hex.
          schema:
            type: string
        - name: data
          required: false
          description: Complete ABI-encoded call data. Takes priority over function_selector and parameter.
          schema:
            type: string
        - name: call_value
          required: false
          description: TRX amount in sun.
          schema:
            type: integer
        - name: visible
          required: false
          description: Whether to use Base58 address format.
          schema:
            type: boolean
      result:
        name: result
        description: Energy estimation result.
        schema:
          type: object
          properties:
            result: { type: object }
            energy_required: { type: integer }
          example:
            result:
              result: true
            energy_required: 345000

    /wallet/exchangecreate:
      name: /wallet/exchangecreate
      summary: Create exchange pair
      description: Create a token exchange trading pair.
      params:
        - name: owner_address
          required: true
          description: Creator account address.
          schema:
            type: string
        - name: first_token_id
          required: true
          description: First token ID.
          schema:
            type: string
        - name: first_token_balance
          required: true
          description: First token balance.
          schema:
            type: integer
        - name: second_token_id
          required: true
          description: Second token ID.
          schema:
            type: string
        - name: second_token_balance
          required: true
          description: Second token balance.
          schema:
            type: integer
        - name: visible
          required: false
          description: Whether to use Base58 address format.
          schema:
            type: boolean
      result:
        name: transaction
        description: Unsigned exchange creation transaction.
        schema:
          type: object

    /wallet/exchangeinject:
      name: /wallet/exchangeinject
      summary: Inject capital into exchange
      description: Inject capital into an existing token exchange trading pair.
      params:
        - name: owner_address
          required: true
          description: Account address.
          schema:
            type: string
        - name: exchange_id
          required: true
          description: Exchange pair ID.
          schema:
            type: integer
        - name: token_id
          required: true
          description: Token ID to inject.
          schema:
            type: string
        - name: quant
          required: true
          description: Amount to inject.
          schema:
            type: integer
        - name: visible
          required: false
          description: Whether to use Base58 address format.
          schema:
            type: boolean
      result:
        name: transaction
        description: Unsigned inject capital transaction.
        schema:
          type: object

    /wallet/exchangetransaction:
      name: /wallet/exchangetransaction
      summary: Exchange transaction
      description: Participate in a token exchange trading pair transaction.
      params:
        - name: owner_address
          required: true
          description: Account address.
          schema:
            type: string
        - name: exchange_id
          required: true
          description: Exchange pair ID.
          schema:
            type: integer
        - name: token_id
          required: true
          description: Token ID to sell.
          schema:
            type: string
        - name: quant
          required: true
          description: Amount to sell.
          schema:
            type: integer
        - name: expected
          required: true
          description: Minimum expected amount to receive.
          schema:
            type: integer
        - name: visible
          required: false
          description: Whether to use Base58 address format.
          schema:
            type: boolean
      result:
        name: transaction
        description: Unsigned exchange transaction.
        schema:
          type: object

    /wallet/exchangewithdraw:
      name: /wallet/exchangewithdraw
      summary: Withdraw from exchange
      description: Withdraw capital from a token exchange trading pair.
      params:
        - name: owner_address
          required: true
          description: Account address.
          schema:
            type: string
        - name: exchange_id
          required: true
          description: Exchange pair ID.
          schema:
            type: integer
        - name: token_id
          required: true
          description: Token ID to withdraw.
          schema:
            type: string
        - name: quant
          required: true
          description: Amount to withdraw.
          schema:
            type: integer
        - name: visible
          required: false
          description: Whether to use Base58 address format.
          schema:
            type: boolean
      result:
        name: transaction
        description: Unsigned withdrawal transaction.
        schema:
          type: object

    /wallet/freezebalance:
      name: /wallet/freezebalance
      summary: Freeze balance (Stake 1.0)
      description: Stake TRX under the Stake 1.0 mechanism. Deprecated in favor of freezebalancev2.
      params:
        - name: owner_address
          required: true
          description: Account address.
          schema:
            type: string
        - name: frozen_balance
          required: true
          description: TRX amount to freeze in sun.
          schema:
            type: integer
        - name: frozen_duration
          required: true
          description: Duration in days (minimum 3).
          schema:
            type: integer
        - name: resource
          required: true
          description: Resource type, either "BANDWIDTH" or "ENERGY".
          schema:
            type: string
        - name: receiver_address
          required: false
          description: Resource recipient address.
          schema:
            type: string
        - name: Permission_id
          required: false
          description: Permission ID for multi-signature.
          schema:
            type: integer
        - name: visible
          required: false
          description: Whether to use Base58 address format.
          schema:
            type: boolean
      result:
        name: transaction
        description: Unsigned staking transaction.
        schema:
          type: object

    /wallet/freezebalancev2:
      name: /wallet/freezebalancev2
      summary: Freeze balance (Stake 2.0)
      description: Stake TRX under the Stake 2.0 mechanism to obtain bandwidth or energy and equivalent TRON Power.
      params:
        - name: owner_address
          required: true
          description: Account address.
          schema:
            type: string
        - name: frozen_balance
          required: true
          description: TRX stake amount in sun.
          schema:
            type: integer
        - name: resource
          required: true
          description: Resource type, either "BANDWIDTH" or "ENERGY".
          schema:
            type: string
        - name: Permission_id
          required: false
          description: Permission ID for multi-signature.
          schema:
            type: integer
        - name: visible
          required: false
          description: Whether to use Base58 address format.
          schema:
            type: boolean
      result:
        name: transaction
        description: Unsigned staking transaction.
        schema:
          type: object

    /wallet/getaccount:
      name: /wallet/getaccount
      summary: Get account
      description: Query complete on-chain information for a specified TRON account.
      params:
        - name: address
          required: true
          description: Account address in Base58 or hex format.
          schema:
            type: string
        - name: visible
          required: false
          description: Whether to use Base58 address format. Defaults to false.
          schema:
            type: boolean
      result:
        name: account
        description: Account object with address, balance, frozen resources, permissions, and more.
        schema:
          type: object
          example:
            address: "TZ4UXDV5ZhNW7fb2AMSbgfAEZ7hWsnYS2g"
            balance: 1000000
            create_time: 1560407940000

    /wallet/getaccountbalance:
      name: /wallet/getaccountbalance
      summary: Get account balance at block
      description: Query TRX balance of a TRON account at a specific historical block height.
      params:
        - name: account_identifier
          required: true
          description: Object containing the account address.
          schema:
            type: object
            properties:
              address: { type: string }
        - name: block_identifier
          required: true
          description: Object containing the block hash and number.
          schema:
            type: object
            properties:
              hash: { type: string }
              number: { type: integer }
        - name: visible
          required: false
          description: Whether to use Base58 address format.
          schema:
            type: boolean
      result:
        name: result
        description: Balance at the specified block.
        schema:
          type: object
          properties:
            balance: { type: integer }
            block_identifier: { type: object }

    /wallet/getaccountnet:
      name: /wallet/getaccountnet
      summary: Get account bandwidth
      description: Query bandwidth resource details for a specified TRON account.
      params:
        - name: address
          required: true
          description: Account address.
          schema:
            type: string
        - name: visible
          required: false
          description: Whether to use Base58 address format.
          schema:
            type: boolean
      result:
        name: result
        description: Bandwidth resource information.
        schema:
          type: object

    /wallet/getaccountresource:
      name: /wallet/getaccountresource
      summary: Get account resource
      description: Query the resource overview including bandwidth and energy for a specified TRON account.
      params:
        - name: address
          required: true
          description: Account address.
          schema:
            type: string
        - name: visible
          required: false
          description: Whether to use Base58 address format.
          schema:
            type: boolean
      result:
        name: result
        description: Resource information with bandwidth and energy metrics.
        schema:
          type: object

    /wallet/getakfromask:
      name: /wallet/getakfromask
      summary: Get ak from ask
      description: Derive the account key (ak) from the authorization spend key (ask).
      params:
        - name: value
          required: true
          description: Authorization spend key in hex.
          schema:
            type: string
      result:
        name: result
        description: Derived account key value.
        schema:
          type: object
          properties:
            value: { type: string }

    /wallet/getassetissuebyaccount:
      name: /wallet/getassetissuebyaccount
      summary: Get TRC-10 tokens by account
      description: Query all TRC-10 tokens issued by a specified account.
      params:
        - name: address
          required: true
          description: Issuer account address.
          schema:
            type: string
        - name: visible
          required: false
          description: Whether to use Base58 address format.
          schema:
            type: boolean
      result:
        name: result
        description: List of TRC-10 tokens.
        schema:
          type: object

    /wallet/getassetissuebyid:
      name: /wallet/getassetissuebyid
      summary: Get TRC-10 token by ID
      description: Query a TRC-10 token by its ID.
      params:
        - name: value
          required: true
          description: Token ID.
          schema:
            type: string
      result:
        name: result
        description: TRC-10 token information.
        schema:
          type: object

    /wallet/getassetissuebyname:
      name: /wallet/getassetissuebyname
      summary: Get TRC-10 token by name
      description: Query a TRC-10 token by its name.
      params:
        - name: value
          required: true
          description: Token name.
          schema:
            type: string
      result:
        name: result
        description: TRC-10 token information.
        schema:
          type: object

    /wallet/getassetissuelist:
      name: /wallet/getassetissuelist
      summary: Get all TRC-10 tokens
      description: Query a list of all TRC-10 tokens on the TRON network.
      params: []
      result:
        name: result
        description: Array of all TRC-10 token objects.
        schema:
          type: object

    /wallet/getassetissuelistbyname:
      name: /wallet/getassetissuelistbyname
      summary: Get TRC-10 tokens by name
      description: Query all TRC-10 token lists matching the given name.
      params:
        - name: value
          required: true
          description: Token name.
          schema:
            type: string
      result:
        name: result
        description: Array of matching TRC-10 token objects.
        schema:
          type: object

    /wallet/getavailableunfreezecount:
      name: /wallet/getavailableunfreezecount
      summary: Get available unfreeze count
      description: Query the remaining number of unstake operations an account can initiate under Stake 2.0.
      params:
        - name: owner_address
          required: true
          description: Account address.
          schema:
            type: string
        - name: visible
          required: false
          description: Whether to use Base58 address format.
          schema:
            type: boolean
      result:
        name: result
        description: Remaining unfreeze count.
        schema:
          type: object

    /wallet/getbandwidthprices:
      name: /wallet/getbandwidthprices
      summary: Get bandwidth prices
      description: Query the historical record of bandwidth unit price changes on the TRON network.
      params: []
      result:
        name: result
        description: Historical bandwidth unit price information.
        schema:
          type: object

    /wallet/getblock:
      name: /wallet/getblock
      summary: Get block
      description: Query block information by block height or block hash. If neither is provided, returns the latest block.
      params:
        - name: id_or_num
          required: false
          description: Block height or block hash. If omitted, queries the latest block.
          schema:
            type: string
        - name: detail
          required: false
          description: If true, returns full block details. If false, returns header only.
          schema:
            type: boolean
      result:
        name: block
        description: Block information.
        schema:
          type: object

    /wallet/getblockbalance:
      name: /wallet/getblockbalance
      summary: Get block balance changes
      description: Get TRX balance changes caused by all transactions in a specified block.
      params:
        - name: hash
          required: true
          description: Block hash.
          schema:
            type: string
        - name: number
          required: true
          description: Block height.
          schema:
            type: integer
        - name: visible
          required: false
          description: Whether to use Base58 address format.
          schema:
            type: boolean
      result:
        name: result
        description: Block balance trace information.
        schema:
          type: object

    /wallet/getblockbyid:
      name: /wallet/getblockbyid
      summary: Get block by ID
      description: Query complete block information by block hash.
      params:
        - name: value
          required: true
          description: Block hash.
          schema:
            type: string
      result:
        name: block
        description: Block information.
        schema:
          type: object

    /wallet/getblockbylatestnum:
      name: /wallet/getblockbylatestnum
      summary: Get latest blocks
      description: Query the latest N blocks in descending order.
      params:
        - name: num
          required: true
          description: Number of blocks to retrieve.
          schema:
            type: integer
      result:
        name: blocks
        description: Array of block objects.
        schema:
          type: object

    /wallet/getblockbylimitnext:
      name: /wallet/getblockbylimitnext
      summary: Get blocks by range
      description: Query blocks within a specified height range.
      params:
