components:
  methods:
    eth_baseFee:
      name: eth_baseFee
      description: Returns the base fee for the next block.
      params: []
      result:
        name: Base fee
        description: The hex value of the base fee for the next block.
        schema:
          type: string
      examples:
        - name: eth_baseFee example
          params: []
          result:
            name: Base fee
            value: "0x34630b8a00"

    eth_getAssetBalance:
      name: eth_getAssetBalance
      description: Get an account's non-AVAX balance.
      params:
        - name: address
          required: true
          description: The owner of the asset
          schema:
            $ref: "../../_components/evm/base-types.yaml#/components/schemas/address"
        - name: blk
          required: true
          description: The block number or hash which to retrieve the balance
          schema:
            type: string
        - name: assetID
          required: true
          description: The id of the asset for which the balance is requested
          schema:
            type: string
      result:
        name: Asset balance
        description: The balance of an asset.
        schema:
          type: string
      examples:
        - name: eth_getAssetBalance example
          params:
            - name: address
              value: "0x8723e5773847A4Eb5FeEDabD9320802c5c812F46"
            - name: blk
              value: "latest"
            - name: assetID
              value: "3RvKBAmQnfYionFXMfW5P8TDZgZiogKbHjM8cjpu16LKAgF5T"
          result:
            name: Asset balance
            value: "0x1388"

    eth_getChainConfig:
      name: eth_getChainConfig
      description: Returns the chain config of the blockchain.
      params: []
      result:
        name: Chain config
        description: The chain config of the blockchain.
        schema:
          type: object
          properties:
            chainId:
              type: integer
              description: The chain ID of the blockchain
            feeConfig:
              type: object
              properties:
                gasLimit:
                  type: integer
                  description: The gas limit per block
                targetBlockRate:
                  type: integer
                  description: The target block rate
                minBlockGasCost:
                  type: integer
                  description: The minimum block gas cost
                maxBlockGasCost:
                  type: integer
                  description: The maximum block gas cost
            feeManagerConfig:
              type: object
              properties:
                adminAddresses:
                  type: array
                  items:
                    type: string
                    description: The admin addresses
                blockTimestamp:
                  type: integer
                  description: The block timestamp for the fee manager config
            upgrades:
              type: object
              properties:
                precompileUpgrades:
                  type: array
                  items:
                    type: object
                    properties:
                      feeManagerConfig:
                        type: object
                        properties:
                          adminAddresses:
                            type: array
                            items:
                              type: string
                              description: The admin addresses
                          blockTimestamp:
                            type: integer
                            description: The block timestamp for the fee manager config
                          disable:
                            type: boolean
                            description: Whether to disable the upgrade
