    # Client methods
    eth_syncing:
      name: eth_syncing
      description: Returns an object with data about the sync status or `false` if not syncing.
      params: []
      result:
        name: Syncing status
        description: An object with synchronization status data when syncing, or `false` when not syncing.
        schema:
          oneOf:
            - type: boolean
              # enum: [false]
            - $ref: "../evm/client.yaml#/components/schemas/SyncingStatus"
      examples:
        - name: eth_syncing example (syncing)
          params: []
          result:
            name: Syncing status
            value:
              startingBlock: "0x0"
              currentBlock: "0x1518"
              highestBlock: "0x9567a3"
        - name: eth_syncing example (not syncing)
          params: []
          result:
            name: Syncing status
            value: false

    eth_accounts:
      name: eth_accounts
      description: Returns a list of addresses owned by the client.
      params: []
      result:
        name: Accounts
        description: An array of account addresses owned by the client. Can be empty if no accounts are available.
        schema:
          title: Accounts
          type: array
          items:
            $ref: "../evm/base-types.yaml#/components/schemas/address"
      examples:
        - name: eth_accounts example
          params: []
          result:
            name: Accounts
            value:
              - "0xd1f5279be4b4dd94133a23dee1b23f5bfc0db1d0"

    eth_protocolVersion:
      name: eth_protocolVersion
      description: Returns the current protocol version used by the client.
      params: []
      result:
        name: Protocol Version
        description: The protocol version as a hexadecimal string.
        schema:
          title: Protocol Version
          type: string
      examples:
        - name: eth_protocolVersion example
          params: []
          result:
            name: Protocol Version
            value: "0x3f"

    net_listening:
      name: net_listening
      description: Returns `true` if the client is actively listening for network connections.
      params: []
      result:
        name: Listening
        description: Boolean value indicating if the client is listening for network connections.
        schema:
          type: boolean
      examples:
        - name: net_listening example
          params: []
          result:
            name: Listening
            value: true

    # Execute methods
    eth_simulateV1:
      name: eth_simulateV1
      description: Enables simulation of complex transactions and state changes without modifying the blockchain.
      params:
        - name: Simulation object
          required: true
          description: The object containing all simulation details such as calls, overrides, etc.
          schema:
            $ref: "../evm/simulate.yaml#/components/schemas/SimulateRequest"
      result:
        name: Simulation result
        description: The result of the simulation.
        schema:
          $ref: "../evm/simulate.yaml#/components/schemas/SimulateResult"
      examples:
        - name: eth_simulateV1 example
          params:
            - name: Simulation object
              value:
                blockStateCalls:
                  - blockOverrides:
                      baseFeePerGas: "0x9"
                    stateOverrides:
                      "0xc000000000000000000000000000000000000000":
                        balance: "0x4a817c800"
                    calls:
                      - from: "0xc000000000000000000000000000000000000000"
                        to: "0xc000000000000000000000000000000000000001"
                        maxFeePerGas: "0xf"
                        value: "0x1"
                      - from: "0xc000000000000000000000000000000000000000"
                        to: "0xc000000000000000000000000000000000000002"
                        maxFeePerGas: "0xf"
                        value: "0x1"
                validation: true
                traceTransfers: true
            - name: Block
              value: "latest"
