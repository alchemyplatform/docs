                - 0.0
                - 1.0
                - 0.0

    # Filter methods
    eth_newPendingTransactionFilter:
      name: eth_newPendingTransactionFilter
      description: Creates a filter in the node to notify when new pending transactions arrive.
      params: []
      result:
        name: Filter identifier
        description: A hexadecimal string representing the ID of the created filter.
        schema:
          $ref: "../evm/base-types.yaml#/components/schemas/uint"
      examples:
        - name: eth_newPendingTransactionFilter example
          params: []
          result:
            name: Filter identifier
            value: "0x01"

    # State methods
    eth_getProof:
      name: eth_getProof
      description: Returns the Merkle proof for a given account and optionally some storage keys.
      params:
        - name: Address
          required: true
          description: The address of the account to generate the proof for.
          schema:
            $ref: "../evm/base-types.yaml#/components/schemas/address"
        - name: StorageKeys
          required: true
          description: An array of storage keys (slots) to generate proofs for.
          schema:
            title: Storage keys
            type: array
            items:
              $ref: "../evm/base-types.yaml#/components/schemas/bytesMax32"
        - name: Block
          required: true
          description: The block number, tag, or hash at which to generate the proof.
          schema:
            $ref: "../evm/block.yaml#/components/schemas/BlockNumberOrTagOrHash"
      result:
        name: Account proof
        description: An object containing the account proof and storage proofs.
        schema:
          $ref: "../evm/state.yaml#/components/schemas/AccountProof"
      examples:
        - name: eth_getProof example
          params:
            - name: Address
              value: "0xe5cB067E90D5Cd1F8052B83562Ae670bA4A211a8"
            - name: StorageKeys
              value:
                - "0x56e81f171bcc55a6ff8345e692c0f86e5b48e01b996cadc001622fb5e363b421"
                - "0x283s34c8e2b1456f09832c71e5d6a0b4f8c9e1d3a2b5c7f0e6d4a8b2c1f3e5d7"
            - name: Block
              value: "latest"
          result:
            name: Account proof
            value:
              accountProof:
                - ""
              balance: "0x0"
              codeHash: "0xc5d2460186f7233c927e7db2dcc703c0e500b653ca82273b7bfad8045d85a470"
              nonce: "0x0"
              storageHash: "0x56e81f171bcc55a6ff8345e692c0f86e5b48e01b996cadc001622fb5e363b421"
              storageProof:
                - key: "0x56e81f171bcc55a6ff8345e692c0f86e5b48e01b996cadc001622fb5e363b421"
                  proof:
                    - ""
                  value: "0x1"

    # Blob methods
    eth_blobBaseFee:
      name: eth_blobBaseFee
      description: Returns the base fee per blob gas in wei for the current block.
      params: []
      result:
        name: Blob Base Fee
        description: The base fee per blob gas, in wei, as a hexadecimal encoded unsigned integer.
        schema:
          $ref: "../evm/base-types.yaml#/components/schemas/bytes"
      examples:
        - name: eth_blobBaseFee example
          params: []
          result:
            name: Blob Base Fee
            value: "0x3b9aca00"

    eth_getBlobSidecars:
      name: eth_getBlobSidecars
      description: Returns the blob sidecars for a given block, identified by block hash or block number.
      params:
        - name: Block Identifier
          description: A block hash or block number to retrieve blob sidecars for.
          schema:
            oneOf:
              - $ref: "../evm/base-types.yaml#/components/schemas/hash32"
              - $ref: "../evm/base-types.yaml#/components/schemas/uint"
      result:
        name: Blob Sidecars
        description: An array of blob sidecar objects.
        schema:
          type: array
          items:
            type: object
            required: [index, blob, kzgCommitment, kzgProof]
            properties:
              index:
                $ref: "../evm/base-types.yaml#/components/schemas/uint"
              blob:
                $ref: "../evm/base-types.yaml#/components/schemas/bytes"
              kzgCommitment:
                $ref: "../evm/base-types.yaml#/components/schemas/bytes48"
              kzgProof:
                $ref: "../evm/base-types.yaml#/components/schemas/bytes96"
      examples:
        - name: eth_getBlobSidecars example
          params:
            - name: Block Identifier
              value: "0x41a5d8ffcc7ba7bbf3670caff9a2d95a63a4f31be905f86f5c44e25c2dfb30ed"
          result:
            name: Blob Sidecars
            value:
              - index: "0x0"
                blob: "0x..."
                kzgCommitment: "0x..."
                kzgProof: "0x..."

    eth_getFinalizedHeader:
      name: eth_getFinalizedHeader
      description: Returns the latest finalized execution payload header.
      params: []
      result:
        name: Finalized Header
        description: The finalized execution block header.
        schema:
          type: object
          additionalProperties: true
      examples:
        - name: eth_getFinalizedHeader example
          params: []
          result:
            name: Finalized Header
            value:
              parentHash: "0xabc123..."
              number: "0x123456"
              stateRoot: "0xdef456..."

    eth_getTransactionReceiptsByBlock:
      name: eth_getTransactionReceiptsByBlock
      description: Returns the transaction receipts for all transactions in a given block.
      params:
        - name: Block Identifier
          description: The block hash or block number.
          schema:
            oneOf:
              - $ref: "../evm/base-types.yaml#/components/schemas/hash32"
              - $ref: "../evm/base-types.yaml#/components/schemas/uint"
      result:
        name: Transaction Receipts
        description: An array of transaction receipt objects for the block's transactions.
        schema:
          type: array
          items:
            type: object
            additionalProperties: true
      examples:
        - name: eth_getTransactionReceiptsByBlock example
          params:
            - name: Block Identifier
              value: "0x91b1b84c7a4d7f17126f7186e0dd1bdc21c2d334a78b4034c0d3705797698c27"
          result:
            name: Transaction Receipts
            value:
              - transactionHash: "0xabc123..."
                status: "0x1"
                blockNumber: "0x123456"
                gasUsed: "0x5208"
                logs: []
