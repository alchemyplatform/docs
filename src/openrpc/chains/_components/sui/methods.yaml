    suix_getDynamicFields:
      name: suix_getDynamicFields
      summary: Get dynamic fields of an object
      description: >
        Returns a paginated list of dynamic field objects owned by a specified parent object ID.
        Dynamic fields allow objects to store flexible, extensible key-value mappings.

        > ⚠ This endpoint is only available with [Blast](https://www.alchemy.com/docs/reference/introduction-to-blast) access.
      params:
        - name: parent_object_id
          required: true
          description: The ID of the parent object that owns the dynamic fields.
          schema:
            $ref: "./client.yaml#/components/schemas/SUI_ADDRESS"
        - name: cursor
          required: false
          description: An optional paging cursor (ObjectID). If provided, returns items after this ID.
          schema:
            type: string
        - name: limit
          required: false
          description: Maximum number of items per page.
          schema:
            type: integer
      result:
        name: result
        description: A page of dynamic fields owned by the object.
        schema:
          $ref: "./filter.yaml#/components/schemas/PAGINATION_RESULT"
      examples:
        - name: Get dynamic fields by parent ID
          params:
            - name: parent_object_id
              value: "0xb3ba434a82d446c530044680cc4679eb59252e50e4435eddf7f6b959f39a4f7d"
            - name: cursor
              value: "0xba483c73a9b79bcc592cc5f163465ff1bc5c5d2e"
            - name: limit
              value: 2
          result:
            name: result
            value:
              data: []
              nextCursor: "0x000000000000000000000000ba483c73a9b79bcc592cc5f163465ff1bc5c5d2e"
              hasNextPage: false

