        name: Transaction information
        description: The transaction object containing various properties of the transaction.
        schema:
          oneOf:
            - $ref: "./base-types.yaml#/components/schemas/notFound"
            - $ref: "./transaction.yaml#/components/schemas/TransactionInfo"
      examples:
        - name: eth_getTransactionByHash example
          params:
            - name: Transaction hash
