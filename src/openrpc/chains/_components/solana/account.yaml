components:
  schemas:
    AccountData:
      title: Account Data
      type: array
      items:
        type: string
      description: Account data in the specified encoding format.
    AccountInfo:
      title: Account Information
      type: object
      properties:
        lamports:
          type: integer
          description: Number of lamports assigned to this account.
        owner:
          $ref: "./base-types.yaml#/components/schemas/Pubkey"
          description: Program owner of this account.
        data:
          $ref: "#/components/schemas/AccountData"
        executable:
          type: boolean
          description: Indicates if the account contains a program.
        rentEpoch:
          type: integer
          description: The epoch at which this account will next owe rent.
        size:
          type: integer
          description: The data size of the account.
    GetAccountInfoConfig:
      title: GetAccountInfo Configuration
      type: object
      properties:
        commitment:
          $ref: "./base-types.yaml#/components/schemas/Commitment"
        encoding:
          $ref: "./base-types.yaml#/components/schemas/Encoding"
          description: Encoding format for account data.
        dataSlice:
          $ref: "./base-types.yaml#/components/schemas/DataSlice"
        minContextSlot:
          $ref: "./base-types.yaml#/components/schemas/MinContextSlot"
        slot:
          type: integer
          minimum: 0
          description: >-
            [Account Archive](/docs/solana/account-archive) parameter. Return
            the account's state as of finalized slot `S` (inclusive): the
            latest write with `slot <= S`. Mutually exclusive with
            `lastUpdateBeforeSlot`, `firstUpdateAfterSlot`, and
            `minContextSlot`.
        lastUpdateBeforeSlot:
          type: integer
          minimum: 0
          description: >-
            [Account Archive](/docs/solana/account-archive) parameter. Return
            the most recent write to this account strictly before finalized
            slot `S`. The response's `context.slot` is the actual slot at
            which that write landed and can be used as the cursor for the
            next call. Mutually exclusive with `slot`,
            `firstUpdateAfterSlot`, and `minContextSlot`.
        firstUpdateAfterSlot:
          type: integer
          minimum: 0
          description: >-
            [Account Archive](/docs/solana/account-archive) parameter. Return
            the first write to this account strictly after finalized slot
            `S`. The response's `context.slot` is the actual slot at which
            that write landed and can be used as the cursor for the next
            call. Mutually exclusive with `slot`, `lastUpdateBeforeSlot`,
            and `minContextSlot`.
    GetBalanceConfig:
      title: GetBalance Configuration
      type: object
      properties:
        commitment:
          $ref: "./base-types.yaml#/components/schemas/Commitment"
        minContextSlot:
          $ref: "./base-types.yaml#/components/schemas/MinContextSlot"
        slot:
          type: integer
          minimum: 0
          description: >-
            [Account Archive](/docs/solana/account-archive) parameter. Return
            the account's lamport balance as of finalized slot `S`
            (inclusive): the latest write with `slot <= S`. Mutually
            exclusive with `minContextSlot`.
    LamportBalance:
      title: Lamport Balance
      type: integer
      description: The balance in lamports of the account.
    TokenBalanceByOwnerAtSlot:
      title: Token Balance by Owner at Slot
      type: object
      description: >-
        A wallet's balance of a single SPL Token or Token-2022 mint as of a
        specific finalized slot. `balance` is the UI amount using
        mint-prescribed decimals; `balanceRaw` is the raw u64 amount as a
        string. When `mint` is `So11111111111111111111111111111111111111112`
        the value reflects native SOL (wrapped) and `isNative` is `true`.
      properties:
        balance:
          type: string
          description: >-
            The balance formatted with the mint's decimals, as a string
            (e.g. `"1093.743449"`).
        balanceRaw:
          type: string
          description: >-
            The raw balance without decimals, as a string representation of
            u64.
        decimals:
          type: integer
          description: Number of base-10 digits to the right of the decimal place.
        isNative:
          type: boolean
          description: >-
            `true` when `mint` is the wrapped SOL mint
            (`So11111111111111111111111111111111111111112`).
        mint:
          $ref: "./base-types.yaml#/components/schemas/Pubkey"
          description: The base58-encoded token mint queried.
        slot:
          type: integer
          description: The finalized slot the balance was computed at.
        wallet:
          $ref: "./base-types.yaml#/components/schemas/Pubkey"
          description: The base58-encoded wallet whose balance was queried.
    GetMultipleAccountsConfig:
      title: GetMultipleAccounts Configuration
      type: object
      properties:
        commitment:
          $ref: "./base-types.yaml#/components/schemas/Commitment"
        minContextSlot:
          $ref: "./base-types.yaml#/components/schemas/MinContextSlot"
        dataSlice:
          $ref: "./base-types.yaml#/components/schemas/DataSlice"
        encoding:
          $ref: "./base-types.yaml#/components/schemas/Encoding"
          default: base64
    ProgramAccount:
      title: Program Account
      type: object
      properties:
        pubkey:
          $ref: "./base-types.yaml#/components/schemas/Pubkey"
          description: The account Pubkey as a base-58 encoded string.
        account:
          $ref: "#/components/schemas/AccountInfo"
    GetTokenAccountBalanceConfig:
      title: GetTokenAccountBalance Configuration
      type: object
      properties:
        commitment:
          $ref: "./base-types.yaml#/components/schemas/Commitment"
        slot:
          type: integer
          minimum: 0
          description: >-
            [Account Archive](/docs/solana/account-archive) parameter. Return
            the token account's balance as of finalized slot `S`
            (inclusive): the latest write with `slot <= S`.
    TokenBalance:
      title: Token Balance
      type: object
      properties:
        amount:
          type: string
          description: The raw balance without decimals, a string representation of u64.
        decimals:
          type: integer
          description: Number of base-10 digits to the right of the decimal place.
        uiAmount:
          type: number
          nullable: true
          description: The balance, using mint-prescribed decimals. **DEPRECATED**
        uiAmountString:
          type: string
          description: The balance as a string, using mint-prescribed decimals.
    TokenAccount:
      title: Token Account
      type: object
      properties:
        pubkey:
          $ref: "./base-types.yaml#/components/schemas/Pubkey"
          description: The account Pubkey as a base-58 encoded string.
        account:
          $ref: "#/components/schemas/AccountInfo"
    GetTokenAccountsByOwnerConfig:
      title: GetTokenAccountsByOwner Configuration
      type: object
      properties:
        commitment:
          $ref: "./base-types.yaml#/components/schemas/Commitment"
        minContextSlot:
          $ref: "./base-types.yaml#/components/schemas/MinContextSlot"
        dataSlice:
          $ref: "./base-types.yaml#/components/schemas/DataSlice"
        encoding:
          $ref: "./base-types.yaml#/components/schemas/Encoding"
          description: Encoding format for account data.
    GetTokenAccountsByOwnerAtSlotFilter:
      title: GetTokenAccountsByOwnerAtSlot Filter
      type: object
      description: >-
        Restricts results to a single mint or a single token program.
        Include either `mint` or `programId`, never both. Omit the whole
        object to return all token accounts.
      properties:
        mint:
          $ref: "./base-types.yaml#/components/schemas/Pubkey"
          description: >-
            Return only accounts of this token mint (base58 pubkey).
        programId:
          $ref: "./base-types.yaml#/components/schemas/Pubkey"
          description: >-
            Return only accounts owned by this token program. Must be
            `TokenkegQfeZyiNwAJbNbGKPFXCWuBvf9Ss623VQ5DA` (SPL Token) or
            `TokenzQdBNbLqP5VEhdkAS6EPFLC1PHnBqCXEpPxuEb` (Token-2022).
    GetTokenAccountsByOwnerAtSlotConfig:
      title: GetTokenAccountsByOwnerAtSlot Configuration
      type: object
      description: Optional point-in-time and pagination options.
      properties:
        slot:
          type: integer
          description: >-
            The slot to reconstruct the wallet's holdings at. Omit for the
            wallet's current holdings (as of the latest available slot).
        pageKey:
          type: string
          default: ""
          description: >-
            Cursor for the next page. Use the `pageKey` from the previous
            response; omit or send an empty string for the first page.
        pageLimit:
          type: integer
          default: 1000
          maximum: 10000
          description: >-
            Maximum number of token accounts per page. Values above `10000`
            are reduced to `10000`.
        encoding:
          $ref: "./base-types.yaml#/components/schemas/Encoding"
          description: >-
            Accepted for compatibility; responses are always `jsonParsed`.
    ParsedSplTokenAccountInfo:
      title: Parsed SPL Token Account Info
      type: object
      description: >-
        `jsonParsed` decoding of an SPL Token or Token-2022 account's data.
      properties:
        isNative:
          type: boolean
          description: >-
            `true` when this token account is the native SOL mint wrapper.
        mint:
          $ref: "./base-types.yaml#/components/schemas/Pubkey"
          description: The mint associated with this token account.
        owner:
          $ref: "./base-types.yaml#/components/schemas/Pubkey"
          description: The wallet that owns this token account.
        state:
          type: string
          description: >-
            Account state, typically `initialized`, `uninitialized`, or
            `frozen`.
        tokenAmount:
          $ref: "#/components/schemas/TokenBalance"
          description: The token balance held by this account.
    ParsedSplTokenAccountData:
      title: Parsed SPL Token Account Data
      type: object
      description: >-
        `jsonParsed` decoding of a token account's on-chain data. The
        outer envelope carries the parser identity; the actual account
        fields live under `parsed.info`.
      properties:
        program:
          type: string
          description: >-
            The program the parser used to decode this account
            (`spl-token` or `spl-token-2022`).
        space:
          type: integer
          description: On-chain data size in bytes.
        parsed:
          type: object
          description: The parsed account payload.
          properties:
            type:
              type: string
              description: The parsed record type (e.g., `account`).
            info:
              $ref: "#/components/schemas/ParsedSplTokenAccountInfo"
    ParsedTokenAccountInfo:
      title: Parsed Token Account Info
      type: object
      description: >-
        Account metadata plus the `jsonParsed` token account payload.
      properties:
        lamports:
          type: integer
          description: Number of lamports assigned to this account.
        owner:
          $ref: "./base-types.yaml#/components/schemas/Pubkey"
          description: >-
            The token program that owns this account (SPL Token or
            Token-2022).
        executable:
          type: boolean
          description: Indicates if the account contains a program.
        rentEpoch:
          type: integer
          description: The epoch at which this account will next owe rent.
        space:
          type: integer
          description: On-chain data size in bytes.
        data:
          $ref: "#/components/schemas/ParsedSplTokenAccountData"
    ParsedTokenAccount:
      title: Parsed Token Account
      type: object
      description: >-
        A single SPL Token or Token-2022 account with its data decoded in
        `jsonParsed` form.
      properties:
        pubkey:
          $ref: "./base-types.yaml#/components/schemas/Pubkey"
          description: The token account Pubkey as a base-58 encoded string.
        account:
          $ref: "#/components/schemas/ParsedTokenAccountInfo"
    GetTokenAccountsByOwnerAtSlotResult:
      title: GetTokenAccountsByOwnerAtSlot Result
      type: object
      description: >-
        A paginated set of token accounts held by the owner at the
        requested slot.
      properties:
        context:
          type: object
          description: The slot the result was computed at.
          properties:
            slot:
              type: integer
              description: >-
                The slot the result was computed at (the `slot` you
                requested, or the latest slot).
            apiVersion:
              type: string
              description: API version string.
        value:
          type: array
          description: >-
            The token accounts the wallet held at that slot, decoded in
            `jsonParsed` form.
          items:
            $ref: "#/components/schemas/ParsedTokenAccount"
        pageKey:
          type: string
          nullable: true
          description: >-
            Cursor for the next page, or `null` on the last page. Send it
            back in `config.pageKey` to continue paging.
    LargestAccountsConfig:
      title: LargestAccounts Configuration
      type: object
      properties:
        commitment:
          $ref: "./base-types.yaml#/components/schemas/Commitment"
        filter:
          type: string
          description: Filter results by account type.
          enum:
            - circulating
            - nonCirculating
    LargestAccount:
      title: Largest Account
      type: object
      properties:
        address:
          $ref: "./base-types.yaml#/components/schemas/Pubkey"
          description: Address of the account.
        lamports:
          type: integer
          description: Number of lamports in the account.
    LargestAccountsList:
      title: Largest Accounts List
      type: array
      items:
        $ref: "#/components/schemas/LargestAccount"
      description: List of the 20 largest accounts.
    StakeActivationConfig:
      title: StakeActivation Configuration
      type: object
      properties:
        commitment:
          $ref: "./base-types.yaml#/components/schemas/Commitment"
        epoch:
          type: integer
          description: Epoch for which to calculate activation details.
        minContextSlot:
          $ref: "./base-types.yaml#/components/schemas/MinContextSlot"
    StakeActivation:
      title: Stake Activation
      type: object
      properties:
        state:
          type: string
          enum:
            - active
            - inactive
            - activating
            - deactivating
          description: The stake account's activation state.
        active:
          type: integer
          description: Stake active during the epoch.
        inactive:
          type: integer
          description: Stake inactive during the epoch.
    GetTokenAccountsByDelegateConfig:
      title: GetTokenAccountsByDelegate Configuration
      type: object
      properties:
        commitment:
          $ref: "./base-types.yaml#/components/schemas/Commitment"
        minContextSlot:
          $ref: "./base-types.yaml#/components/schemas/MinContextSlot"
        dataSlice:
          $ref: "./base-types.yaml#/components/schemas/DataSlice"
        encoding:
          $ref: "./base-types.yaml#/components/schemas/Encoding"
          description: Encoding format for account data.
    GetTokenLargestAccountsConfig:
      title: GetTokenLargestAccounts Configuration
      type: object
      properties:
        commitment:
          $ref: "./base-types.yaml#/components/schemas/Commitment"
    TokenLargestAccount:
      title: Token Largest Account
      type: object
      properties:
        address:
          $ref: "./base-types.yaml#/components/schemas/Pubkey"
          description: Address of the token account.
        amount:
          type: string
          description: Raw amount in the account, without decimals.
        decimals:
          type: integer
          description: Number of decimals configured for the token's mint.
        uiAmount:
          type: number
          nullable: true
          description: Token amount using mint-prescribed decimals. **DEPRECATED**
        uiAmountString:
          type: string
          description: Token amount as a string, using mint-prescribed decimals.
    TokenLargestAccountsList:
      title: Token Largest Accounts List
      type: array
      items:
        $ref: "#/components/schemas/TokenLargestAccount"
      description: List of the 20 largest token accounts.
    GetTokenAccountsConfig:
      title: GetTokenAccounts Configuration
      type: object
      properties:
        mint:
          $ref: "./base-types.yaml#/components/schemas/Pubkey"
          description: The mint address to filter token accounts by.
        owner:
          $ref: "./base-types.yaml#/components/schemas/Pubkey"
          description: The owner address to filter token accounts by.
        programId:
          $ref: "./base-types.yaml#/components/schemas/Pubkey"
          description: The program ID to filter accounts by.
        commitment:
          $ref: "./base-types.yaml#/components/schemas/Commitment"
        minContextSlot:
          $ref: "./base-types.yaml#/components/schemas/MinContextSlot"
        dataSlice:
          $ref: "./base-types.yaml#/components/schemas/DataSlice"
        encoding:
          $ref: "./base-types.yaml#/components/schemas/Encoding"
          description: Encoding format for account data.
        limit:
          type: integer
          description: The maximum number of token accounts to retrieve.
          maximum: 1000
          default: 100
        cursor:
          type: string
          description: Cursor for pagination.
    TokenAccountsList:
      title: Token Accounts List
      type: object
      properties:
        total:
          type: integer
          description: Total number of token accounts.
        limit:
          type: integer
          description: Number of token accounts returned.
        cursor:
          type: string
          nullable: true
          description: Cursor for pagination.
        token_accounts:
          type: array
          items:
            $ref: "#/components/schemas/TokenAccount"
          description: Array of token accounts.
