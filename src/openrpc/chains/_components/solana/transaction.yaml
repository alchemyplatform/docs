components:
  schemas:
    SendTransactionConfig:
      title: SendTransaction Configuration
      type: object
      properties:
        encoding:
          type: string
          description: Encoding used for the transaction data.
          enum:
            - base58
            - base64
          default: base58
        skipPreflight:
          type: boolean
          description: Skip preflight transaction checks if `true`.
          default: false
        preflightCommitment:
          $ref: "./base-types.yaml#/components/schemas/Commitment"
          description: Commitment level to use for preflight.
          default: finalized
        maxRetries:
          type: integer
          description: Maximum retries for the RPC node to send the transaction.
        minContextSlot:
          $ref: "./base-types.yaml#/components/schemas/MinContextSlot"
    SendTransactionResult:
      title: Send Transaction Result
      type: string
      description: The transaction signature as a base-58 encoded string.
    SimulateTransactionConfig:
      title: SimulateTransaction Configuration
      type: object
      properties:
        commitment:
          $ref: "./base-types.yaml#/components/schemas/Commitment"
          default: finalized
        sigVerify:
          type: boolean
          description: If true, the transaction signatures will be verified.
          default: false
        replaceRecentBlockhash:
          type: boolean
          description: If true, replaces recent blockhash with the most recent one.
          default: false
        minContextSlot:
          $ref: "./base-types.yaml#/components/schemas/MinContextSlot"
        encoding:
          type: string
          description: Encoding used for the transaction data.
          enum:
            - base58
            - base64
          default: base58
        innerInstructions:
          type: boolean
          description: If true, includes inner instructions in the response.
          default: false
        accounts:
          $ref: "#/components/schemas/SimulateTransactionAccountsConfig"
    SimulateTransactionAccountsConfig:
      title: SimulateTransaction Accounts Configuration
      type: object
      properties:
        addresses:
          type: array
          items:
            $ref: "./base-types.yaml#/components/schemas/Pubkey"
          description: An array of account Pubkeys to return.
        encoding:
          $ref: "./base-types.yaml#/components/schemas/Encoding"
          description: Encoding for returned account data.
          default: base64
    SimulatedTransactionResult:
      title: Simulated Transaction Result
      type: object
      properties:
        err:
          type: string
          nullable: true
          description: Error if the transaction failed, null if succeeded.
        logs:
          type: array
          nullable: true
          items:
            type: string
          description: Log messages output during execution.
        accounts:
          type: array
          nullable: true
          items:
            $ref: "./account.yaml#/components/schemas/AccountInfo"
          description: Array of account information.
        unitsConsumed:
          type: integer
          description: Compute budget units consumed.
        returnData:
          $ref: "#/components/schemas/ReturnData"
        innerInstructions:
          type: object
          nullable: true
          description: Inner instructions if `innerInstructions` is true.
    SimulateBundleParams:
      title: SimulateBundle Parameters
      type: object
      properties:
        encodedTransactions:
          type: array
          items:
            type: string
          description: Array of encoded, serialized transactions to simulate.
      required:
        - encodedTransactions
    SimulateBundleConfig:
      title: SimulateBundle Configuration
      type: object
      properties:
        preExecutionAccountsConfigs:
          type: array
          description: >-
            Account capture configs for each transaction before execution. Array
            length must equal the number of transactions in the bundle. Use null
            for entries where no account state is requested.
          items:
            oneOf:
              - $ref: "#/components/schemas/SimulateBundleAccountsConfig"
              - type: "null"
        postExecutionAccountsConfigs:
          type: array
          description: >-
            Account capture configs for each transaction after execution. Array
            length must equal the number of transactions in the bundle. Use null
            for entries where no account state is requested.
          items:
            oneOf:
              - $ref: "#/components/schemas/SimulateBundleAccountsConfig"
              - type: "null"
        transactionEncoding:
          type: string
          description: Encoding used for the transactions in `encodedTransactions`.
          enum:
            - base64
            - base58
          default: base64
        simulationBank:
          type: string
          description: Bank to simulate against.
        skipSigVerify:
          type: boolean
          description: If true, signature verification is skipped before simulation.
          default: false
        replaceRecentBlockhash:
          type: boolean
          description: If true, replaces recent blockhash with the most recent one.
          default: false
    SimulateBundleAccountsConfig:
      title: SimulateBundle Accounts Configuration
      type: object
      properties:
        addresses:
          type: array
          items:
            $ref: "./base-types.yaml#/components/schemas/Pubkey"
          description: Base-58 encoded account addresses to capture.
        encoding:
          $ref: "./base-types.yaml#/components/schemas/Encoding"
          description: Encoding used for returned account data.
          default: base64
    SimulatedBundleTransactionResult:
      title: Simulated Bundle Transaction Result
      type: object
      properties:
        err:
          type: object
          nullable: true
          description: Error if the transaction failed, null if succeeded.
        logs:
          type: array
          nullable: true
          items:
            type: string
          description: Log messages output during execution.
        preExecutionAccounts:
          type: array
          nullable: true
          items:
            $ref: "./account.yaml#/components/schemas/AccountInfo"
          description: Account states before execution.
        postExecutionAccounts:
          type: array
          nullable: true
          items:
            $ref: "./account.yaml#/components/schemas/AccountInfo"
          description: Account states after execution.
        unitsConsumed:
          type: integer
          description: Compute budget units consumed.
        returnData:
          $ref: "#/components/schemas/ReturnData"
    SimulatedBundleResult:
      title: Simulated Bundle Result
      type: object
      properties:
        summary:
          type: string
          description: Summary of the bundle simulation result.
        transactionResults:
          type: array
          description: Result details for each transaction in the bundle.
          items:
            $ref: "#/components/schemas/SimulatedBundleTransactionResult"
    ReturnData:
      title: Return Data
      type: object
      nullable: true
      properties:
        programId:
          $ref: "./base-types.yaml#/components/schemas/Pubkey"
          description: Program that generated the return data.
        data:
          type: array
          items:
            type: string
          description: Return data as base-64 encoded binary data.
    GetSignaturesForAddressConfig:
      title: GetSignaturesForAddress Configuration
      type: object
      properties:
        commitment:
          $ref: "./base-types.yaml#/components/schemas/Commitment"
        minContextSlot:
          $ref: "./base-types.yaml#/components/schemas/MinContextSlot"
        limit:
          type: integer
          description: The maximum number of transaction signatures to return (between 1 and 1,000).
          default: 1000
        before:
          type: string
          description: Start searching backwards from this transaction signature.
        until:
          type: string
          description: Search until this transaction signature, if found before the limit is reached.
    GetTransactionsForAddressFilters:
      title: GetTransactionsForAddress Filters
      type: object
      description: Advanced filtering options for narrowing down results.
      properties:
        slot:
          type: object
          description: "Filter by slot number using comparison operators: `gte`, `gt`, `lte`, `lt`."
          properties:
            gte:
              type: integer
              description: Include slots greater than or equal to this value.
            gt:
              type: integer
              description: Include slots strictly greater than this value.
            lte:
              type: integer
              description: Include slots less than or equal to this value.
            lt:
              type: integer
              description: Include slots strictly less than this value.
        blockTime:
          type: object
          description: "Filter by Unix timestamp using comparison operators: `gte`, `gt`, `lte`, `lt`, `eq`."
          properties:
            gte:
              type: integer
              description: Include block times greater than or equal to this Unix timestamp.
            gt:
              type: integer
              description: Include block times strictly greater than this Unix timestamp.
            lte:
              type: integer
              description: Include block times less than or equal to this Unix timestamp.
            lt:
              type: integer
              description: Include block times strictly less than this Unix timestamp.
            eq:
              type: integer
              description: Include block times exactly equal to this Unix timestamp.
        signature:
          type: object
          description: "Filter by transaction signature using comparison operators: `gte`, `gt`, `lte`, `lt`."
          properties:
            gte:
              type: string
              description: Include signatures greater than or equal to this base-58 encoded value.
            gt:
              type: string
              description: Include signatures strictly greater than this base-58 encoded value.
            lte:
              type: string
              description: Include signatures less than or equal to this base-58 encoded value.
            lt:
              type: string
              description: Include signatures strictly less than this base-58 encoded value.
        status:
          type: string
          description: Filter by transaction success/failure status.
          enum:
            - succeeded
            - failed
            - any
          default: any
        tokenAccounts:
          type: string
          description: >-
            Filter transactions for related token accounts. `none` returns only
            transactions that reference the provided address. `balanceChanged`
            also returns transactions that modify the balance of a token account
            owned by the provided address. `all` returns transactions that
            reference the provided address or any token account owned by it.
          enum:
            - none
            - balanceChanged
            - all
          default: none
    GetTransactionsForAddressConfig:
      title: GetTransactionsForAddress Configuration
      type: object
      description: Optional configuration object containing additional settings for the query.
      properties:
        transactionDetails:
          type: string
          description: >-
            Level of transaction detail to return. `signatures` returns basic
            signature info (faster). `full` returns complete transaction data,
            removing the need for follow-up `getTransaction` calls (requires
            `limit` <= 100).
          enum:
            - signatures
            - full
          default: signatures
        sortOrder:
          type: string
          description: >-
            Sort order for results. `desc` returns newest first (default). `asc`
            returns oldest first (chronological order).
          enum:
            - asc
            - desc
          default: desc
        limit:
          type: integer
          description: >-
            Maximum number of transactions to return. Up to 1,000 when
            `transactionDetails` is `signatures`, or up to 100 when
            `transactionDetails` is `full`.
          default: 1000
        paginationToken:
          type: string
          description: 'Pagination token from a previous response (format: `"slot:position"`).'
        commitment:
          $ref: "./base-types.yaml#/components/schemas/Commitment"
          description: Commitment level. Only `finalized` or `confirmed` are supported; `processed` is not supported.
          default: finalized
        minContextSlot:
          $ref: "./base-types.yaml#/components/schemas/MinContextSlot"
        encoding:
          type: string
          description: >-
            Encoding format for transaction data (only applies when
            `transactionDetails` is `full`).
          enum:
            - json
            - jsonParsed
            - base64
            - base58
        maxSupportedTransactionVersion:
          type: integer
          description: >-
            The maximum transaction version to return. If omitted, only legacy
            transactions are returned. Set to `0` to include all versioned
            transactions.
        filters:
          $ref: "#/components/schemas/GetTransactionsForAddressFilters"
    GetTransactionsForAddressEntry:
      title: GetTransactionsForAddress Entry
      type: object
      description: A single transaction entry returned by `getTransactionsForAddress`.
      properties:
        signature:
          type: string
          description: The transaction signature as a base-58 encoded string. Only present when `transactionDetails` is `signatures`.
        slot:
          type: integer
          description: The slot that contains the block with the transaction.
        transactionIndex:
          type: integer
          description: The zero-based index of the transaction within its block.
        blockTime:
          type: integer
          nullable: true
          description: The estimated production time of the transaction as a Unix timestamp, null if not available.
        err:
          type: object
          nullable: true
          description: Error if the transaction failed, null if it succeeded. Only present when `transactionDetails` is `signatures`.
        memo:
          type: string
          nullable: true
          description: The memo associated with the transaction, null if no memo is present. Only present when `transactionDetails` is `signatures`.
        confirmationStatus:
          type: string
          nullable: true
          description: The transaction's cluster confirmation status. Only present when `transactionDetails` is `signatures`.
        version:
          oneOf:
            - type: string
            - type: number
          nullable: true
          description: Transaction version. Only present when `transactionDetails` is `full`.
        transaction:
          type: object
          description: Full transaction data. Only present when `transactionDetails` is `full`.
        meta:
          type: object
          nullable: true
          description: Transaction status metadata. Only present when `transactionDetails` is `full`.
    GetTransactionsForAddressResult:
      title: GetTransactionsForAddress Result
      type: object
      description: Paginated transaction history for the queried address.
      properties:
        data:
          type: array
          description: Array of transaction entries matching the query.
          items:
            $ref: "#/components/schemas/GetTransactionsForAddressEntry"
        paginationToken:
          type: string
          nullable: true
          description: 'Token for fetching the next page (format: `"slot:position"`), or null if no more results.'
    SignatureInfo:
      title: Signature Information
      type: object
      properties:
        signature:
          type: string
          description: The transaction signature as a base-58 encoded string.
        slot:
          type: integer
          description: The slot that contains the block with the transaction.
        err:
          type: object
          nullable: true
          description: Error if the transaction failed, null if the transaction succeeded.
        memo:
          type: string
          nullable: true
          description: The memo associated with the transaction, null if no memo is present.
        blockTime:
          type: integer
          nullable: true
          description: The estimated production time of the transaction as a Unix timestamp, null if not available.
        confirmationStatus:
          type: string
          nullable: true
          description: The transaction's cluster confirmation status, either `processed`, `confirmed`, or `finalized`.
    TransactionStatus:
      title: Transaction Status
      type: object
      properties:
        slot:
          type: integer
          description: The slot in which the transaction was processed.
        confirmations:
          type: integer
          nullable: true
          description: The number of blocks since signature confirmation, or null if rooted and finalized.
        err:
          type: object
          nullable: true
          description: Error if the transaction failed, or null if the transaction succeeded.
        confirmationStatus:
          type: string
          nullable: true
          description: The transaction's cluster confirmation status.
        status:
          type: object
          description: DEPRECATED. The transaction status.
    GetSignatureStatusesConfig:
      title: GetSignatureStatuses Configuration
      type: object
      properties:
        searchTransactionHistory:
          type: boolean
          description: If true, searches the ledger cache for any signatures not found in the recent status cache.
    GetTransactionConfig:
      title: GetTransaction Configuration
      type: object
      properties:
        commitment:
          $ref: "./base-types.yaml#/components/schemas/Commitment"
          description: Commitment level to use. `Processed` is not supported.
        maxSupportedTransactionVersion:
          type: integer
          description: Sets the max transaction version to return.
        encoding:
          type: string
          description: Encoding format for the returned transaction.
          enum:
            - json
            - jsonParsed
            - base64
            - base58
    TransactionDetails:
      title: Transaction Details
      type: object
      properties:
        slot:
          type: integer
          description: The slot this transaction was processed in.
        transaction:
          oneOf:
            - type: object
              description: The transaction details in JSON format.
            - type: string
              description: The transaction details as encoded binary data.
          description: The transaction details, either in JSON format or encoded binary data.
        blockTime:
          type: integer
          nullable: true
          description: Estimated production time as a Unix timestamp.
        meta:
          type: object
          nullable: true
          description: Transaction status metadata.
        version:
          oneOf:
            - type: string
            - type: number
          nullable: true
          description: Transaction version.
    GetTransactionsForAddressConfig:
      title: GetTransactionsForAddress Configuration
      type: object
      properties:
        transactionDetails:
          type: string
          description: >-
            Level of transaction detail to return. `signatures` returns only
            signature objects; `full` returns complete transaction data.
          enum:
            - signatures
            - full
          default: signatures
        sortOrder:
          type: string
          description: Order in which to return transactions. `desc` returns newest first; `asc` returns oldest first.
          enum:
            - desc
            - asc
          default: desc
        limit:
          type: integer
          description: Maximum number of results to return. Maximum is 1,000.
          default: 1000
        paginationToken:
          type: string
          description: >-
            Opaque token returned by a previous response. When provided,
            the response begins after the transaction identified by this token,
            overriding any `before` parameter.
        before:
          type: string
          description: >-
            Return transactions older than this transaction signature (exclusive).
            Ignored when `paginationToken` is provided.
        until:
          type: string
          description: >-
            Stop searching at this transaction signature (exclusive). Results will
            not include the transaction identified by this signature.
        encoding:
          type: string
          description: Encoding format for transaction data. Only applies when `transactionDetails` is `full`.
          enum:
            - json
            - jsonParsed
            - base64
            - base58
          default: json
        maxSupportedTransactionVersion:
          type: integer
          description: >-
            The maximum transaction version to return. Only applies when
            `transactionDetails` is `full`.
        commitment:
          type: string
          description: >-
            Commitment level for the request. Must be `confirmed` or `finalized`;
            passing `processed` returns an error. Defaults to `finalized`.
          enum:
            - confirmed
            - finalized
          default: finalized
        filters:
          $ref: "#/components/schemas/GetTransactionsForAddressFilters"
    GetTransactionsForAddressFilters:
      title: GetTransactionsForAddress Filters
      type: object
      properties:
        blockTime:
          $ref: "#/components/schemas/RangeFilter"
          description: >-
            Restrict results to transactions whose `blockTime` falls within
            this range (Unix timestamps, seconds).
        slot:
          $ref: "#/components/schemas/RangeFilter"
          description: Restrict results to transactions within this slot range.
    RangeFilter:
      title: Range Filter
      type: object
      properties:
        gte:
          type: integer
          description: Match values greater than or equal to this bound.
        gt:
          type: integer
          description: Match values strictly greater than this bound.
        lte:
          type: integer
          description: Match values less than or equal to this bound.
        lt:
          type: integer
          description: Match values strictly less than this bound.
    GetTransactionsForAddressResult:
      title: GetTransactionsForAddress Result
      type: object
      properties:
        data:
          type: array
          description: >-
            Array of transaction results. Each item is a signature object when
            `transactionDetails` is `signatures`, or a full transaction object
            when `transactionDetails` is `full`.
          items:
            oneOf:
              - $ref: "#/components/schemas/SignatureInfo"
              - $ref: "#/components/schemas/TransactionDetails"
        paginationToken:
          type: string
          nullable: true
          description: >-
            Token to pass as `paginationToken` in the next request to retrieve
            the following page of results. `null` when there are no more results.
    SlotConfig:
      title: Slot Configuration
      type: object
      properties:
        commitment:
          $ref: "./base-types.yaml#/components/schemas/Commitment"
        minContextSlot:
          $ref: "./base-types.yaml#/components/schemas/MinContextSlot"
