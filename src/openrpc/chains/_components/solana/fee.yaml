components:
  schemas:
    FeeForMessageParams:
      title: FeeForMessage Parameters
      type: object
      properties:
        Message:
          type: string
          description: Base-64 encoded Message.
    FeeForMessageConfig:
      title: FeeForMessage Configuration
      type: object
      properties:
        commitment:
          $ref: "./base-types.yaml#/components/schemas/Commitment"
        minContextSlot:
          $ref: "./base-types.yaml#/components/schemas/MinContextSlot"
    FeeForMessageResult:
      title: Fee For Message Result
      type: integer
      nullable: true
      description: Fee corresponding to the message at the specified blockhash.
    MinimumBalanceForRentExemptionParams:
      title: MinimumBalanceForRentExemption Parameters
      type: object
      properties:
        dataLength:
          type: integer
          description: Account's data length in bytes.
    MinimumBalanceForRentExemptionConfig:
      title: MinimumBalanceForRentExemption Configuration
      type: object
      properties:
        commitment:
          $ref: "./base-types.yaml#/components/schemas/Commitment"
    MinimumBalanceForRentExemptionResult:
      title: Minimum Balance For Rent Exemption
      type: integer
      description: Minimum lamports required to make an account rent exempt.
    RecentPrioritizationFee:
      title: Recent Prioritization Fee
      type: object
      properties:
        slot:
          type: integer
          description: Slot in which the fee was observed.
        prioritizationFee:
          type: integer
          description: The per-compute-unit fee in micro-lamports.
    GetRecentPrioritizationFeesParams:
      title: GetRecentPrioritizationFees Parameters
      type: object
      properties:
        AccountAddresses:
          type: array
          items:
            $ref: "./base-types.yaml#/components/schemas/Pubkey"
          description: An array of up to 128 account addresses as base-58 encoded strings.
    GetRecentPrioritizationFeesResult:
      title: Recent Prioritization Fees
      type: array
      items:
        $ref: "#/components/schemas/RecentPrioritizationFee"
      description: An array of prioritization fees observed in recent blocks.
    GetPriorityFeeEstimateOptions:
      title: GetPriorityFeeEstimate Options
      type: object
      properties:
        transactionEncoding:
          type: string
          enum: ["base58", "base64"]
          description: The encoding of the transaction.
        priorityLevel:
          type: string
          enum: ["Min", "Low", "Medium", "High", "VeryHigh", "UnsafeMax"]
          description: Priority level for the transaction.
        includeAllPriorityFeeLevels:
          type: boolean
          description: Include all priority fee levels in the response.
        lookbackSlots:
          type: integer
          minimum: 1
          maximum: 150
          description: Number of slots to look back for fee estimation.
        includeVote:
          type: boolean
          description: Include vote transactions in fee estimation.
        recommended:
          type: boolean
          description: Return recommended fee.
        evaluateEmptySlotAsZero:
          type: boolean
          description: Treat empty slots as zero fee.
    GetPriorityFeeEstimateParams:
      title: GetPriorityFeeEstimate Parameters
      type: object
      properties:
        transaction:
          type: string
          description: Base58 or Base64 encoded Solana transaction.
        accountKeys:
          type: array
          items:
            type: string
          description: Array of Solana account public keys for fee estimation.
        options:
          $ref: "#/components/schemas/GetPriorityFeeEstimateOptions"
    PriorityFeeLevels:
      title: Priority Fee Levels
      type: object
      properties:
        min:
          type: number
          description: Minimum priority fee in micro-lamports.
        low:
          type: number
          description: Low priority fee in micro-lamports.
        medium:
          type: number
          description: Medium priority fee in micro-lamports.
        high:
          type: number
          description: High priority fee in micro-lamports.
        veryHigh:
          type: number
          description: Very high priority fee in micro-lamports.
        unsafeMax:
          type: number
          description: Unsafe maximum priority fee in micro-lamports.
    GetPriorityFeeEstimateResult:
      title: Priority Fee Estimate Result
      type: object
      properties:
        priorityFeeEstimate:
          type: number
          description: Estimated priority fee in micro-lamports.
        priorityFeeLevels:
          $ref: "#/components/schemas/PriorityFeeLevels"
      description: Priority fee estimate and detailed fee levels.
