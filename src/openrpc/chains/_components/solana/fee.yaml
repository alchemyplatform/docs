components:
  schemas:
    FeeForMessageParams:
      title: FeeForMessage Parameters
      type: object
      properties:
        Message:
          type: string
          description: Base-64 encoded Message.
    FeeForMessageConfig:
      title: FeeForMessage Configuration
      type: object
      properties:
        commitment:
          $ref: "./base-types.yaml#/components/schemas/Commitment"
        minContextSlot:
          $ref: "./base-types.yaml#/components/schemas/MinContextSlot"
    FeeForMessageResult:
      title: Fee For Message Result
      type: integer
      nullable: true
      description: Fee corresponding to the message at the specified blockhash.
    MinimumBalanceForRentExemptionParams:
      title: MinimumBalanceForRentExemption Parameters
      type: object
      properties:
        dataLength:
          type: integer
          description: Account's data length in bytes.
    MinimumBalanceForRentExemptionConfig:
      title: MinimumBalanceForRentExemption Configuration
      type: object
      properties:
        commitment:
          $ref: "./base-types.yaml#/components/schemas/Commitment"
    MinimumBalanceForRentExemptionResult:
      title: Minimum Balance For Rent Exemption
      type: integer
      description: Minimum lamports required to make an account rent exempt.
    RecentPrioritizationFee:
      title: Recent Prioritization Fee
      type: object
      properties:
        slot:
          type: integer
          description: Slot in which the fee was observed.
        prioritizationFee:
          type: integer
          description: The per-compute-unit fee in micro-lamports.
    GetRecentPrioritizationFeesParams:
      title: GetRecentPrioritizationFees Parameters
      type: object
      properties:
        AccountAddresses:
          type: array
          items:
            $ref: "./base-types.yaml#/components/schemas/Pubkey"
          description: An array of up to 128 account addresses as base-58 encoded strings.
    GetRecentPrioritizationFeesResult:
      title: Recent Prioritization Fees
      type: array
      items:
        $ref: "#/components/schemas/RecentPrioritizationFee"
      description: An array of prioritization fees observed in recent blocks.
    GetPriorityFeeEstimateParams:
      title: GetPriorityFeeEstimate Parameters
      type: object
      description: |
        The single element in params (the config object). This object has two levels:
        - Top-level: transaction (optional), accountKeys (optional), and options (optional).
        - Put priorityLevel, recommended, lookbackSlots, etc. inside the options object, not next to transaction.
      properties:
        transaction:
          type: string
          description: Base58 or Base64 encoded Solana transaction for fee estimation analysis. Top-level key (sibling to options).
        accountKeys:
          type: array
          items:
            type: string
          description: Array of Base58-encoded Solana account public keys. Top-level key (sibling to options).
        options:
          $ref: "#/components/schemas/GetPriorityFeeEstimateOptions"
          description: Nested object for tuning; put priorityLevel, recommended, lookbackSlots, etc. here.
    GetPriorityFeeEstimateOptions:
      title: GetPriorityFeeEstimate Options (nested)
      type: object
      description: Nested under the options key of the params object. Do not put transaction or accountKeys here.
      properties:
        transactionEncoding:
          type: string
          enum:
            - base58
            - base64
          description: Encoding format of the transaction (default base58).
        priorityLevel:
          type: string
          enum:
            - Min
            - Low
            - Medium
            - High
            - VeryHigh
            - UnsafeMax
            - Default
          description: Priority level for fee estimation.
        includeAllPriorityFeeLevels:
          type: boolean
          description: When true, return estimates for all priority levels.
        ignoreZeroFees:
          type: boolean
          description: When true, exclude zero-fee transactions from percentile calculation.
        lookbackSlots:
          type: integer
          minimum: 1
          maximum: 150
          description: Number of recent slots to analyze for fee estimation. Default and max is 150.
        recommended:
          type: boolean
          default: false
          description: When true, return the recommended optimal fee (median).
        detailedBreakdown:
          type: boolean
          default: false
          description: When true, return per-account fee breakdown.
    PriorityFeeLevels:
      title: Priority Fee Levels
      type: object
      properties:
        min:
          type: number
          description: Minimum priority fee in microlamports.
        low:
          type: number
          description: Low priority fee in microlamports.
        medium:
          type: number
          description: Medium priority fee in microlamports.
        high:
          type: number
          description: High priority fee in microlamports.
        veryHigh:
          type: number
          description: Very high priority fee in microlamports.
        unsafeMax:
          type: number
          description: Unsafe maximum priority fee in microlamports.
    GetPriorityFeeEstimateResult:
      title: Priority Fee Estimate Result
      type: object
      description: Optimal priority fee estimate and optional fee levels for different priority tiers.
      properties:
        priorityFee:
          type: integer
          description: Estimated optimal fee in microlamports per compute unit (returned when a single priorityLevel or recommended is requested).
        priorityFeeLevels:
          $ref: "#/components/schemas/PriorityFeeLevels"
          description: Fee estimates for each priority tier (returned when includeAllPriorityFeeLevels is true).
        detailedBreakdown:
          type: array
          items:
            $ref: "#/components/schemas/AccountFeeDetails"
          description: Per-account fee breakdown (returned when detailedBreakdown option is true).
    AccountFeeDetails:
      title: Account Fee Details
      type: object
      properties:
        account:
          type: string
          description: Base58-encoded account public key.
        priorityFees:
          $ref: "#/components/schemas/PriorityFeeLevels"
          description: Fee estimates for this specific account.
