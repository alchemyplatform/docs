components:
  methods:
    getAccountInfo:
      name: getAccountInfo
      description: Returns all information associated with the account of provided Pubkey.
      x-compute-units: 10
      params:
        - name: Pubkey
          required: true
          description: Pubkey of the account to query.
          schema:
            $ref: "./base-types.yaml#/components/schemas/Pubkey"
        - name: Configuration
          required: false
          description: Optional configuration object for additional settings.
          schema:
            $ref: "./account.yaml#/components/schemas/GetAccountInfoConfig"
      examples:
        - name: getAccountInfo example
          params:
            - name: Pubkey
              value: "GwsPP9HHhCvEQeu3HTFzsVL6DEtnnYw4ALEtA3fMBC9Q"
        - name: Historical read at slot 400,000,000 (Account Archive)
          params:
            - name: Pubkey
              value: "3emsAVdmGKERbHjmGfQ6oZ1e35dkf5iYcS6U4CPKFVaa"
            - name: Configuration
              value:
                encoding: jsonParsed
                slot: 400000000
      result:
        name: Account information
        description: Returns details of the account including balance, ownership, and other relevant data.
        schema:
          $ref: "./account.yaml#/components/schemas/AccountInfo"
      errors:
        - code: -32020
          message: >-
            Out of coverage. The requested historical slot is outside the
            [Account Archive](/docs/solana/account-archive)'s coverage
            window: below the earliest indexed slot, above the latest
            finalized slot, or a `lastUpdateBeforeSlot` /
            `firstUpdateAfterSlot` cursor stepped past the edge of coverage
            (the terminal for a history walk).
        - code: -32602
          message: >-
            Invalid params. `slot`, `lastUpdateBeforeSlot`,
            `firstUpdateAfterSlot`, and `minContextSlot` are mutually
            exclusive. Also returned for a malformed Pubkey or
            configuration value.

    getBalance:
      name: getBalance
      description: Returns the lamport balance of the account of the provided Pubkey.
      x-compute-units: 10
      params:
        - name: Pubkey
          required: true
          description: Pubkey of the account to query.
          schema:
            $ref: "./base-types.yaml#/components/schemas/Pubkey"
        - name: Configuration
          required: false
          description: Optional configuration object containing additional settings.
          schema:
            $ref: "./account.yaml#/components/schemas/GetBalanceConfig"
      examples:
        - name: getBalance example
          params:
            - name: Pubkey
              value: "GwsPP9HHhCvEQeu3HTFzsVL6DEtnnYw4ALEtA3fMBC9Q"
        - name: Historical read at slot 400,000,000 (Account Archive)
          params:
            - name: Pubkey
              value: "3emsAVdmGKERbHjmGfQ6oZ1e35dkf5iYcS6U4CPKFVaa"
            - name: Configuration
              value:
                slot: 400000000
      result:
        name: Lamport balance
        description: Returns the balance in lamports of the account queried.
        schema:
          $ref: "./account.yaml#/components/schemas/LamportBalance"
      errors:
        - code: -32020
          message: >-
            Out of coverage. The requested `slot` is outside the
            [Account Archive](/docs/solana/account-archive)'s coverage
            window: below the earliest indexed slot or above the latest
            finalized slot.
        - code: -32602
          message: >-
            Invalid params. `slot` and `minContextSlot` are mutually
            exclusive. `lastUpdateBeforeSlot` and `firstUpdateAfterSlot`
            (available on `getAccountInfo`) are not supported on this
            method; only `slot`. Also returned for a malformed Pubkey or
            configuration value.

    getMultipleAccounts:
      name: getMultipleAccounts
      description: Returns the account information for a list of Pubkeys.
      x-compute-units: 20
      params:
        - name: Pubkeys
          required: true
          description: An array of Pubkeys to query.
          schema:
            type: array
            items:
              $ref: "./base-types.yaml#/components/schemas/Pubkey"
        - name: Configuration
          required: false
          description: Optional configuration object.
          schema:
            $ref: "./account.yaml#/components/schemas/GetMultipleAccountsConfig"
      examples:
        - name: getMultipleAccounts example
          params:
            - name: Pubkeys
              value:
                - "GwsPP9HHhCvEQeu3HTFzsVL6DEtnnYw4ALEtA3fMBC9Q"
                - "EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v"
      result:
        name: Account information
        description: An array of JSON objects containing account details.
        schema:
          type: array
          items:
            $ref: "./account.yaml#/components/schemas/AccountInfo"

    getTokenAccountBalance:
      name: getTokenAccountBalance
      description: Returns the token balance of an SPL Token account.
      x-compute-units: 20
      params:
        - name: Token account Pubkey
          required: true
          description: The Pubkey of the token account to query.
          schema:
            $ref: "./base-types.yaml#/components/schemas/Pubkey"
        - name: Configuration
          required: false
          description: Optional configuration object containing additional settings.
          schema:
            $ref: "./account.yaml#/components/schemas/GetTokenAccountBalanceConfig"
      examples:
        - name: getTokenAccountBalance example
          params:
            - name: Token account Pubkey
              value: "3emsAVdmGKERbHjmGfQ6oZ1e35dkf5iYcS6U4CPKFVaa"
        - name: Historical read at slot 400,000,000 (Account Archive)
          params:
            - name: Token account Pubkey
              value: "3emsAVdmGKERbHjmGfQ6oZ1e35dkf5iYcS6U4CPKFVaa"
            - name: Configuration
              value:
                slot: 400000000
      result:
        name: Token account balance
        description: The balance of the SPL Token account.
        schema:
          $ref: "./account.yaml#/components/schemas/TokenBalance"
      errors:
        - code: -32020
          message: >-
            Out of coverage. The requested `slot` is outside the
            [Account Archive](/docs/solana/account-archive)'s coverage
            window: below the earliest indexed slot or above the latest
            finalized slot.
        - code: -32602
          message: >-
            Invalid params. `lastUpdateBeforeSlot` and
            `firstUpdateAfterSlot` (available on `getAccountInfo`) are
            not supported on this method; only `slot`. Also returned for
            a malformed Pubkey (or a Pubkey that is not an SPL Token
            account) or configuration value.

    getTokenAccountsByOwner:
      name: getTokenAccountsByOwner
      description: Returns all SPL Token accounts owned by the specified token owner.
      x-compute-units: 10
      params:
        - name: Token owner Pubkey
          required: true
          description: The Pubkey of the account owner to query.
          schema:
            $ref: "./base-types.yaml#/components/schemas/Pubkey"
        - name: Token filter
          required: false
          description: A filter object containing either the Mint Pubkey or the Token program Pubkey.
          schema:
            type: object
            properties:
              mint:
                $ref: "./base-types.yaml#/components/schemas/Pubkey"
                description: The Pubkey of the specific token Mint to limit accounts to.
              programId:
                $ref: "./base-types.yaml#/components/schemas/Pubkey"
                description: The Pubkey of the Token program that owns the accounts.
        - name: Configuration
          required: false
          description: Optional configuration object containing additional settings.
          schema:
            $ref: "./account.yaml#/components/schemas/GetTokenAccountsByOwnerConfig"
      examples:
        - name: getTokenAccountsByOwner example
          params:
            - name: Token owner Pubkey
              value: "GwsPP9HHhCvEQeu3HTFzsVL6DEtnnYw4ALEtA3fMBC9Q"
      result:
        name: Token accounts
        description: An array of JSON objects representing the token accounts owned by the specified Pubkey.
        schema:
          type: array
          items:
            $ref: "./account.yaml#/components/schemas/TokenAccount"

    getTokenAccountsByOwnerAtSlot:
      name: getTokenAccountsByOwnerAtSlot
      summary: >-
        Returns every SPL Token and Token-2022 account owned by a wallet
        as of a specific slot.
      description: >-
        Returns every SPL Token and Token-2022 account owned by a wallet
        as of a specific slot. It is the historical, point-in-time version
        of Solana's `getTokenAccountsByOwner`: the same inputs, plus an
        optional `slot` to look up the past and `pageKey` / `pageLimit` to
        page through large wallets.


        If you omit `slot`, the call returns the wallet's current token
        accounts (as of the latest available slot). Responses are always
        `jsonParsed`.
      x-compute-units: 40
      params:
        - name: Token owner Pubkey
          required: true
          description: >-
            The base58-encoded Pubkey of the wallet whose token accounts
            you want.
          schema:
            $ref: "./base-types.yaml#/components/schemas/Pubkey"
        - name: Token filter
          required: false
          description: >-
            Restricts results to a single mint or a single token program.
            Include either `mint` or `programId`, never both. Omit to
            return all token accounts.
          schema:
            $ref: "./account.yaml#/components/schemas/GetTokenAccountsByOwnerAtSlotFilter"
        - name: Configuration
          required: false
          description: >-
            Optional point-in-time (`slot`) and pagination (`pageKey`,
            `pageLimit`) options.
          schema:
            $ref: "./account.yaml#/components/schemas/GetTokenAccountsByOwnerAtSlotConfig"
      examples:
        - name: getTokenAccountsByOwnerAtSlot example
          params:
            - name: Token owner Pubkey
              value: "GwsPP9HHhCvEQeu3HTFzsVL6DEtnnYw4ALEtA3fMBC9Q"
            - name: Token filter
              value:
                mint: "EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v"
            - name: Configuration
              value:
                slot: 250000000
                pageLimit: 1000
          result:
            name: Token accounts at slot
            value:
              context:
                apiVersion: "2.3.3"
                slot: 250000000
              value:
                - pubkey: "3emsAVdmGKERbHjmGfQ6oZ1e35dkf5iYcS6U4CPKFVaa"
                  account:
                    lamports: 2039280
                    owner: "TokenkegQfeZyiNwAJbNbGKPFXCWuBvf9Ss623VQ5DA"
                    executable: false
                    rentEpoch: 18446744073709551615
                    space: 165
                    data:
                      program: "spl-token"
                      space: 165
                      parsed:
                        type: "account"
                        info:
                          isNative: false
                          mint: "EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v"
                          owner: "GwsPP9HHhCvEQeu3HTFzsVL6DEtnnYw4ALEtA3fMBC9Q"
                          state: "initialized"
                          tokenAmount:
                            amount: "1500000"
                            decimals: 6
                            uiAmount: 1.5
                            uiAmountString: "1.5"
              pageKey: null
      result:
        name: Token accounts at slot
        description: >-
          A paginated set of the token accounts the wallet held at the
          requested slot, plus the slot the result was computed at and a
          `pageKey` cursor for the next page (or `null` on the last page).
        schema:
          $ref: "./account.yaml#/components/schemas/GetTokenAccountsByOwnerAtSlotResult"
      errors:
        - code: -32602
          message: >-
            Invalid params. Common causes include a missing or malformed
            `owner`, sending both `mint` and `programId` in the filter, a
            `programId` that is not the SPL Token or Token-2022 program,
            an invalid `pageKey` cursor, or the latest slot being
            temporarily unavailable when `slot` is omitted.
        - code: -32601
          message: Method not found.
        - code: -32603
          message: >-
            Internal error. Retry the request; if it persists, contact
            support.

    getBalanceByOwnerAtSlot:
      name: getBalanceByOwnerAtSlot
      summary: >-
        Returns a wallet's total balance of a single SPL Token or
        Token-2022 mint as of a specific slot.
      description: >-
        Returns a wallet's total balance of a single SPL Token or
        Token-2022 mint as of a specific slot, already summed across
        every token account the wallet held of that mint. It returns a
        single figure rather than the list of accounts returned by
        `getTokenAccountsByOwnerAtSlot`.


        A wallet can own more than one token account for the same mint.
        The optional `scope` parameter selects which of them the result
        covers: `all` (default) sums every token account the wallet held
        of that mint at that slot, `ata` returns the balance of the
        wallet's canonical Associated Token Account only (derived from
        `(wallet, token program, mint)`, with the token program selected
        from the mint so Token-2022 mints resolve correctly). When a
        wallet holds exactly one token account of the mint, both scopes
        return the same value.


        Available on Solana mainnet only. The request may also be sent
        as a positional array `[wallet, mint, slot, scope]`, and `owner`
        is accepted as an alias for `wallet`.
      paramStructure: by-name
      params:
        - name: wallet
          required: true
          description: >-
            Base-58 encoded pubkey of the wallet whose balance you want.
            `owner` is accepted as an alias.
          schema:
            $ref: "./base-types.yaml#/components/schemas/Pubkey"
        - name: mint
          required: true
          description: >-
            Base-58 encoded pubkey of the token mint. SPL Token and
            Token-2022 mints are both supported.
          schema:
            $ref: "./base-types.yaml#/components/schemas/Pubkey"
        - name: slot
          required: true
          description: >-
            The slot to reconstruct the balance at. There is no
            "latest slot" default; omitting `slot` is an error.
          schema:
            type: integer
            minimum: 0
        - name: scope
          required: false
          description: >-
            Which of the wallet's token accounts the balance covers.
            `all` (default) sums every token account the wallet held of
            that mint at that slot; `ata` returns the balance of the
            wallet's canonical Associated Token Account only.
            Case-sensitive.
          schema:
            type: string
            enum:
              - all
              - ata
            default: all
      examples:
        - name: getBalanceByOwnerAtSlot example
          params:
            - name: wallet
              value: "FHX9fPAUVA1MxPme28f4eeVH81QVRHDWofa2V6FUJaiR"
            - name: mint
              value: "poLisWXnNRwC6oBu1vHiuKQzFjGL4XDSu4g9qjz9qVk"
            - name: slot
              value: 225000000
          result:
            name: Balance at slot
            value:
              wallet: "FHX9fPAUVA1MxPme28f4eeVH81QVRHDWofa2V6FUJaiR"
              mint: "poLisWXnNRwC6oBu1vHiuKQzFjGL4XDSu4g9qjz9qVk"
              isNative: false
              balance: "38205.4"
              balanceRaw: "3820540000000"
              decimals: 8
              slot: 225000000
      result:
        name: Balance at slot
        description: >-
          The wallet's total token balance for that mint at the
          requested slot, with the slot the balance was computed at.
        schema:
          $ref: "./account.yaml#/components/schemas/GetBalanceByOwnerAtSlotResult"
      errors:
        - code: -32602
          message: >-
            Invalid params. Common causes include a missing or malformed
            `wallet` / `mint` (each must be a 32-byte base58 pubkey), a
            missing or non-integer `slot`, an unknown `scope` value
            (only `all` and `ata` are accepted, case-sensitive), or a
            mint that is not present in the index.
        - code: -32600
          message: >-
            Unsupported method. Returned when the method is called
            against a chain other than Solana mainnet.
        - code: -32603
          message: >-
            Internal error. Retry the request; if it persists, contact
            support.

    getLargestAccounts:
      name: getLargestAccounts
      description: Returns the 20 largest accounts, by lamport balance.
      x-compute-units: 3000
      params:
        - name: Configuration
          required: false
          description: Optional configuration object.
          schema:
            $ref: "./account.yaml#/components/schemas/LargestAccountsConfig"
      result:
        name: Largest accounts
        description: An array of objects containing the address of the account and its lamport balance.
        schema:
          $ref: "./account.yaml#/components/schemas/LargestAccountsList"

    # Airdrop methods
    requestAirdrop:
      name: requestAirdrop
      description: Requests an airdrop of lamports to a Pubkey.
      x-compute-units: 20
      params:
        - name: Pubkey
          required: true
          description: The Pubkey of the account to receive lamports.
          schema:
            $ref: "./base-types.yaml#/components/schemas/Pubkey"
        - name: Lamports
          required: true
          description: The number of lamports to airdrop, as a "u64".
          schema:
            type: integer
        - name: Configuration
          required: false
          description: Optional configuration object.
          schema:
            $ref: "./airdrop.yaml#/components/schemas/RequestAirdropConfig"
      examples:
        - name: requestAirdrop example
          params:
            - name: Pubkey
              value: "GwsPP9HHhCvEQeu3HTFzsVL6DEtnnYw4ALEtA3fMBC9Q"
            - name: Lamports
              value: 1000000000000000000
      result:
        name: Transaction signature
        description: Transaction Signature of the airdrop.
        schema:
          type: string

    # Block methods
    getBlock:
      name: getBlock
      description: Returns identity and transaction information about a confirmed block in the ledger.
      x-compute-units: 40
      params:
        - name: slot
          required: true
          description: Slot number as a u64 integer.
          schema:
            type: integer
        - name: Configuration
          required: false
          description: Optional configuration object containing additional settings.
          schema:
            $ref: "./block.yaml#/components/schemas/GetBlockConfig"
      examples:
        - name: getBlock example
          params:
            - name: slot
              value: 237158054
            - name: Configuration
              value:
                encoding: "json"
                transactionDetails: "none"
      result:
        name: Block information
        description: Returns block information or null if the block is not confirmed.
        schema:
          $ref: "./block.yaml#/components/schemas/BlockInfo"

    getBlocks:
      name: getBlocks
      description: Returns a list of confirmed blocks between two slots.
      x-compute-units: 10
      params:
        - name: start_slot
          required: true
          description: The starting slot.
          schema:
            type: integer
        - name: end_slot
          required: false
          description: The ending slot.
          schema:
            type: integer
        - name: Configuration
          required: false
          description: Optional configuration object.
          schema:
            $ref: "./block.yaml#/components/schemas/GetBlocksConfig"
      examples:
        - name: getBlocks (full example)
          params:
            - name: start_slot
              value: 237158000
            - name: end_slot
              value: 237158050
      result:
        name: List of confirmed blocks
        description: Returns an array of u64 integers listing confirmed blocks.
        schema:
          $ref: "./block.yaml#/components/schemas/SlotList"

    getBlocksWithLimit:
      name: getBlocksWithLimit
      description: Returns a list of confirmed blocks starting at the given slot.
      x-compute-units: 20
      params:
        - name: start_slot
          required: true
          description: The starting slot.
          schema:
            type: integer
        - name: limit
          required: true
          description: The limit for the number of blocks to return.
          schema:
            type: integer
        - name: Configuration
          required: false
          description: Optional configuration object.
          schema:
            $ref: "./block.yaml#/components/schemas/GetBlocksConfig"
      examples:
        - name: getBlocksWithLimit (with configuration)
          params:
            - name: start_slot
              value: 237158000
            - name: limit
              value: 5
      result:
        name: List of confirmed blocks
        description: Returns an array of u64 integers listing confirmed blocks starting at the start_slot.
        schema:
          $ref: "./block.yaml#/components/schemas/SlotList"

    getBlockCommitment:
      name: getBlockCommitment
      description: Returns the commitment for a particular block.
      x-compute-units: 20
      params:
        - name: block
          required: true
          description: Block number, identified by Slot.
          schema:
            type: integer
      examples:
        - name: getBlockCommitment example
          params:
            - name: block
              value: 237158054
      result:
        name: Block commitment
        description: Returns the commitment and total active stake for the block.
        schema:
          $ref: "./block.yaml#/components/schemas/GetBlockCommitmentResult"

    getBlockProduction:
      name: getBlockProduction
      description: Returns recent block production information from the current or previous epoch.
      x-compute-units: 10
      params:
        - name: Configuration
          required: false
          description: Optional configuration object containing additional settings.
          schema:
            $ref: "./block.yaml#/components/schemas/GetBlockProductionConfig"
      examples:
        - name: getBlockProduction example
          params: []
      result:
        name: Block production information
        description: Returns block production information for the specified range.
        schema:
          $ref: "./block.yaml#/components/schemas/BlockProductionInfo"

    getBlockTime:
      name: getBlockTime
      description: Returns the estimated production time of a block.
      x-compute-units: 20
      params:
        - name: block
          required: true
          description: Block number, identified by Slot.
          schema:
            $ref: "./block.yaml#/components/schemas/GetBlockTimeParams"
      examples:
        - name: getBlockTime example
          params:
            - name: block
              value: 237158054
      result:
        name: Estimated production time
        description: The estimated production time of the block as a Unix timestamp.
        schema:
          $ref: "./block.yaml#/components/schemas/EstimatedProductionTime"

    getFirstAvailableBlock:
      name: getFirstAvailableBlock
      description: Returns the slot of the lowest confirmed block that has not been purged from the ledger.
      x-compute-units: 40
      params: []
      result:
        name: Slot
        description: The slot number of the lowest confirmed block that is still available in the ledger.
        schema:
          $ref: "./block.yaml#/components/schemas/FirstAvailableBlockSlot"

    getGenesisHash:
      name: getGenesisHash
      description: Returns the genesis hash.
      x-compute-units: 10
      params: []
      result:
        name: Genesis hash
        description: The genesis hash as a base-58 encoded string.
        schema:
          $ref: "./block.yaml#/components/schemas/GenesisHash"

    getHighestSnapshotSlot:
      name: getHighestSnapshotSlot
      description: Returns the highest slot information that the node has snapshots for.
      x-compute-units: 20
      params: []
      result:
        name: Snapshot slot information
        description: Returns a JSON object with the highest full snapshot slot.
        schema:
          $ref: "./block.yaml#/components/schemas/HighestSnapshotSlot"

    getMaxRetransmitSlot:
      name: getMaxRetransmitSlot
      description: Get the max slot seen from the retransmit stage.
      x-compute-units: 20
      params: []
      result:
        name: Slot number
        description: The maximum slot number seen from the retransmit stage.
        schema:
          $ref: "./block.yaml#/components/schemas/MaxSlotResult"

    getMaxShredInsertSlot:
      name: getMaxShredInsertSlot
      description: Get the max slot seen from after shred insert.
      x-compute-units: 20
      params: []
      result:
        name: Slot number
        description: The maximum slot number seen after shred insert.
        schema:
          $ref: "./block.yaml#/components/schemas/MaxSlotResult"

    getBlockHeight:
      name: getBlockHeight
      description: Returns the current block height of the node.
      x-compute-units: 20
      params:
        - name: Configuration
          required: false
          description: Optional configuration object containing additional request parameters.
          schema:
            $ref: "./block.yaml#/components/schemas/GetBlockHeightConfig"
      result:
        name: Block height
        description: The current block height, as a u64 integer.
        schema:
          $ref: "./block.yaml#/components/schemas/BlockHeight"

    getLatestBlockhash:
      name: getLatestBlockhash
      description: Returns the latest blockhash.
      x-compute-units: 20
      params:
        - name: Configuration
          required: false
          description: A configuration object with optional fields for specifying commitment and minimum context slot.
          schema:
            $ref: "./block.yaml#/components/schemas/GetLatestBlockhashConfig"
      result:
        name: Latest Blockhash
        description: RpcResponse object with blockhash information.
        schema:
          $ref: "./block.yaml#/components/schemas/LatestBlockhash"

    isBlockhashValid:
      name: isBlockhashValid
      description: Returns whether a blockhash is still valid or not.
      x-compute-units: 20
      params:
        - name: blockhash
          required: true
          description: The blockhash of the block to evaluate.
          schema:
            type: string
        - name: Configuration
          required: false
          description: Optional configuration object.
          schema:
            $ref: "./block.yaml#/components/schemas/IsBlockhashValidParams"
      result:
        name: Validity
        description: Indicates if the blockhash is still valid.
        schema:
          $ref: "./block.yaml#/components/schemas/IsBlockhashValidResult"

    # Cluster Program methods
    getClusterNodes:
      name: getClusterNodes
      description: Returns information about all the nodes participating in the cluster.
      x-compute-units: 20
      params: []
      result:
        name: List of nodes
        description: Returns an array of JSON objects, each containing information about a node in the cluster.
        schema:
          $ref: "./cluster-program.yaml#/components/schemas/ClusterNodesList"

    getHealth:
      name: getHealth
      description: Returns the current health of the node.
      x-compute-units: 20
      params: []
      result:
        name: Health status
        description: If the node is healthy, the result is "ok".
        schema:
          $ref: "./cluster-program.yaml#/components/schemas/HealthStatus"

    getIdentity:
      name: getIdentity
      description: Returns the identity pubkey for the current node.
      x-compute-units: 20
      params: []
      result:
        name: Identity pubkey
        description: The identity pubkey of the current node.
        schema:
          $ref: "./cluster-program.yaml#/components/schemas/NodeIdentity"

    getSlotLeader:
      name: getSlotLeader
      description: Returns the current slot leader.
      x-compute-units: 20
      params:
        - name: Configuration
          required: false
          description: Optional configuration object containing additional settings.
          schema:
            $ref: "./state.yaml#/components/schemas/SlotConfig"
      result:
        name: Slot leader
        description: The node identity Pubkey as a base-58 encoded string.
        schema:
          $ref: "./state.yaml#/components/schemas/SlotLeader"

    getSlotLeaders:
      name: getSlotLeaders
      description: Returns the slot leaders for a given slot range.
      x-compute-units: 20
      params:
        - name: Start slot
          required: true
          description: The starting slot as a u64 integer.
          schema:
            type: integer
        - name: Limit
          required: true
          description: The number of slot leaders to return, between 1 and 5,000.
          schema:
            type: integer
      result:
        name: Slot leaders
        description: An array of node identity public keys as base-58 encoded strings.
        schema:
          $ref: "./state.yaml#/components/schemas/SlotLeaders"

    getVoteAccounts:
      name: getVoteAccounts
      description: Returns the account info and associated stake for all voting accounts in the current bank.
      x-compute-units: 20
      params:
        - name: Configuration
          required: false
          description: Optional configuration object.
          schema:
            $ref: "./cluster-program.yaml#/components/schemas/GetVoteAccountsConfig"
      result:
        name: Vote accounts
        description: Information about current and delinquent vote accounts.
        schema:
          $ref: "./cluster-program.yaml#/components/schemas/VoteAccounts"

    getProgramAccounts:
      name: getProgramAccounts
      description: Returns all accounts owned by the provided program Pubkey.
      x-compute-units: 20
      x-rate-limit-cus: 117
      params:
        - name: Pubkey
          required: true
          description: The Pubkey of the program.
          schema:
            $ref: "./base-types.yaml#/components/schemas/Pubkey"
        - name: Configuration
          required: false
          description: Optional configuration object.
          schema:
            $ref: "./cluster-program.yaml#/components/schemas/GetProgramAccountsConfig"
      result:
        name: Program accounts
        description: An array of JSON objects containing program account details.
        schema:
          type: array
          items:
            $ref: "./account.yaml#/components/schemas/ProgramAccount"

    getLeaderSchedule:
      name: getLeaderSchedule
      description: Returns the leader schedule for a given epoch.
      x-compute-units: 20
      params:
        - name: Slot
          required: false
          description: The slot to fetch the leader schedule for. If unspecified, returns the leader schedule for the current epoch.
          schema:
            type: integer
            format: uint64
        - name: Configuration
          required: false
          description: Optional configuration object containing additional settings.
          schema:
            type: object
            properties:
              commitment:
                type: string
                description: The commitment level to use for the request.
              identity:
                type: string
                description: Only return results for this validator identity (base-58 encoded).
      examples:
        - name: getLeaderSchedule example
          params:
            - name: Slot
              value: null
            - name: Configuration
              value:
                commitment: "processed"
                identity: "dv2eQHeP4RFrJZ6UeiZWoc3XTtmtZCUKxxCApCDcRNV"

    # Fee methods
    getFeeForMessage:
      name: getFeeForMessage
      description: Get the fee the network will charge for a particular Message.
      x-compute-units: 20
      params:
        - name: Message
          required: true
          description: Base-64 encoded Message.
          schema:
            $ref: "./fee.yaml#/components/schemas/FeeForMessageParams"
        - name: Configuration
          required: false
          description: Optional configuration object.
          schema:
            $ref: "./fee.yaml#/components/schemas/FeeForMessageConfig"
      result:
        name: Fee for the message
        description: The fee corresponding to the message at the specified blockhash.
        schema:
          $ref: "./fee.yaml#/components/schemas/FeeForMessageResult"

    getMinimumBalanceForRentExemption:
      name: getMinimumBalanceForRentExemption
      description: Returns the minimum balance required to make an account rent exempt.
      x-compute-units: 10
      params:
        - name: Account data length
          required: true
          description: The account's data length in bytes.
          schema:
            $ref: "./fee.yaml#/components/schemas/MinimumBalanceForRentExemptionParams"
        - name: Configuration
          required: false
          description: Optional configuration object.
          schema:
            $ref: "./fee.yaml#/components/schemas/MinimumBalanceForRentExemptionConfig"
      result:
        name: Minimum balance for rent exemption
        description: The minimum number of lamports required in the account to remain rent-free.
        schema:
          $ref: "./fee.yaml#/components/schemas/MinimumBalanceForRentExemptionResult"

    getRecentPrioritizationFees:
      name: getRecentPrioritizationFees
      description: Returns a list of prioritization fees from recent blocks.
      x-compute-units: 10
      params:
        - name: Account addresses
          required: false
          description: An array of up to 128 account addresses. If provided, the response will reflect a fee to land a transaction locking all of the provided accounts as writable.
          schema:
            type: array
            items:
              $ref: "./base-types.yaml#/components/schemas/Pubkey"
      result:
        name: Prioritization fees
        description: An array of prioritization fees observed in recent blocks.
        schema:
          $ref: "./fee.yaml#/components/schemas/GetRecentPrioritizationFeesResult"

    getPriorityFeeEstimate:
      name: getPriorityFeeEstimate
      description: Calculate optimal priority fee recommendations for Solana transactions based on real-time network conditions.
      x-compute-units: 10
      x-rate-limit-cus: 20
      params:
        - name: Configuration
          required: true
          description: Single params object. Top-level keys are transaction, accountKeys, and options (nested). Put priorityLevel, recommended, etc. inside options.
          schema:
            $ref: "./fee.yaml#/components/schemas/GetPriorityFeeEstimateParams"
      examples:
        - name: getPriorityFeeEstimate with transaction
          params:
            - name: Configuration
              value:
                transaction: "AQAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAABAAEDArczbMia1tLmq7zz4DinMNN0pJ1JtLdqIJPUw3YrGCzYAMHBsgN27lcgB6H2WQvFgyZuJYHa46puOQo9yQ8CVQbd9uHXZaGT2cvhRs7reawctIXtX1s3kTqM9YV+/wCp20C7Wj2aiuk5TReAXo+VTVg8QTHjs0UjNMMKCvpzZ+ABAgEBARU="
                options:
                  priorityLevel: "High"
      result:
        name: Priority fee estimate
        description: Optimal priority fee estimate and optional fee levels for different priority tiers.
        schema:
          $ref: "./fee.yaml#/components/schemas/GetPriorityFeeEstimateResult"

    # Inflation methods
    getInflationGovernor:
      name: getInflationGovernor
      description: Returns the current inflation governor.
      x-compute-units: 20
      params:
        - name: Configuration
          required: false
          description: Optional configuration object.
          schema:
            $ref: "./state.yaml#/components/schemas/GetEpochInfoConfig"
      result:
        name: Inflation governor details
        description: Returns a JSON object containing the inflation governor parameters.
        schema:
          $ref: "./inflation.yaml#/components/schemas/InflationGovernor"

    getInflationRate:
      name: getInflationRate
      description: Returns the specific inflation values for the current epoch.
      x-compute-units: 20
      params: []
      result:
        name: Inflation rate details
        description: Returns a JSON object containing the inflation values for the current epoch.
        schema:
          $ref: "./inflation.yaml#/components/schemas/InflationRate"

    getInflationReward:
      name: getInflationReward
      description: Returns the inflation or staking reward for a list of addresses for a specified epoch.
      x-compute-units: 40
      x-rate-limit-cus: 300
      params:
        - name: Addresses
          required: true
          description: An array of addresses to query.
          schema:
            $ref: "./inflation.yaml#/components/schemas/InflationRewardParams"
      result:
        name: Inflation reward details
        description: Returns a JSON array with reward details for each address.
        schema:
          type: array
          items:
            $ref: "./inflation.yaml#/components/schemas/InflationReward"

    # Performance methods
    getRecentPerformanceSamples:
      name: getRecentPerformanceSamples
      description: Returns a list of recent performance samples, in reverse slot order.
      x-compute-units: 20
      params:
        - name: limit
          required: false
          description: The number of samples to return.
          schema:
            type: integer
      result:
        name: Performance samples
        description: An array of performance sample data.
        schema:
          type: array
          items:
            $ref: "./performance.yaml#/components/schemas/PerformanceSample"

    # State methods
    getEpochInfo:
      name: getEpochInfo
      description: Returns information about the current epoch.
      x-compute-units: 20
      params:
        - name: Configuration
          required: false
          description: Optional configuration object.
          schema:
            $ref: "./state.yaml#/components/schemas/GetEpochInfoConfig"
      result:
        name: Epoch information
        description: Returns an object containing information about the current epoch.
        schema:
          $ref: "./state.yaml#/components/schemas/EpochInfo"

    getEpochSchedule:
      name: getEpochSchedule
      description: Returns the epoch schedule information from the cluster's genesis config.
      x-compute-units: 20
      params: []
      result:
        name: Epoch schedule information
        description: Returns an object containing information about the epoch schedule.
        schema:
          $ref: "./state.yaml#/components/schemas/EpochSchedule"

    getSlot:
      name: getSlot
      description: Returns the slot that has reached the given or default commitment level.
      x-compute-units: 20
      params:
        - name: Configuration
          required: false
          description: Optional configuration object containing additional settings.
          schema:
            $ref: "./state.yaml#/components/schemas/SlotConfig"
      result:
        name: Current slot
        description: The current slot at the specified commitment level.
        schema:
          type: integer

    minimumLedgerSlot:
      name: minimumLedgerSlot
      description: Returns the lowest slot that the node has information about in its ledger.
      x-compute-units: 20
      params: []
      result:
        name: Minimum ledger slot
        description: The lowest slot number the node has information about.
        schema:
          $ref: "./state.yaml#/components/schemas/MinimumLedgerSlot"

    getVersion:
      name: getVersion
      description: Returns the current Solana version running on the node.
      x-compute-units: 20
      params: []
      result:
        name: Version details
        description: The current Solana version running on the node.
        schema:
          $ref: "./state.yaml#/components/schemas/VersionInfo"

    # Supply methods
    getSupply:
      name: getSupply
      description: Returns information about the current supply of lamports.
      x-compute-units: 160
      x-rate-limit-cus: 800
      params:
        - name: Configuration
          required: false
          description: Optional configuration object containing additional settings.
          schema:
            $ref: "./supply.yaml#/components/schemas/GetSupplyConfig"
      result:
        name: Supply information
        description: An RpcResponse JSON object containing the current supply information.
        schema:
          $ref: "./supply.yaml#/components/schemas/SupplyInfo"

    getTokenSupply:
      name: getTokenSupply
      description: Returns the total supply of an SPL Token type.
      x-compute-units: 20
      params:
        - name: Token Mint Pubkey
          required: true
          description: The Pubkey of the token Mint to query.
          schema:
            $ref: "./base-types.yaml#/components/schemas/Pubkey"
        - name: Configuration
          required: false
          description: Optional configuration object containing additional settings.
          schema:
            $ref: "./supply.yaml#/components/schemas/GetTokenSupplyConfig"
      result:
        name: Token supply
        description: The total supply of the specified SPL Token.
        schema:
          $ref: "./account.yaml#/components/schemas/TokenBalance"

    # Transaction methods
    sendTransaction:
      name: sendTransaction
      description: Submits a signed transaction to the cluster for processing.
      x-compute-units: 20
      params:
        - name: Transaction
          required: true
          description: Fully-signed Transaction, as encoded string.
          schema:
            type: string
        - name: Configuration
          required: false
          description: Optional configuration object.
          schema:
            $ref: "./transaction.yaml#/components/schemas/SendTransactionConfig"
      result:
        name: Transaction signature
        description: The first signature in the transaction, used as the transaction ID.
        schema:
          $ref: "./transaction.yaml#/components/schemas/SendTransactionResult"

    simulateTransaction:
      name: simulateTransaction
      description: Simulates sending a transaction.
      x-compute-units: 20
      params:
        - name: Transaction
          required: true
          description: The transaction to simulate, as an encoded string.
          schema:
            type: string
        - name: Configuration
          required: false
          description: Optional configuration object containing additional options.
          schema:
            $ref: "./transaction.yaml#/components/schemas/SimulateTransactionConfig"
      examples:
        - name: simulateTransaction example
          params:
            - name: Transaction
              value: "AQAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAABAAEDZDnD3LUKXWQB8kE0TBLbgGOZmAFW2KdPBOEJie5JAGbhbwJIKOS2F6RAMYzzNMwSCCpNg9MnCHEbVcVPNRByxQbd9uHXZaGT2cvhRs7reawctIXtX1s3kTqM9YV+/wCpjJclj04lr3XiJv5dZ3MN1MlkHd0BkPZ/IFOrnFYCxQECAgABDAIAAAAgTgAAAAAAAA=="
            - name: Configuration
              value:
                encoding: "base64"
          result:
            name: Simulated transaction result
            value:
              err: null
              logs:
                - "Program TokenzQdBNbLqP5VEhdkAS6EPFLC1PHnBqCXEpPxuEb invoke [1]"
                - "Program log: Instruction: Transfer"
                - "Program TokenzQdBNbLqP5VEhdkAS6EPFLC1PHnBqCXEpPxuEb consumed 1714 of 200000 compute units"
                - "Program TokenzQdBNbLqP5VEhdkAS6EPFLC1PHnBqCXEpPxuEb success"
              accounts: null
              unitsConsumed: 1714
              returnData: null
              innerInstructions: null
      result:
        name: Simulated transaction result
        description: The result of simulating the transaction.
        schema:
          $ref: "./transaction.yaml#/components/schemas/SimulatedTransactionResult"

    simulateBundle:
      name: simulateBundle
      description: Simulates sending a Jito bundle of transactions.
      x-compute-units: 20
      params:
        - name: Bundle
          required: true
          description: Encoded, serialized transactions to simulate in a bundle.
          schema:
            $ref: "./transaction.yaml#/components/schemas/SimulateBundleParams"
        - name: Configuration
          required: false
          description: Optional configuration object containing additional options.
          schema:
            $ref: "./transaction.yaml#/components/schemas/SimulateBundleConfig"
      result:
        name: Simulated bundle result
        description: The result of simulating the bundle.
        schema:
          $ref: "./transaction.yaml#/components/schemas/SimulatedBundleResult"

    getSignaturesForAddress:
      name: getSignaturesForAddress
      description: Returns signatures for confirmed transactions that include the given address.
      x-compute-units: 40
      params:
        - name: Account address
          required: true
          description: The account address.
          schema:
            $ref: "./base-types.yaml#/components/schemas/Pubkey"
        - name: Configuration
          required: false
          description: Optional configuration object.
          schema:
            $ref: "./transaction.yaml#/components/schemas/GetSignaturesForAddressConfig"
      result:
        name: Transaction signatures
        description: An array of objects containing transaction signature information.
        schema:
          type: array
          items:
            $ref: "./transaction.yaml#/components/schemas/SignatureInfo"

    getSignatureStatuses:
      name: getSignatureStatuses
      description: Returns the statuses of a list of transaction signatures.
      x-compute-units: 20
      params:
        - name: Signatures
          required: true
          description: An array of transaction signatures to confirm.
          schema:
            type: array
            items:
              type: string
        - name: Configuration
          required: false
          description: Optional configuration object.
          schema:
            $ref: "./transaction.yaml#/components/schemas/GetSignatureStatusesConfig"
      result:
        name: Transaction statuses
        description: An array containing the status of each transaction signature.
        schema:
          type: array
          items:
            $ref: "./transaction.yaml#/components/schemas/TransactionStatus"

    getTransaction:
      name: getTransaction
      description: Returns transaction details for a confirmed transaction.
      x-compute-units: 40
      params:
        - name: Transaction signature
          required: true
          description: Transaction signature as a base-58 encoded string.
          schema:
            type: string
        - name: Configuration
          required: false
          description: Optional configuration object containing additional settings.
          schema:
            $ref: "./transaction.yaml#/components/schemas/GetTransactionConfig"
      result:
        name: Transaction details
        description: The details of a confirmed transaction.
        schema:
          $ref: "./transaction.yaml#/components/schemas/TransactionDetails"
    getTokenAccountsByDelegate:
      name: getTokenAccountsByDelegate
      description: Returns all SPL Token accounts delegated to the provided account.
      x-compute-units: 10
      params:
        - name: Delegate Pubkey
          required: true
          description: The Pubkey of the account delegate to query.
          schema:
            $ref: ./base-types.yaml#/components/schemas/Pubkey
        - name: Token filter
          required: false
          description: >-
            A filter object containing either the Mint Pubkey or the Token program
            Pubkey.
          schema:
            type: object
            properties:
              mint:
                $ref: ./base-types.yaml#/components/schemas/Pubkey
                description: The Pubkey of the specific token Mint to limit accounts to.
              programId:
                $ref: ./base-types.yaml#/components/schemas/Pubkey
                description: The Pubkey of the Token program that owns the accounts.
        - name: Configuration
          required: false
          description: Optional configuration object containing additional settings.
          schema:
            $ref: >-
              ./account.yaml#/components/schemas/GetTokenAccountsByDelegateConfig
      examples:
        - name: getTokenAccountsByDelegate example
          params:
            - name: Delegate Pubkey
              value: 4Nd1mBQtrMJVYVfKf2PJy9NZUZdTAsp7D4xWLs4gDB4T
            - name: Token filter
              value:
                programId: TokenkegQfeZyiNwAJbNbGKPFXCWuBvf9Ss623VQ5DA
      result:
        name: Token accounts
        description: >-
          An array of JSON objects representing the token accounts delegated to
          the specified Pubkey.
        schema:
          type: array
          items:
            $ref: ./account.yaml#/components/schemas/TokenAccount
    getTokenLargestAccounts:
      name: getTokenLargestAccounts
      description: Returns the 20 largest accounts of a particular SPL Token type.
      x-compute-units: 20
      params:
        - name: Token Mint Pubkey
          required: true
          description: The Pubkey of the token Mint to query.
          schema:
            $ref: ./base-types.yaml#/components/schemas/Pubkey
        - name: Configuration
          required: false
          description: Optional configuration object.
          schema:
            $ref: >-
              ./account.yaml#/components/schemas/GetTokenLargestAccountsConfig
      examples:
        - name: getTokenLargestAccounts example
          params:
            - name: Token Mint Pubkey
              value: EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v
      result:
        name: Largest token accounts
        description: An array of the 20 largest accounts of the specified token type.
        schema:
          $ref: ./account.yaml#/components/schemas/TokenLargestAccountsList
    getStakeActivation:
      name: getStakeActivation
      description: Returns epoch activation information for a stake account.
      x-compute-units: 20
      params:
        - name: Stake account Pubkey
          required: true
          description: Pubkey of the stake account to query.
          schema:
            $ref: ./base-types.yaml#/components/schemas/Pubkey
        - name: Configuration
          required: false
          description: Optional configuration object.
          schema:
            $ref: ./account.yaml#/components/schemas/StakeActivationConfig
      examples:
        - name: getStakeActivation example
          params:
            - name: Stake account Pubkey
              value: CYRJWqiSjLitBAcRxPvWpgX3s5TvmN2SuRY3eEYypFvT
      result:
        name: Stake activation info
        description: Returns epoch activation information for the stake account.
        schema:
          $ref: ./account.yaml#/components/schemas/StakeActivation

    getStakeMinimumDelegation:
      name: getStakeMinimumDelegation
      description: Returns the cluster's current stake minimum delegation, in lamports.
      x-compute-units: 20
      params:
        - name: Configuration
          required: false
          description: Optional configuration object.
          schema:
            $ref: ./state.yaml#/components/schemas/GetStakeMinimumDelegationConfig
      examples:
        - name: getStakeMinimumDelegation example
          params: []
          result:
            name: Stake minimum delegation
            value:
              context:
                apiVersion: "2.3.3"
                slot: 250000000
              value: 1000000000
      result:
        name: Stake minimum delegation
        description: >-
          An RpcResponse object whose `value` is the current cluster minimum
          stake delegation, in lamports.
        schema:
          $ref: ./state.yaml#/components/schemas/StakeMinimumDelegationResult
    getTransactionCount:
      name: getTransactionCount
      description: Returns the current transaction count from the ledger.
      x-compute-units: 20
      params:
        - name: Configuration
          required: false
          description: Optional configuration object.
          schema:
            $ref: >-
              ./state.yaml#/components/schemas/GetTransactionCountConfig
      examples:
        - name: getTransactionCount example
          params: []
      result:
        name: Transaction count
        description: The current transaction count from the ledger.
        schema:
          $ref: ./state.yaml#/components/schemas/TransactionCount
    getTransactionsForAddress:
      name: getTransactionsForAddress
      description: >-
        Returns transaction history for a given address with advanced
        filtering, bidirectional sorting, and pagination. Combines the
        functionality of `getSignaturesForAddress` and `getTransaction` into a
        single call, returning up to 1,000 signatures or up to 100 full
        transactions per request.
      x-compute-units: 100
      params:
        - name: Account address
          required: true
          description: Base-58 encoded public key of the account to query transaction history for.
          schema:
            $ref: ./base-types.yaml#/components/schemas/Pubkey
        - name: Configuration
          required: false
          description: >-
            Optional configuration object containing transaction detail level,
            sort order, limit, pagination token, commitment, encoding, and
            filters (slot, blockTime, signature, status, tokenAccounts).
          schema:
            $ref: ./transaction.yaml#/components/schemas/GetTransactionsForAddressConfig
      examples:
        - name: getTransactionsForAddress example
          params:
            - name: Account address
              value: "86xCnPeV69n6t3DnyGvkKobf9FdN2H9oiVDdaMpo2MMY"
            - name: Configuration
              value:
                transactionDetails: "signatures"
                sortOrder: "desc"
                limit: 100
                filters:
                  status: "succeeded"
                  tokenAccounts: "balanceChanged"
      result:
        name: Transaction history
        description: >-
          A paginated list of transactions for the address. Each entry
          includes the slot, transaction index, and either a signature plus
          metadata (when `transactionDetails` is `signatures`) or the full
          transaction and meta objects (when `transactionDetails` is `full`).
          A `paginationToken` is returned when more results are available.
        schema:
          $ref: ./transaction.yaml#/components/schemas/GetTransactionsForAddressResult

    # ZK Compression methods (Photon indexer)
    getCompressedAccount:
      name: getCompressedAccount
      description: |
        Returns the compressed account matching the given `address` or `hash`. Photon's JSON-RPC for this method accepts the params as a positional pair `[address, hash]` — pass `null` for whichever identifier you are not using.

        - `address` queries compressed accounts created with a Light Protocol address.
        - `hash` queries by the merkle-tree leaf hash and works for every compressed account.
      paramStructure: by-name
      x-compute-units: 120
      x-rate-limit-cus: 100
      params:
        - name: address
          required: false
          description: Pubkey of the compressed account to query. Pass `null` to query by `hash` instead.
          schema:
            oneOf:
              - $ref: ./base-types.yaml#/components/schemas/Pubkey
              - type: "null"
        - name: hash
          required: false
          description: Hash of the compressed account to query. Pass `null` to query by `address` instead.
          schema:
            oneOf:
              - $ref: ./compression.yaml#/components/schemas/Hash
              - type: "null"
      examples:
        - name: getCompressedAccount example
          params:
            - name: address
              value: null
            - name: hash
              value: "3KC9cKQhhzEPjwuyQaohM6SGaZu1ukKRZw2QRgc1sYVL"
          result:
            name: Compressed account
            value:
              context:
                slot: 419139544
              value:
                hash: 3KC9cKQhhzEPjwuyQaohM6SGaZu1ukKRZw2QRgc1sYVL
                address:
                data:
                  discriminator: 2
                  data: RhAVR6AmcnFercuAcoi9gbc/hIy3UBfL/FeQkTk7SE8I8WaM+ETZsH8YD96DZJdZG7IPY2fuP8pCP/oQV1de4R5hETEZAAAAAAAA
                  dataHash: mkARkU6arYpeTacykBCEytKihySvzGJXbkG5PbwhieQ
                owner: cTokenmWW8bLPjZEBAUgYy3zKxQZW6VKi7bqNFEVv3m
                lamports: 0
                tree: smt6ukQDSPPYHSshQovmiRUjG9jGFq2hW9vgrDFk5Yz
                leafIndex: 832574
                seq: 877634
                slotCreated: 357735227
      result:
        name: Compressed account
        description: The compressed account data with context information. `value` is `null` when no compressed account matches the supplied `address` or `hash`.
        schema:
          $ref: ./compression.yaml#/components/schemas/AccountResult

    getCompressedAccountProof:
      name: getCompressedAccountProof
      description: Returns a merkle proof for the compressed account with the given hash.
      x-compute-units: 120
      x-rate-limit-cus: 100
      params:
        - name: hash
          required: true
          description: Hash of the compressed account.
          schema:
            $ref: ./compression.yaml#/components/schemas/Hash
      examples:
        - name: getCompressedAccountProof example
