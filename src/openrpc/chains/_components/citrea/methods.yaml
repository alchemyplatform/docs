components:
  methods:
    citrea_syncStatus:
      name: citrea_syncStatus
      description: |
        Returns the current synchronization status of the local Citrea node for both L1 (Bitcoin) and L2 (Citrea).
        The response reports either `{ Synced: <blockHeight> }` or `{ Syncing: { headBlockNumber, syncedBlockNumber } }`
        for each layer.
      params: []
      result:
        name: Synchronization status
        description: L1 and L2 synchronization status of the node.
        schema:
          type: object
          additionalProperties: false
          required: ["l1Status", "l2Status"]
          properties:
            l1Status:
              description: L1 (Bitcoin) synchronization status.
              oneOf:
                - type: object
                  additionalProperties: false
                  required: ["Synced"]
                  properties:
                    Synced:
                      type: integer
                      description: Block height when fully synced.
                - type: object
                  additionalProperties: false
                  required: ["Syncing"]
                  properties:
                    Syncing:
                      type: object
                      additionalProperties: false
                      required: ["headBlockNumber", "syncedBlockNumber"]
                      properties:
                        headBlockNumber:
                          type: integer
                          description: Latest known block number.
                        syncedBlockNumber:
                          type: integer
                          description: Current synced block number.
            l2Status:
              description: L2 (Citrea) synchronization status.
              oneOf:
                - type: object
                  additionalProperties: false
                  required: ["Synced"]
                  properties:
                    Synced:
                      type: integer
                      description: Block height when fully synced.
                - type: object
                  additionalProperties: false
                  required: ["Syncing"]
                  properties:
                    Syncing:
                      type: object
                      additionalProperties: false
                      required: ["headBlockNumber", "syncedBlockNumber"]
                      properties:
                        headBlockNumber:
                          type: integer
                          description: Latest known block number.
                        syncedBlockNumber:
                          type: integer
                          description: Current synced block number.
      examples:
        - name: citrea_syncStatus — fully synced
          params: []
          result:
            name: Synchronization status
            value:
              l1Status: { Synced: 19224 }
              l2Status: { Synced: 2326433 }
        - name: citrea_syncStatus — still syncing
          params: []
          result:
            name: Synchronization status
            value:
              l1Status: { Synced: 19224 }
              l2Status:
                Syncing:
                  headBlockNumber: 264052
                  syncedBlockNumber: 27050

    ledger_getL2BlockByNumber:
      name: ledger_getL2BlockByNumber
      description: Returns a complete L2 block by its block number.
      params:
        - name: number
          required: true
          description: L2 block height to fetch.
          schema:
            title: L2BlockNumber
            type: integer
      result:
        name: L2 block
        description: Full L2 block object (header and transactions).
        schema:
          type: object
          additionalProperties: false
          required: ["header", "txs"]
          properties:
            header:
              type: object
              additionalProperties: false
              required:
                - height
                - hash
                - prev_hash
                - state_root
                - signature
                - l1_fee_rate
                - timestamp
                - tx_merkle_root
              properties:
                height:
                  type: string
                  description: Block height in hex format.
                hash:
                  type: string
                  description: 32-byte block hash (hex, without 0x).
                prev_hash:
                  type: string
                  description: Previous block hash (hex, without 0x).
                state_root:
                  type: string
                  description: State root after this block (hex, without 0x).
                signature:
                  type: string
                  description: Sequencer signature (hex, without 0x).
                l1_fee_rate:
                  type: string
                  description: L1 fee rate in hex (0x-prefixed).
                timestamp:
                  type: string
                  description: Block timestamp in hex (0x-prefixed).
                tx_merkle_root:
                  type: string
                  description: Merkle root of transactions (hex, without 0x).
            txs:
              type: array
              description: Array of transaction data (hex-encoded).
              items:
                type: string
      examples:
        - name: ledger_getL2BlockByNumber example
          params:
            - name: number
              value: 1000333
          result:
            name: L2 block
            value:
              header:
                height: "0xf438d"
                hash: "999528b4d08dc8d0b05cbace0f5e661f36d824cedde1ffa75dc0c197b355c111"
                prev_hash: "3dd4a535bc994f8f8d7d1f814be99f73dc522aa314905ca9985e479b350f17e7"
                state_root: "c55d26ed7c1733d6be6283f68ab87db37271bf476008eba5231f5d321e0efe2c"
                signature: "69f712ea23731ce8432867526084e260d1aeef9290f4c26889361e3bb5e168724bfe328986a56752778a2a93c360b9c291614ce4e15d4b1c2fac7bf31c7068e9"
                l1_fee_rate: "0x9502f900"
                timestamp: "0x67089f9c"
                tx_merkle_root: "13148bcd464a1ef2824f13372513eda01d2f83d498790bf558060dc0bf4cbcbb"
              txs:
                - ""

    ledger_getL2BlockByHash:
      name: ledger_getL2BlockByHash
      description: Returns a complete L2 block by its block hash.
      params:
        - name: hash
          required: true
          description: 32-byte L2 block hash (hex, without 0x).
          schema:
            title: L2BlockHash
            type: string
            pattern: "^[0-9a-fA-F]{64}$"
      result:
        name: L2 block
        description: Full L2 block object (header and transactions).
        schema:
          type: object
          additionalProperties: false
          required: ["header", "txs"]
          properties:
            header:
              type: object
              additionalProperties: false
              required:
                - height
                - hash
                - prev_hash
                - state_root
                - signature
                - l1_fee_rate
                - timestamp
                - tx_merkle_root
              properties:
                height:
                  type: string
                  description: Block height in hex format.
                hash:
                  type: string
                  description: 32-byte block hash (hex, without 0x).
                prev_hash:
                  type: string
                  description: Previous block hash (hex, without 0x).
                state_root:
                  type: string
                  description: State root after this block (hex, without 0x).
                signature:
                  type: string
                  description: Sequencer signature (hex, without 0x).
                l1_fee_rate:
                  type: string
                  description: L1 fee rate in hex (0x-prefixed).
                timestamp:
                  type: string
                  description: Block timestamp in hex (0x-prefixed).
                tx_merkle_root:
                  type: string
                  description: Merkle root of transactions (hex, without 0x).
            txs:
              type: array
              description: Array of transaction data (hex-encoded).
              items:
                type: string
      examples:
        - name: ledger_getL2BlockByHash example
          params:
            - name: hash
              value: "999528b4d08dc8d0b05cbace0f5e661f36d824cedde1ffa75dc0c197b355c111"
          result:
            name: L2 block
            value:
              header:
                height: "0xf438d"
                hash: "999528b4d08dc8d0b05cbace0f5e661f36d824cedde1ffa75dc0c197b355c111"
                prev_hash: "3dd4a535bc994f8f8d7d1f814be99f73dc522aa314905ca9985e479b350f17e7"
                state_root: "c55d26ed7c1733d6be6283f68ab87db37271bf476008eba5231f5d321e0efe2c"
                signature: "69f712ea23731ce8432867526084e260d1aeef9290f4c26889361e3bb5e168724bfe328986a56752778a2a93c360b9c291614ce4e15d4b1c2fac7bf31c7068e9"
                l1_fee_rate: "0x9502f900"
                timestamp: "0x67089f9c"
                tx_merkle_root: "13148bcd464a1ef2824f13372513eda01d2f83d498790bf558060dc0bf4cbcbb"
              txs:
                - ""

    ledger_getL2BlockRange:
      name: ledger_getL2BlockRange
