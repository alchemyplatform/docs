      result:
        name: Latest L2 block height
        description: Latest L2 block height in hex format.
        schema:
          $ref: "../evm/base-types.yaml#/components/schemas/uint"
      examples:
        - name: ledger_getHeadL2BlockHeight example
          params: []
          result:
            name: Latest L2 block height
            value: "0xbed0d6"

    ledger_getL2GenesisStateRoot:
      name: ledger_getL2GenesisStateRoot
      description: Returns the 32-byte genesis state root for L2.
      params: []
      result:
        name: L2 genesis state root
        description: 32-byte genesis state root (hex).
        schema:
          $ref: "../evm/base-types.yaml#/components/schemas/hash32"
      examples:
        - name: ledger_getL2GenesisStateRoot example
          params: []
          result:
            name: L2 genesis state root
            value: "0x785c6d461111b5e9fdc515e0955d55baddfd8eb2dd2769342cc58060d6f5e0c5"

    ledger_getSequencerCommitmentsOnSlotByNumber:
      name: ledger_getSequencerCommitmentsOnSlotByNumber
      description: Returns sequencer commitment(s) found in the specified DA slot height.
      params:
        - name: height
          required: true
          description: L1 DA slot height.
          schema:
            title: DASlotHeight
            type: integer
      result:
        name: Sequencer commitments
        description: Array of commitments found at the DA slot height (or null if none).
        schema:
          oneOf:
            - type: "null"
            - type: array
              items:
                type: object
                additionalProperties: false
                required: ["merkleRoot", "index", "l2EndBlockNumber"]
                properties:
                  merkleRoot:
                    description: Merkle root of sequencer commitment.
                    $ref: "../evm/base-types.yaml#/components/schemas/hash32"
                  index:
                    description: Global commitment index (hex quantity).
                    $ref: "../evm/base-types.yaml#/components/schemas/uint"
                  l2EndBlockNumber:
                    description: Last L2 block included in this commitment (hex quantity).
                    $ref: "../evm/base-types.yaml#/components/schemas/uint"
      examples:
        - name: ledger_getSequencerCommitmentsOnSlotByNumber — commitments exist
          params:
            - name: height
              value: 88001
          result:
            name: Sequencer commitments
            value:
              - merkleRoot: "0xd6dc3eb1a59be7bc1ece68318f82a60919f0f98d8c648337d588ce243a17f473"
                index: "0xba5"
                l2EndBlockNumber: "0xb7a20b"
              - merkleRoot: "0xf85a8f3f872fe8079fe778a2f6a8ebd92cf3d1a7c6324af025c8bffbb46d1811"
                index: "0xba6"
                l2EndBlockNumber: "0xb7a5f3"
        - name: ledger_getSequencerCommitmentsOnSlotByNumber — no commitments
          params:
            - name: height
              value: 88001
          result:
            name: Sequencer commitments
            value: null

    ledger_getSequencerCommitmentsOnSlotByHash:
      name: ledger_getSequencerCommitmentsOnSlotByHash
      description: Returns sequencer commitment(s) found in the DA slot identified by its L1 block hash.
      params:
        - name: hash
          required: true
          description: 32-byte DA slot hash (hex, without 0x).
          schema:
            title: DASlotHash
            type: string
            pattern: "^[0-9a-fA-F]{64}$"
      result:
        name: Sequencer commitments
        description: Array of commitments found at the DA slot hash.
        schema:
          type: array
          items:
            type: object
            additionalProperties: false
            required: ["merkleRoot", "index", "l2EndBlockNumber"]
            properties:
              merkleRoot:
                description: Merkle root of sequencer commitment.
                $ref: "../evm/base-types.yaml#/components/schemas/hash32"
              index:
                description: Global commitment index (hex quantity).
                $ref: "../evm/base-types.yaml#/components/schemas/uint"
              l2EndBlockNumber:
                description: Last L2 block included in this commitment (hex quantity).
                $ref: "../evm/base-types.yaml#/components/schemas/uint"
      examples:
        - name: ledger_getSequencerCommitmentsOnSlotByHash example
          params:
            - name: hash
              value: "788636f732f490c5072582c7dcde85e34d737c8a4d98e792a59c9d0100000000"
          result:
            name: Sequencer commitments
            value:
              - merkleRoot: "0xd6dc3eb1a59be7bc1ece68318f82a60919f0f98d8c648337d588ce243a17f473"
                index: "0xba5"
                l2EndBlockNumber: "0xb7a20b"

    ledger_getSequencerCommitmentByIndex:
      name: ledger_getSequencerCommitmentByIndex
      description: Returns a sequencer commitment by its global index.
      params:
        - name: index
          required: true
          description: Commitment index (hex quantity).
          schema:
            $ref: "../evm/base-types.yaml#/components/schemas/uint"
      result:
        name: Sequencer commitment
        description: Commitment identified by the supplied index.
        schema:
          type: object
          additionalProperties: false
          required: ["merkleRoot", "index", "l2EndBlockNumber"]
          properties:
            merkleRoot:
              description: Merkle root of sequencer commitment.
              $ref: "../evm/base-types.yaml#/components/schemas/hash32"
            index:
              description: Global commitment index (hex quantity).
              $ref: "../evm/base-types.yaml#/components/schemas/uint"
            l2EndBlockNumber:
              description: Last L2 block included in this commitment (hex quantity).
              $ref: "../evm/base-types.yaml#/components/schemas/uint"
      examples:
        - name: ledger_getSequencerCommitmentByIndex example
          params:
            - name: index
              value: "0xba5"
          result:
            name: Sequencer commitment
            value:
              merkleRoot: "0xd6dc3eb1a59be7bc1ece68318f82a60919f0f98d8c648337d588ce243a17f473"
              index: "0xba5"
              l2EndBlockNumber: "0xb7a20b"

    ledger_getVerifiedBatchProofsBySlotHeight:
      name: ledger_getVerifiedBatchProofsBySlotHeight
      description: Returns verified ZK batch proof(s) for the specified DA slot height.
      params:
        - name: height
          required: true
          description: DA slot height (L1).
          schema:
            title: DASlotHeight
            type: integer
      result:
        name: Verified batch proofs
        description: Array of verified batch proofs for the given slot height.
        schema:
          type: array
          items:
            type: object
            additionalProperties: false
            required: ["proof", "proofOutput"]
            properties:
              proof:
                description: ZK proof data (~2MB, hex-encoded).
                $ref: "../evm/base-types.yaml#/components/schemas/bytes"
              proofOutput:
                type: object
                additionalProperties: false
                required:
                  - stateRoots
                  - finalL2BlockHash
                  - stateDiff
                  - lastL2Height
                  - sequencerCommitmentIndexRange
                  - sequencerCommitmentHashes
                  - lastL1HashOnBitcoinLightClientContract
                  - previousCommitmentIndex
                  - previousCommitmentHash
                properties:
                  stateRoots:
                    description: Array of intermediate/final state roots proven by this batch.
                    type: array
                    minItems: 1
                    items:
                      $ref: "../evm/base-types.yaml#/components/schemas/hash32"
                  finalL2BlockHash:
                    description: Final L2 block hash covered by the batch.
                    $ref: "../evm/base-types.yaml#/components/schemas/hash32"
                  stateDiff:
                    description: State changes as key-value pairs (hex → hex).
                    type: object
                    additionalProperties:
                      $ref: "../evm/base-types.yaml#/components/schemas/bytes"
                  lastL2Height:
                    description: Last L2 height included in the proof (hex quantity).
                    $ref: "../evm/base-types.yaml#/components/schemas/uint"
                  sequencerCommitmentIndexRange:
                    description: Inclusive range of sequencer commitment indices [start, end] covered by this batch.
                    type: array
                    minItems: 2
                    maxItems: 2
                    items:
                      $ref: "../evm/base-types.yaml#/components/schemas/uint"
                  sequencerCommitmentHashes:
                    description: Commitment hashes corresponding to the covered range.
                    type: array
                    minItems: 1
                    items:
                      $ref: "../evm/base-types.yaml#/components/schemas/hash32"
                  lastL1HashOnBitcoinLightClientContract:
                    description: Last L1 hash recorded on the Bitcoin light client contract.
                    $ref: "../evm/base-types.yaml#/components/schemas/hash32"
                  previousCommitmentIndex:
                    description: Previous sequencer commitment index (hex quantity).
                    $ref: "../evm/base-types.yaml#/components/schemas/uint"
                  previousCommitmentHash:
                    description: Previous sequencer commitment hash.
                    $ref: "../evm/base-types.yaml#/components/schemas/hash32"
      examples:
        - name: ledger_getVerifiedBatchProofsBySlotHeight example
          params:
            - name: height
              value: 85890
          result:
            name: Verified batch proofs
            value:
              - proof: "0x0300000000000000000000000000000081670c116a84c0351f18c3..." # truncated for docs
                proofOutput:
                  stateRoots:
                    - "0x5e2a5b8da99b65c5eba4b36f2368321dad95c08c641d698b09ca6756caac589e"
                    - "0x182a9543bf64a90e78f7d810dedebdf4da3322752db5ee5533fae564e31033f7"
                  finalL2BlockHash: "0x8fe769cdb2d34f60b5a625caa8697ae1d1f213b558c9dc9e681059f18732e608"
                  stateDiff:
                    "0x412f612f0201edff3b3ee593dbef54e2fbdd421070db55e2de2aebe75f398bd85ac97ed364": "0xf4fd64e249e658fdb748f83190e47f0b1cd5e87fe30d005c257d7a94cca458e7167e690000000000"
                  lastL2Height: "0xae0e97"
                  sequencerCommitmentIndexRange: ["0x92c", "0x92e"]
                  sequencerCommitmentHashes:
                    - "0x8a9cd0b9fda255370073abff4176416665d14552d5f0d671998ca89523041b36"
                  lastL1HashOnBitcoinLightClientContract: "0xa1717b35aa14be01ce037d1a346c4c1714afcfa5e8a66a35af5ead0000000000"
                  previousCommitmentIndex: "0x92b"
                  previousCommitmentHash: "0xa37a45539d40448d22f6da7978ca58f5845b72a5043129941817099471198749"

    ledger_getLastVerifiedBatchProof:
      name: ledger_getLastVerifiedBatchProof
      description: Returns the most recent verified batch proof.
      params: []
      result:
        name: Verified batch proof
        description: Latest verified batch proof (same structure as an item from ledger_getVerifiedBatchProofsBySlotHeight).
        schema:
          type: object
          additionalProperties: false
          required: ["proof", "proofOutput"]
          properties:
            proof:
              description: ZK proof data (~2MB, hex-encoded).
              $ref: "../evm/base-types.yaml#/components/schemas/bytes"
            proofOutput:
              type: object
              additionalProperties: false
              required:
                - stateRoots
                - finalL2BlockHash
                - stateDiff
                - lastL2Height
                - sequencerCommitmentIndexRange
                - sequencerCommitmentHashes
                - lastL1HashOnBitcoinLightClientContract
                - previousCommitmentIndex
                - previousCommitmentHash
              properties:
                stateRoots:
                  type: array
                  minItems: 1
                  items:
                    $ref: "../evm/base-types.yaml#/components/schemas/hash32"
                finalL2BlockHash:
                  $ref: "../evm/base-types.yaml#/components/schemas/hash32"
                stateDiff:
                  type: object
                  additionalProperties:
                    $ref: "../evm/base-types.yaml#/components/schemas/bytes"
                lastL2Height:
                  $ref: "../evm/base-types.yaml#/components/schemas/uint"
                sequencerCommitmentIndexRange:
                  type: array
                  minItems: 2
                  maxItems: 2
                  items:
                    $ref: "../evm/base-types.yaml#/components/schemas/uint"
                sequencerCommitmentHashes:
                  type: array
                  minItems: 1
                  items:
                    $ref: "../evm/base-types.yaml#/components/schemas/hash32"
                lastL1HashOnBitcoinLightClientContract:
                  $ref: "../evm/base-types.yaml#/components/schemas/hash32"
                previousCommitmentIndex:
                  $ref: "../evm/base-types.yaml#/components/schemas/uint"
                previousCommitmentHash:
                  $ref: "../evm/base-types.yaml#/components/schemas/hash32"
      examples:
        - name: ledger_getLastVerifiedBatchProof example
          params: []
          result:
            name: Verified batch proof
            value:
              proof: "0x0300000000000000000000000000000081670c116a84c0351f18c3..." # truncated for docs
              proofOutput:
                stateRoots:
                  - "0x5e2a5b8da99b65c5eba4b36f2368321dad95c08c641d698b09ca6756caac589e"
                  - "0x182a9543bf64a90e78f7d810dedebdf4da3322752db5ee5533fae564e31033f7"
                finalL2BlockHash: "0x8fe769cdb2d34f60b5a625caa8697ae1d1f213b558c9dc9e681059f18732e608"
                stateDiff:
                  "0x412f612f0201edff3b3ee593dbef54e2fbdd421070db55e2de2aebe75f398bd85ac97ed364": "0xf4fd64e249e658fdb748f83190e47f0b1cd5e87fe30d005c257d7a94cca458e7167e690000000000"
                lastL2Height: "0xae0e97"
                sequencerCommitmentIndexRange: ["0x92c", "0x92e"]
                sequencerCommitmentHashes:
                  - "0x8a9cd0b9fda255370073abff4176416665d14552d5f0d671998ca89523041b36"
                lastL1HashOnBitcoinLightClientContract: "0xa1717b35aa14be01ce037d1a346c4c1714afcfa5e8a66a35af5ead0000000000"
                previousCommitmentIndex: "0x92b"
                previousCommitmentHash: "0xa37a45539d40448d22f6da7978ca58f5845b72a5043129941817099471198749"

    ledger_getLastScannedL1Height:
      name: ledger_getLastScannedL1Height
      description: Returns the highest L1 block number the node has scanned so far.
      params: []
      result:
        name: Last scanned L1 block height
        description: Last scanned L1 block height (hex quantity).
        schema:
          $ref: "../evm/base-types.yaml#/components/schemas/uint"
      examples:
        - name: ledger_getLastScannedL1Height example
          params: []
          result:
            name: Last scanned L1 block height
            value: "0x15e53"

    citrea_getLastCommittedL2Height:
      name: citrea_getLastCommittedL2Height
      description: Returns the latest L2 block height that has been committed to Bitcoin via sequencer commitment.
      params: []
      result:
        name: Last committed L2 height
        description: Latest committed L2 height and its sequencer commitment index.
        schema:
          type: object
          additionalProperties: false
          required: ["height", "commitment_index"]
          properties:
            height:
              type: integer
              description: Latest committed L2 block height (decimal).
            commitment_index:
              type: integer
              description: Sequencer commitment index (decimal).
      examples:
        - name: citrea_getLastCommittedL2Height example
          params: []
          result:
            name: Last committed L2 height
            value:
              height: 12489007
              commitment_index: 3444

    citrea_getLastProvenL2Height:
      name: citrea_getLastProvenL2Height
      description: Returns the latest L2 block height that has been proven on Bitcoin with a validity proof.
      params: []
      result:
        name: Last proven L2 height
        description: Latest proven L2 height and its sequencer commitment index.
        schema:
          type: object
          additionalProperties: false
          required: ["height", "commitment_index"]
          properties:
            height:
              type: integer
              description: Latest proven L2 block height (decimal).
            commitment_index:
              type: integer
              description: Sequencer commitment index (decimal).
      examples:
        - name: citrea_getLastProvenL2Height example
          params: []
          result:
            name: Last proven L2 height
            value:
              height: 11457999
              commitment_index: 2401

    citrea_getL2StatusHeightsByL1Height:
      name: citrea_getL2StatusHeightsByL1Height
      description: Returns committed and proven L2 heights as of a given Bitcoin block.
      params:
        - name: l1_height
          required: true
          description: Bitcoin block height to query.
          schema:
            title: L1BlockHeight
            type: integer
      result:
        name: L2 status heights
        description: Committed and proven L2 heights as of the specified L1 block.
        schema:
          type: object
          additionalProperties: false
          required: ["committed", "proven"]
          properties:
            committed:
              type: object
              additionalProperties: false
              required: ["height", "commitment_index"]
              properties:
                height:
                  type: integer
                  description: Latest committed L2 block height (decimal).
                commitment_index:
                  type: integer
                  description: Sequencer commitment index (decimal).
            proven:
              type: object
              additionalProperties: false
              required: ["height", "commitment_index"]
              properties:
                height:
                  type: integer
                  description: Latest proven L2 block height (decimal).
                commitment_index:
                  type: integer
                  description: Sequencer commitment index (decimal).
      examples:
        - name: citrea_getL2StatusHeightsByL1Height example
          params:
            - name: l1_height
              value: 800000
          result:
            name: L2 status heights
            value:
              committed:
                height: 12489007
                commitment_index: 3444
              proven:
                height: 11457999
                commitment_index: 2401

    citrea_sendRawDepositTransaction:
      name: citrea_sendRawDepositTransaction
      description: |
        Submits a raw deposit transaction to the Citrea sequencer. The node first simulates the
        deposit; if valid, it is queued for inclusion.
      params:
        - name: deposit
          required: true
          description: Raw serialized deposit tx data (hex).
          schema:
            $ref: "../evm/base-types.yaml#/components/schemas/bytes"
      result:
        name: Submission result
        description: Success returns null.
        schema:
          type: "null"
      examples:
        - name: citrea_sendRawDepositTransaction example
          params:
            - name: deposit
              value: "0x01020304..."
          result:
            name: Submission result
            value: null

    eth_estimateDiffSize:
      name: eth_estimateDiffSize
      description: Returns estimated diff size and gas consumption for a potential transaction.
      params:
        - name: Transaction
          required: true
          description: Transaction object to simulate (same shape as `eth_estimateGas`).
          schema:
            $ref: "../evm/transaction.yaml#/components/schemas/GenericTransaction"
        - name: Block
          required: false
          description: Block number or tag at which to estimate (defaults to 'latest' if omitted).
          schema:
            $ref: "../evm/block.yaml#/components/schemas/BlockNumberOrTag"
      result:
        name: Estimation
        description: Estimated gas usage and L1 diff size.
        schema:
          type: object
          additionalProperties: false
          required: ["gas", "l1DiffSize"]
          properties:
            gas:
              description: Estimated gas consumption (hex quantity).
              $ref: "../evm/base-types.yaml#/components/schemas/uint"
            l1DiffSize:
              description: Estimated L1 diff size (hex quantity).
              $ref: "../evm/base-types.yaml#/components/schemas/uint"
      examples:
        - name: eth_estimateDiffSize example
          params:
            - name: Transaction
              value:
                from: "0x0452663bfc46B86aC93d8220D9847cF5220D7642"
                to: "0x5fbdb2315678afecb367f032d93f642f64180aa3"
                value: "10000"
          result:
            name: Estimation
            value:
              gas: "0x5208"
              l1DiffSize: "0x11"
