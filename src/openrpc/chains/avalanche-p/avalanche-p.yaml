# yaml-language-server: $schema=https://meta.open-rpc.org/

$schema: https://meta.open-rpc.org/
openrpc: 1.2.4
info:
  title: Alchemy Avalanche P-Chain JSON-RPC Specification
  description: >
    A specification of the JSON-RPC 2.0 methods for the Avalanche P-Chain.
    Parameters are passed by name (as a JSON object). The P-Chain uses the same base URLs as Avalanche C-Chain; append `/ext/bc/P` after your API key in the path (e.g. `https://avax-mainnet.g.alchemy.com/v2/YOUR_API_KEY/ext/bc/P`).
  version: 0.0.0
# Server URL is already final (includes api key + path). Generator will not add x-auth-params.
x-alchemy-server-url-final: true
servers:
  - url: https://avax-mainnet.g.alchemy.com/v2/docs-demo/ext/bc/P
    name: Avalanche P-Chain Mainnet
  - url: https://avax-fuji.g.alchemy.com/v2/docs-demo/ext/bc/P
    name: Avalanche P-Chain Fuji
methods:
  - $ref: ../_components/avalanche-p/methods.yaml#/components/methods/platform.getBalance
  - $ref: ../_components/avalanche-p/methods.yaml#/components/methods/platform.getBlockchainStatus
  - $ref: ../_components/avalanche-p/methods.yaml#/components/methods/platform.getBlockchains
  - $ref: ../_components/avalanche-p/methods.yaml#/components/methods/platform.getCurrentSupply
  - $ref: ../_components/avalanche-p/methods.yaml#/components/methods/platform.getCurrentValidators
  - $ref: ../_components/avalanche-p/methods.yaml#/components/methods/platform.getFeeConfig
  - $ref: ../_components/avalanche-p/methods.yaml#/components/methods/platform.getFeeState
  - $ref: ../_components/avalanche-p/methods.yaml#/components/methods/platform.getHeight
  - $ref: ../_components/avalanche-p/methods.yaml#/components/methods/platform.getMinStake
  - $ref: ../_components/avalanche-p/methods.yaml#/components/methods/platform.getRewardUTXOs
  - $ref: ../_components/avalanche-p/methods.yaml#/components/methods/platform.getStake
  - $ref: ../_components/avalanche-p/methods.yaml#/components/methods/platform.getStakingAssetID
  - $ref: ../_components/avalanche-p/methods.yaml#/components/methods/platform.getSubnets
  - $ref: ../_components/avalanche-p/methods.yaml#/components/methods/platform.getTimestamp
  - $ref: ../_components/avalanche-p/methods.yaml#/components/methods/platform.getTotalStake
