$schema: https://meta.open-rpc.org/
openrpc: 1.2.4
info:
  title: Alchemy Solana JSON-RPC Specification
  description: A specification of the standard JSON-RPC methods for Solana.
  version: 0.0.0
servers:
  - url: https://solana-mainnet.g.alchemy.com/v2
    name: Solana Mainnet
  - url: https://solana-devnet.g.alchemy.com/v2
    name: Solana Devnet

methods:
  - name: getAsset
    description: Returns information about a single digital asset.
    paramStructure: by-name
    params:
      - name: id
        required: true
        description: The ID of the asset, typically a base-58 encoded string.
        schema:
          $ref: ../../chains/_components/solana/asset.yaml#/components/schemas/AssetId
      - name: displayOptions
        required: false
        description: Options for display formatting.
        schema:
          $ref: ../../chains/_components/solana/asset.yaml#/components/schemas/DisplayOptions
    examples:
      - name: getAsset example
        params:
          - name: id
            value: "F9Lw3ki3hJ7PF9HQXsBzoY8GyE6sPoEZZdXJBsTTD2rk"
    result:
      name: Asset information
      description: Returns detailed information about the specified digital asset.
      schema:
        $ref: ../../chains/_components/solana/asset.yaml#/components/schemas/Asset

  - name: getAssets
    description: Returns information about multiple digital assets.
    paramStructure: by-name
    params:
      - name: ids
        required: true
        description: An array of asset IDs to retrieve.
        schema:
          type: array
          items:
            $ref: ../../chains/_components/solana/asset.yaml#/components/schemas/AssetId
      - name: sortBy
        required: false
        description: Sorting criteria for assets.
        schema:
          type: object
          properties:
            sortBy:
              type: string
              enum:
                - created
                - updated
                - recentAction
                - none
              description: The field to sort by.
            sortDirection:
              type: string
              enum:
                - asc
                - desc
              description: Sort direction.
      - name: limit
        required: false
        description: The maximum number of assets to retrieve.
        schema:
          type: integer
          maximum: 1000
          default: 100
      - name: page
        required: false
        description: The index of the "page" to retrieve.
        schema:
          type: integer
          default: 1
      - name: before
        required: false
        description: Retrieve assets before this cursor.
        schema:
          type: string
      - name: after
        required: false
        description: Retrieve assets after this cursor.
        schema:
          type: string
      - name: displayOptions
        required: false
        description: Options for display formatting.
        schema:
          $ref: ../../chains/_components/solana/asset.yaml#/components/schemas/DisplayOptions
    examples:
      - name: getAssets example
        params:
          - name: ids
            value:
              - "Bu1DEKeawy7txbnCEJE4BU3BKLXaNAKCYcHR4XhndGss"
              - "8vw7tdLGE3FBjaetsJrZAbbyssUrXai1aBJbUnj5S5uo"
    result:
      name: Assets list
      description: Returns detailed information about the specified digital assets.
      schema:
        $ref: ../../chains/_components/solana/asset.yaml#/components/schemas/AssetList

  - name: getAssetProof
    description: Returns the merkle proof for a compressed digital asset.
    paramStructure: by-name
    params:
      - name: id
        required: true
        description: The ID of the compressed asset.
        schema:
          $ref: ../../chains/_components/solana/asset.yaml#/components/schemas/AssetId
    examples:
      - name: getAssetProof example
        params:
          - name: id
            value: "Bu1DEKeawy7txbnCEJE4BU3BKLXaNAKCYcHR4XhndGss"
    result:
      name: Asset proof
      description: Returns the merkle proof for the specified compressed asset.
      schema:
        $ref: ../../chains/_components/solana/asset.yaml#/components/schemas/AssetProof

  - name: getAssetProofs
    description: Returns merkle proofs for multiple compressed digital assets.
    paramStructure: by-name
    params:
      - name: ids
        required: true
        description: An array of compressed asset IDs.
        schema:
          type: array
          items:
            $ref: ../../chains/_components/solana/asset.yaml#/components/schemas/AssetId
    examples:
      - name: getAssetProofs example
        params:
          - name: ids
            value:
              - "Bu1DEKeawy7txbnCEJE4BU3BKLXaNAKCYcHR4XhndGss"
              - "8vw7tdLGE3FBjaetsJrZAbbyssUrXai1aBJbUnj5S5uo"
    result:
      name: Asset proofs
      description: Returns merkle proofs for the specified compressed assets.
      schema:
        $ref: ../../chains/_components/solana/asset.yaml#/components/schemas/AssetProofList

  - name: getAssetsByAuthority
    description: Returns assets filtered by their authority.
    paramStructure: by-name
    params:
      - name: authorityAddress
        required: true
        description: The authority address to filter by.
        schema:
          $ref: ../../chains/_components/solana/base-types.yaml#/components/schemas/Pubkey
      - name: sortBy
        required: false
        description: Sorting criteria for assets.
        schema:
          type: object
          properties:
            sortBy:
              type: string
              enum:
                - created
                - updated
                - recentAction
                - none
              description: The field to sort by.
            sortDirection:
              type: string
              enum:
                - asc
                - desc
              description: Sort direction.
      - name: limit
        required: false
        description: The maximum number of assets to retrieve.
        schema:
          type: integer
          maximum: 1000
          default: 100
      - name: page
        required: false
        description: The index of the "page" to retrieve.
        schema:
          type: integer
          default: 1
      - name: before
        required: false
        description: Retrieve assets before this cursor.
        schema:
          type: string
      - name: after
        required: false
        description: Retrieve assets after this cursor.
        schema:
          type: string
    examples:
      - name: getAssetsByAuthority example
        params:
          - name: authorityAddress
            value: "2RtGg6fsFiiF1EQzHqbd66AhW7R5bWeQGpTbv2UMkCdW"
    result:
      name: Assets by authority
      description: Returns assets filtered by the specified authority.
      schema:
        $ref: ../../chains/_components/solana/asset.yaml#/components/schemas/AssetList

  - name: getAssetsByOwner
    description: Returns assets owned by the specified address.
    paramStructure: by-name
    params:
      - name: ownerAddress
        required: true
        description: The owner address to filter assets by.
        schema:
          $ref: ../../chains/_components/solana/base-types.yaml#/components/schemas/Pubkey
      - name: sortBy
        required: false
        description: Sorting criteria for assets.
        schema:
          type: object
          properties:
            sortBy:
              type: string
              enum:
                - id
                - created
                - updated
                - recentAction
                - none
              description: >
                The field to sort by. Note: Only `id` is supported for cursor-based pagination
                (using `before`/`after`). Sorting by `created`, `updated`, `recentAction`, or `none`
                requires page-based pagination (using `page`).
            sortDirection:
              type: string
              enum:
                - asc
                - desc
              description: Sort direction.
      - name: limit
        required: false
        description: The maximum number of assets to retrieve.
        schema:
          type: integer
          maximum: 1000
          default: 100
      - name: page
        required: false
        description: The index of the "page" to retrieve. Required when using sortBy values other than `id`.
        schema:
          type: integer
          default: 1
      - name: before
        required: false
        description: Retrieve assets before this cursor. Only supported when sortBy is `id`.
        schema:
          type: string
      - name: after
        required: false
        description: Retrieve assets after this cursor. Only supported when sortBy is `id`.
        schema:
          type: string
      - name: options
        required: false
        description: Options for display formatting.
        schema:
          $ref: ../../chains/_components/solana/asset.yaml#/components/schemas/DisplayOptions
    examples:
      - name: getAssetsByOwner example
        params:
          - name: ownerAddress
            value: "86xCnPeV69n6t3DnyGvkKobf9FdN2H9oiVDdaMpo2MMY"
          - name: page
            value: 1
          - name: limit
            value: 50
          - name: sortBy
            value:
              sortBy: "created"
              sortDirection: "asc"
          - name: options
            value:
              showUnverifiedCollections: false
              showCollectionMetadata: false
              showFungible: false
              showZeroBalance: false
    result:
      name: Assets by owner
      description: Returns assets owned by the specified address.
      schema:
        $ref: ../../chains/_components/solana/asset.yaml#/components/schemas/AssetList

  - name: getAssetsByGroup
    description: Returns assets filtered by their group information.
    paramStructure: by-name
    params:
      - name: groupKey
        required: true
        description: The group key to filter by.
        schema:
          type: string
      - name: groupValue
        required: true
        description: The group value to filter by.
        schema:
          type: string
      - name: sortBy
        required: false
        description: Sorting criteria for assets.
        schema:
          type: object
          properties:
            sortBy:
              type: string
              enum:
                - created
                - updated
                - recentAction
                - none
              description: The field to sort by.
            sortDirection:
              type: string
              enum:
                - asc
                - desc
              description: Sort direction.
      - name: limit
        required: false
        description: The maximum number of assets to retrieve.
        schema:
          type: integer
          maximum: 1000
          default: 100
      - name: page
        required: false
        description: The index of the "page" to retrieve.
        schema:
          type: integer
          default: 1
      - name: before
        required: false
        description: Retrieve assets before this cursor.
        schema:
          type: string
      - name: after
        required: false
        description: Retrieve assets after this cursor.
        schema:
          type: string
    examples:
      - name: getAssetsByGroup example
        params:
          - name: groupKey
            value: "collection"
          - name: groupValue
            value: "J1S9H3QjnRtBbbuD4HjPV6RpRhwuk4zKbxsnCHuTgh9w"
    result:
      name: Assets by group
      description: Returns assets filtered by the specified group.
      schema:
        $ref: ../../chains/_components/solana/asset.yaml#/components/schemas/AssetList

  - name: getAssetsByCreator
    description: Returns assets created by the specified address.
    paramStructure: by-name
    params:
      - name: creatorAddress
        required: true
        description: The creator address to filter by.
        schema:
          $ref: ../../chains/_components/solana/base-types.yaml#/components/schemas/Pubkey
      - name: onlyVerified
        required: false
        description: Only return assets where the creator is verified.
        schema:
          type: boolean
          default: false
      - name: sortBy
        required: false
        description: Sorting criteria for assets.
        schema:
          type: object
          properties:
            sortBy:
              type: string
              enum:
                - created
                - updated
                - recentAction
                - none
              description: The field to sort by.
            sortDirection:
              type: string
              enum:
                - asc
                - desc
              description: Sort direction.
      - name: limit
        required: false
        description: The maximum number of assets to retrieve.
        schema:
          type: integer
          maximum: 1000
          default: 100
      - name: page
        required: false
        description: The index of the "page" to retrieve.
        schema:
          type: integer
          default: 1
      - name: before
        required: false
        description: Retrieve assets before this cursor.
        schema:
          type: string
      - name: after
        required: false
        description: Retrieve assets after this cursor.
        schema:
          type: string
    examples:
      - name: getAssetsByCreator example
        params:
          - name: creatorAddress
            value: "9zsduBRp3VyGKaqim3b17dER3Z8fGCE1UYs4FNrqn1Km"
    result:
      name: Assets by creator
      description: Returns assets created by the specified address.
      schema:
        $ref: ../../chains/_components/solana/asset.yaml#/components/schemas/AssetList

  - name: searchAssets
    description: Search for assets using a complex set of filter criteria.
    paramStructure: by-name
    params:
      - name: sortBy
        required: false
        description: Sorting criteria for assets.
        schema:
          type: object
          properties:
            sortBy:
              type: string
              enum:
                - created
                - updated
                - recentAction
                - none
              description: The field to sort by.
            sortDirection:
              type: string
              enum:
                - asc
                - desc
              description: Sort direction.
      - name: limit
        required: false
        description: The maximum number of assets to retrieve.
        schema:
          type: integer
          maximum: 1000
          default: 100
      - name: page
        required: false
        description: The index of the "page" to retrieve.
        schema:
          type: integer
          default: 1
      - name: before
        required: false
        description: Retrieve assets before this cursor.
        schema:
          type: string
      - name: after
        required: false
        description: Retrieve assets after this cursor.
        schema:
          type: string
      - name: negate
        required: false
        description: Invert the search filter.
        schema:
          type: boolean
          default: false
      - name: conditionType
        required: false
        description: Condition type for multiple filters.
        schema:
          type: string
          enum:
            - all
            - any
          default: all
      - name: interface
        required: false
        description: The interface of the asset.
        schema:
          $ref: ../../chains/_components/solana/asset.yaml#/components/schemas/AssetInterface
      - name: ownerAddress
        required: false
        description: The owner address to filter by.
        schema:
          $ref: ../../chains/_components/solana/base-types.yaml#/components/schemas/Pubkey
      - name: ownerType
        required: false
        description: The ownership model.
        schema:
          type: string
          enum:
            - single
            - token
      - name: creatorAddress
        required: false
        description: The creator address to filter by.
        schema:
          $ref: ../../chains/_components/solana/base-types.yaml#/components/schemas/Pubkey
      - name: creatorVerified
        required: false
        description: Only include verified creators.
        schema:
          type: boolean
      - name: authorityAddress
        required: false
        description: The authority address to filter by.
        schema:
          $ref: ../../chains/_components/solana/base-types.yaml#/components/schemas/Pubkey
      - name: grouping
        required: false
        description: Grouping criteria for assets.
        schema:
          type: array
          items:
            type: string
      - name: delegateAddress
        required: false
        description: The delegate address to filter by.
        schema:
          $ref: ../../chains/_components/solana/base-types.yaml#/components/schemas/Pubkey
      - name: frozen
        required: false
        description: Filter by frozen status.
        schema:
          type: boolean
      - name: supply
        required: false
        description: Supply filter criteria.
        schema:
          type: object
          properties:
            printMaxSupply:
              type: integer
              description: Maximum print supply filter.
            printCurrentSupply:
              type: integer
              description: Current print supply filter.
      - name: mutable
        required: false
        description: Filter by mutable status.
        schema:
          type: boolean
      - name: burnt
        required: false
        description: Filter by burnt status.
        schema:
          type: boolean
      - name: jsonUri
        required: false
        description: Filter by JSON URI.
        schema:
          type: string
    examples:
      - name: searchAssets example
        params:
          - name: ownerAddress
            value: "86xCnPeV69n6t3DnyGvkKobf9FdN2H9oiVDdaMpo2MMY"
          - name: limit
            value: 50
    result:
      name: Search results
      description: Returns assets matching the specified search criteria.
      schema:
        $ref: ../../chains/_components/solana/asset.yaml#/components/schemas/AssetList

  - name: getAssetSignatures
    description: Returns signatures for transactions that have interacted with the given asset.
    paramStructure: by-name
    params:
      - name: id
        required: true
        description: The ID of the asset to get signatures for.
        schema:
          $ref: ../../chains/_components/solana/asset.yaml#/components/schemas/AssetId
      - name: limit
        required: false
        description: The maximum number of signatures to retrieve.
        schema:
          type: integer
          maximum: 1000
          default: 100
      - name: page
        required: false
        description: The index of the "page" to retrieve.
        schema:
          type: integer
          default: 1
      - name: before
        required: false
        description: Retrieve signatures before this cursor.
        schema:
          type: string
      - name: after
        required: false
        description: Retrieve signatures after this cursor.
        schema:
          type: string
      - name: tree
        required: false
        description: The merkle tree address to filter by.
        schema:
          $ref: ../../chains/_components/solana/base-types.yaml#/components/schemas/Pubkey
    examples:
      - name: getAssetSignatures example
        params:
          - name: id
            value: "FNt6A9Mfnqbwc1tY7uwAguKQ1JcpBrxmhczDgbdJy5AC"
    result:
      name: Asset signatures
      description: Returns signatures for transactions involving the specified asset.
      schema:
        $ref: ../../chains/_components/solana/asset.yaml#/components/schemas/AssetSignatureList

  - name: getNftEditions
    description: Returns all editions of a given master NFT.
    paramStructure: by-name
    params:
      - name: mint
        required: true
        description: The ID of the master NFT to get editions for.
        schema:
          $ref: ../../chains/_components/solana/asset.yaml#/components/schemas/AssetId
      - name: limit
        required: false
        description: The maximum number of editions to retrieve.
        schema:
          type: integer
          maximum: 1000
          default: 100
      - name: page
        required: false
        description: The index of the "page" to retrieve.
        schema:
          type: integer
          default: 1
      - name: before
        required: false
        description: Retrieve editions before this cursor.
        schema:
          type: string
      - name: after
        required: false
        description: Retrieve editions after this cursor.
        schema:
          type: string
    examples:
      - name: getNftEditions example
        params:
          - name: mint
            value: "Bu1DEKeawy7txbnCEJE4BU3BKLXaNAKCYcHR4XhndGss"
    result:
      name: NFT editions
      description: Returns all editions of the specified master NFT.
      schema:
        $ref: ../../chains/_components/solana/asset.yaml#/components/schemas/NftEditionList

  - name: getTokenAccounts
    description: Returns token accounts based on the specified filters.
    paramStructure: by-name
    params:
      - name: mint
        required: false
        description: The mint address to filter token accounts by.
        schema:
          $ref: ../../chains/_components/solana/base-types.yaml#/components/schemas/Pubkey
      - name: owner
        required: false
        description: The owner address to filter token accounts by.
        schema:
          $ref: ../../chains/_components/solana/base-types.yaml#/components/schemas/Pubkey
      - name: programId
        required: false
        description: The program ID to filter accounts by.
        schema:
          $ref: ../../chains/_components/solana/base-types.yaml#/components/schemas/Pubkey
      - name: limit
        required: false
        description: The maximum number of token accounts to retrieve.
        schema:
          type: integer
          maximum: 1000
          default: 100
      - name: cursor
        required: false
        description: Cursor for pagination.
        schema:
          type: string
    examples:
      - name: getTokenAccounts example
        params:
          - name: owner
            value: "86xCnPeV69n6t3DnyGvkKobf9FdN2H9oiVDdaMpo2MMY"
    result:
      name: Token accounts
      description: Returns token accounts matching the specified criteria.
      schema:
        $ref: ../../chains/_components/solana/account.yaml#/components/schemas/TokenAccountsList
