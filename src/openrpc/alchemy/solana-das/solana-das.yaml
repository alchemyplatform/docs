$schema: https://meta.open-rpc.org/
openrpc: 1.2.4
info:
  title: Alchemy Solana JSON-RPC Specification
  description: A specification of the standard JSON-RPC methods for Solana.
  version: 0.0.0
servers:
  - url: https://solana-mainnet.g.alchemy.com/v2
    name: Solana Mainnet
  - url: https://solana-devnet.g.alchemy.com/v2
    name: Solana Devnet

methods:
  - name: getAsset
    description: Returns information about a single digital asset.
    paramStructure: by-name
    params:
      - name: id
        required: true
        description: The ID of the asset, typically a base-58 encoded string.
        schema:
          $ref: ../../chains/_components/solana/asset.yaml#/components/schemas/AssetId
      - name: displayOptions
        required: false
        description: Options for display formatting.
        schema:
          $ref: ../../chains/_components/solana/asset.yaml#/components/schemas/DisplayOptions
    examples:
      - name: getAsset example
        params:
          - name: id
            value: "F9Lw3ki3hJ7PF9HQXsBzoY8GyE6sPoEZZdXJBsTTD2rk"
    result:
      name: Asset information
      description: Returns detailed information about the specified digital asset.
      schema:
        $ref: ../../chains/_components/solana/asset.yaml#/components/schemas/Asset

  - name: getAssets
    description: Returns information about multiple digital assets.
    paramStructure: by-name
    params:
      - name: ids
        required: true
        description: An array of asset IDs to retrieve.
        schema:
          type: array
          items:
            $ref: ../../chains/_components/solana/asset.yaml#/components/schemas/AssetId
      - name: displayOptions
        required: false
        description: Options for display formatting.
        schema:
          $ref: ../../chains/_components/solana/asset.yaml#/components/schemas/DisplayOptions
    examples:
      - name: getAssets example
        params:
          - name: ids
            value:
              - "Bu1DEKeawy7txbnCEJE4BU3BKLXaNAKCYcHR4XhndGss"
              - "8vw7tdLGE3FBjaetsJrZAbbyssUrXai1aBJbUnj5S5uo"
    result:
      name: Assets list
      description: Returns detailed information about the specified digital assets.
      schema:
        $ref: ../../chains/_components/solana/asset.yaml#/components/schemas/AssetList

  - name: getAssetProof
    description: Returns the merkle proof for a compressed digital asset.
    paramStructure: by-name
    params:
      - name: id
        required: true
        description: The ID of the compressed asset.
        schema:
          $ref: ../../chains/_components/solana/asset.yaml#/components/schemas/AssetId
    examples:
      - name: getAssetProof example
        params:
          - name: id
            value: "Bu1DEKeawy7txbnCEJE4BU3BKLXaNAKCYcHR4XhndGss"
    result:
      name: Asset proof
      description: Returns the merkle proof for the specified compressed asset.
      schema:
        $ref: ../../chains/_components/solana/asset.yaml#/components/schemas/AssetProof

  - name: getAssetProofs
    description: Returns merkle proofs for multiple compressed digital assets.
    paramStructure: by-name
    params:
      - name: ids
        required: true
        description: An array of compressed asset IDs.
        schema:
          type: array
          items:
            $ref: ../../chains/_components/solana/asset.yaml#/components/schemas/AssetId
    examples:
      - name: getAssetProofs example
        params:
          - name: ids
            value:
              - "Bu1DEKeawy7txbnCEJE4BU3BKLXaNAKCYcHR4XhndGss"
              - "8vw7tdLGE3FBjaetsJrZAbbyssUrXai1aBJbUnj5S5uo"
    result:
      name: Asset proofs
      description: Returns merkle proofs for the specified compressed assets.
      schema:
        $ref: ../../chains/_components/solana/asset.yaml#/components/schemas/AssetProofList

  - name: getAssetsByAuthority
    description: Returns assets filtered by their authority.
    paramStructure: by-name
    params:
      - name: authorityAddress
        required: true
        description: The authority address to filter by.
        schema:
          $ref: ../../chains/_components/solana/base-types.yaml#/components/schemas/Pubkey
      - name: sortBy
        required: false
        description: Sorting criteria for assets.
        schema:
          type: object
          properties:
            sortBy:
              type: string
              enum:
                - created
                - updated
                - recent_action
                - none
              description: The field to sort by.
            sortDirection:
              type: string
              enum:
                - asc
                - desc
              description: Sort direction.
      - name: limit
        required: false
        description: The maximum number of assets to retrieve.
        schema:
          type: integer
          maximum: 1000
          default: 100
      - name: page
        required: false
        description: The index of the "page" to retrieve.
        schema:
          type: integer
          default: 1
      - name: before
        required: false
        description: Retrieve assets before this cursor.
        schema:
          type: string
      - name: after
        required: false
        description: Retrieve assets after this cursor.
        schema:
          type: string
    examples:
      - name: getAssetsByAuthority example
        params:
          - name: authorityAddress
            value: "2RtGg6fsFiiF1EQzHqbd66AhW7R5bWeQGpTbv2UMkCdW"
          - name: sortBy
            value:
              sortBy: "created"
              sortDirection: "asc"
          - name: page
            value: 1
    result:
      name: Assets by authority
      description: Returns assets filtered by the specified authority.
      schema:
        $ref: ../../chains/_components/solana/asset.yaml#/components/schemas/AssetList

  - name: getAssetsByOwner
    description: Returns assets owned by the specified address.
    paramStructure: by-name
    params:
      - name: ownerAddress
        required: true
        description: The owner address to filter assets by.
        schema:
          $ref: ../../chains/_components/solana/base-types.yaml#/components/schemas/Pubkey
      - name: sortBy
        required: false
        description: Sorting criteria for assets.
        schema:
          type: object
          properties:
            sortBy:
              type: string
              enum:
                - id
                - created
                - updated
                - recent_action
                - none
              description: >
                The field to sort by. Note: Only `id` is supported for cursor-based pagination
                (using `before`/`after`). Sorting by `created`, `updated`, `recent_action`, or `none`
                requires page-based pagination (using `page`).
            sortDirection:
              type: string
              enum:
                - asc
                - desc
              description: Sort direction.
      - name: limit
        required: false
        description: The maximum number of assets to retrieve.
        schema:
          type: integer
          maximum: 1000
          default: 100
      - name: page
        required: false
        description: The index of the "page" to retrieve. Required when using sortBy values other than `id`.
        schema:
          type: integer
          default: 1
      - name: before
        required: false
        description: Retrieve assets before this cursor. Only supported when sortBy is `id`.
        schema:
          type: string
      - name: after
        required: false
        description: Retrieve assets after this cursor. Only supported when sortBy is `id`.
        schema:
          type: string
      - name: options
        required: false
        description: Options for display formatting.
        schema:
          $ref: ../../chains/_components/solana/asset.yaml#/components/schemas/DisplayOptions
    examples:
      - name: getAssetsByOwner example
        params:
          - name: ownerAddress
            value: "86xCnPeV69n6t3DnyGvkKobf9FdN2H9oiVDdaMpo2MMY"
          - name: page
            value: 1
          - name: limit
            value: 50
          - name: sortBy
            value:
              sortBy: "created"
              sortDirection: "asc"
          - name: options
            value:
              showUnverifiedCollections: false
              showCollectionMetadata: false
              showFungible: false
              showZeroBalance: false
    result:
      name: Assets by owner
      description: Returns assets owned by the specified address.
      schema:
        $ref: ../../chains/_components/solana/asset.yaml#/components/schemas/AssetList

  - name: getAssetsByGroup
    description: Returns assets filtered by their group information.
    paramStructure: by-name
    params:
      - name: groupKey
        required: true
        description: The group key to filter by.
        schema:
          type: string
      - name: groupValue
        required: true
        description: The group value to filter by.
        schema:
          type: string
      - name: sortBy
        required: false
        description: Sorting criteria for assets.
        schema:
          type: object
          properties:
            sortBy:
              type: string
              enum:
                - created
                - updated
                - recent_action
                - none
              description: The field to sort by.
            sortDirection:
              type: string
              enum:
                - asc
                - desc
              description: Sort direction.
      - name: limit
        required: false
        description: The maximum number of assets to retrieve.
        schema:
          type: integer
          maximum: 1000
          default: 100
      - name: page
        required: false
        description: The index of the "page" to retrieve.
        schema:
          type: integer
          default: 1
      - name: before
        required: false
        description: Retrieve assets before this cursor.
        schema:
          type: string
      - name: after
        required: false
        description: Retrieve assets after this cursor.
        schema:
          type: string
    examples:
      - name: getAssetsByGroup example
        params:
          - name: groupKey
            value: "collection"
          - name: groupValue
            value: "J1S9H3QjnRtBbbuD4HjPV6RpRhwuk4zKbxsnCHuTgh9w"
          - name: sortBy
            value:
              sortBy: "created"
              sortDirection: "asc"
          - name: page
            value: 1
    result:
      name: Assets by group
      description: Returns assets filtered by the specified group.
      schema:
        $ref: ../../chains/_components/solana/asset.yaml#/components/schemas/AssetList

  - name: getAssetsByCreator
    description: Returns assets created by the specified address.
    paramStructure: by-name
    params:
      - name: creatorAddress
        required: true
        description: The creator address to filter by.
        schema:
          $ref: ../../chains/_components/solana/base-types.yaml#/components/schemas/Pubkey
      - name: onlyVerified
        required: false
        description: Only return assets where the creator is verified.
        schema:
          type: boolean
          default: false
      - name: sortBy
        required: false
        description: Sorting criteria for assets.
        schema:
          type: object
          properties:
            sortBy:
              type: string
              enum:
                - created
                - updated
                - recent_action
                - none
              description: The field to sort by.
            sortDirection:
              type: string
              enum:
                - asc
                - desc
              description: Sort direction.
      - name: limit
        required: false
        description: The maximum number of assets to retrieve.
        schema:
          type: integer
          maximum: 1000
          default: 100
      - name: page
        required: false
        description: The index of the "page" to retrieve.
        schema:
          type: integer
          default: 1
      - name: before
        required: false
        description: Retrieve assets before this cursor.
        schema:
          type: string
      - name: after
        required: false
        description: Retrieve assets after this cursor.
        schema:
          type: string
    examples:
      - name: getAssetsByCreator example
        params:
          - name: creatorAddress
            value: "9zsduBRp3VyGKaqim3b17dER3Z8fGCE1UYs4FNrqn1Km"
          - name: sortBy
            value:
              sortBy: "created"
              sortDirection: "asc"
          - name: page
            value: 1
    result:
      name: Assets by creator
      description: Returns assets created by the specified address.
      schema:
        $ref: ../../chains/_components/solana/asset.yaml#/components/schemas/AssetList

  - name: searchAssets
    description: Search for assets using a complex set of filter criteria. `ownerAddress` is required.
    paramStructure: by-name
    params:
      - name: ownerAddress
        required: true
        description: The owner address to filter by. Required by the Alchemy DAS proxy on every call, including when other filters are also provided.
        schema:
          $ref: ../../chains/_components/solana/base-types.yaml#/components/schemas/Pubkey
      - name: tokenType
        required: false
        description: >
          Filter by token type. Accepted values are `fungible`, `nonFungible`, `regularNft`,
          `compressedNft`, and `all`. The Alchemy DAS proxy treats `tokenType` and the legacy
          `interface` filter as mutually exclusive — prefer `tokenType` for new integrations.
        schema:
          type: string
          enum:
            - fungible
            - nonFungible
            - regularNft
            - compressedNft
            - all
      - name: sortBy
        required: false
        description: Sorting criteria for assets.
        schema:
          type: object
          properties:
            sortBy:
              type: string
              enum:
                - created
                - updated
                - recent_action
                - none
              description: The field to sort by.
            sortDirection:
              type: string
              enum:
                - asc
                - desc
              description: Sort direction.
      - name: limit
        required: false
        description: The maximum number of assets to retrieve.
        schema:
          type: integer
          minimum: 1
          maximum: 1000
          default: 100
      - name: page
        required: false
        description: The index of the page to retrieve (1-indexed).
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: before
        required: false
        description: Retrieve assets before this cursor.
        schema:
          type: string
      - name: after
        required: false
        description: Retrieve assets after this cursor.
        schema:
          type: string
      - name: cursor
        required: false
        description: Cursor for pagination. Returned in the previous response.
        schema:
          type: string
      - name: negate
        required: false
        description: Invert the search filter.
        schema:
          type: boolean
          default: false
      - name: conditionType
        required: false
        description: How multiple filters are combined. `all` requires every filter to match; `any` matches if at least one filter matches.
        schema:
          type: string
          enum:
            - all
            - any
          default: all
      - name: creatorAddress
        required: false
        description: The creator address to filter by.
        schema:
          $ref: ../../chains/_components/solana/base-types.yaml#/components/schemas/Pubkey
      - name: creatorVerified
        required: false
        description: Only include verified creators.
        schema:
          type: boolean
      - name: authorityAddress
        required: false
        description: The authority address to filter by.
        schema:
          $ref: ../../chains/_components/solana/base-types.yaml#/components/schemas/Pubkey
      - name: grouping
        required: false
        description: >
          Collection grouping filter. Must be a 2-element tuple of `[groupKey, groupValue]`,
          for example `["collection", "<collectionAddress>"]`.
        schema:
          type: array
          minItems: 2
          maxItems: 2
          items:
            - type: string
              description: The grouping key (e.g., `collection`).
            - type: string
              description: The grouping value (e.g., the collection address).
          additionalItems: false
      - name: delegate
        required: false
        description: The delegate address to filter by.
        schema:
          $ref: ../../chains/_components/solana/base-types.yaml#/components/schemas/Pubkey
      - name: frozen
        required: false
        description: Filter by frozen status.
        schema:
          type: boolean
      - name: burnt
        required: false
        description: Filter by burnt status.
        schema:
          type: boolean
      - name: compressed
        required: false
        description: Filter for compressed NFTs (cNFTs) that use state compression.
        schema:
          type: boolean
      - name: compressible
        required: false
        description: Filter for assets that are eligible for compression but have not yet been compressed.
        schema:
          type: boolean
      - name: supply
        required: false
        description: Supply filter. Match assets whose supply equals this value.
        schema:
          type: integer
          minimum: 0
      - name: supplyMint
        required: false
        description: Filter assets whose supply is tied to a specific mint.
        schema:
          $ref: ../../chains/_components/solana/base-types.yaml#/components/schemas/Pubkey
      - name: royaltyTargetType
        required: false
        description: Royalty target type to filter by.
        schema:
          type: string
          enum:
            - creators
            - fanout
            - single
      - name: royaltyTarget
        required: false
        description: The royalty target address (Pubkey) to filter by.
        schema:
          $ref: ../../chains/_components/solana/base-types.yaml#/components/schemas/Pubkey
      - name: royaltyAmount
        required: false
        description: The royalty amount (in basis points) to filter by.
        schema:
          type: integer
          minimum: 0
          maximum: 10000
      - name: jsonUri
        required: false
        description: Filter by JSON URI.
        schema:
          type: string
      - name: name
        required: false
        description: Filter assets by name (substring match).
        schema:
          type: string
      - name: options
        required: false
        description: Optional response shaping flags. The server also accepts `displayOptions` as an alias of this field, but only one of `options` or `displayOptions` may be present per request.
        schema:
          type: object
          properties:
            showUnverifiedCollections:
              type: boolean
              default: false
              description: Show unverified collections instead of skipping them.
            showCollectionMetadata:
              type: boolean
              default: false
              description: Show metadata for the collection.
            showZeroBalance:
              type: boolean
              default: false
              description: Display assets with zero balance.
            showInscription:
              type: boolean
              default: false
              description: Display inscription details.
            showFungible:
              type: boolean
              default: false
              description: Include fungible assets in the result.
    examples:
      - name: searchAssets example
        params:
          - name: ownerAddress
            value: "86xCnPeV69n6t3DnyGvkKobf9FdN2H9oiVDdaMpo2MMY"
          - name: tokenType
            value: "all"
          - name: sortBy
            value:
              sortBy: "created"
              sortDirection: "asc"
          - name: page
            value: 1
          - name: limit
            value: 50
    result:
      name: Search results
      description: Returns assets matching the specified search criteria.
      schema:
        $ref: ../../chains/_components/solana/asset.yaml#/components/schemas/AssetList

  - name: getAssetSignatures
    description: Returns signatures for transactions that have interacted with the given asset.
    paramStructure: by-name
    params:
      - name: id
        required: true
        description: The ID of the asset to get signatures for.
        schema:
          $ref: ../../chains/_components/solana/asset.yaml#/components/schemas/AssetId
      - name: limit
        required: false
        description: The maximum number of signatures to retrieve.
        schema:
          type: integer
          maximum: 1000
          default: 100
      - name: page
        required: false
        description: The index of the "page" to retrieve.
        schema:
          type: integer
          default: 1
      - name: before
        required: false
        description: Retrieve signatures before this cursor.
        schema:
          type: string
      - name: after
        required: false
        description: Retrieve signatures after this cursor.
        schema:
          type: string
      - name: tree
        required: false
        description: The merkle tree address to filter by.
        schema:
          $ref: ../../chains/_components/solana/base-types.yaml#/components/schemas/Pubkey
    examples:
      - name: getAssetSignatures example
        params:
          - name: id
            value: "FNt6A9Mfnqbwc1tY7uwAguKQ1JcpBrxmhczDgbdJy5AC"
    result:
      name: Asset signatures
      description: Returns signatures for transactions involving the specified asset.
      schema:
        $ref: ../../chains/_components/solana/asset.yaml#/components/schemas/AssetSignatureList

  - name: getNftEditions
    description: Returns all editions of a given master NFT.
    paramStructure: by-name
    params:
      - name: mintAddress
        required: true
        description: The ID of the master NFT to get editions for.
        schema:
          $ref: ../../chains/_components/solana/asset.yaml#/components/schemas/AssetId
      - name: limit
        required: false
        description: The maximum number of editions to retrieve.
        schema:
          type: integer
          maximum: 1000
          default: 100
      - name: page
        required: false
        description: The index of the "page" to retrieve.
        schema:
          type: integer
          default: 1
      - name: before
        required: false
        description: Retrieve editions before this cursor.
        schema:
          type: string
      - name: after
        required: false
        description: Retrieve editions after this cursor.
        schema:
          type: string
    examples:
      - name: getNftEditions example
        params:
          - name: mintAddress
            value: "Bu1DEKeawy7txbnCEJE4BU3BKLXaNAKCYcHR4XhndGss"
    result:
      name: NFT editions
      description: Returns all editions of the specified master NFT.
      schema:
        $ref: ../../chains/_components/solana/asset.yaml#/components/schemas/NftEditionList

  - name: getTokenAccounts
    description: Returns token accounts based on the specified filters. At least one of `ownerAddress` or `mintAddress` is required.
    paramStructure: by-name
    params:
      - name: ownerAddress
        required: true
        description: The owner address to filter token accounts by. Either `ownerAddress` or `mintAddress` must be provided; `ownerAddress` is the most common.
        schema:
          $ref: ../../chains/_components/solana/base-types.yaml#/components/schemas/Pubkey
      - name: mintAddress
        required: false
        description: The mint address to filter token accounts by. Can be used in place of `ownerAddress` to query all token accounts for a given mint.
        schema:
          $ref: ../../chains/_components/solana/base-types.yaml#/components/schemas/Pubkey
      - name: page
        required: false
        description: The page of results to return (1-indexed). Use either page-based pagination (`page`) or cursor-based pagination (`cursor`/`before`/`after`), not both.
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: limit
        required: false
        description: The maximum number of token accounts to retrieve.
        schema:
          type: integer
          minimum: 1
          maximum: 1000
          default: 100
      - name: cursor
        required: false
        description: Cursor for pagination. Returned in the previous response.
        schema:
          type: string
      - name: before
        required: false
        description: Returns results before the specified cursor.
        schema:
          type: string
      - name: after
        required: false
        description: Returns results after the specified cursor.
        schema:
          type: string
      - name: options
        required: false
        description: Optional response shaping flags. The server also accepts `displayOptions` as an alias of this field, but only one of `options` or `displayOptions` may be present per request.
        schema:
          type: object
          properties:
            showZeroBalance:
              type: boolean
              default: false
              description: If true, include token accounts with a zero token balance.
    examples:
      - name: getTokenAccounts example
        params:
          - name: ownerAddress
            value: "86xCnPeV69n6t3DnyGvkKobf9FdN2H9oiVDdaMpo2MMY"
          - name: limit
            value: 100
    result:
      name: Token accounts
      description: Returns token accounts matching the specified criteria.
      schema:
        $ref: ../../chains/_components/solana/account.yaml#/components/schemas/TokenAccountsList
