                      eip7702Auth:
                        type: "object"
                        required:
                          - "chainId"
                          - "nonce"
                          - "address"
                          - "yParity"
                          - "r"
                          - "s"
                        properties:
                          chainId:
                            type: "string"
                            pattern: "^(0x)[\\s\\S]{0,}$"
                          nonce:
                            type: "string"
                            pattern: "^(0x)[\\s\\S]{0,}$"
                          address:
                            type: "string"
                            pattern: "^(0x)[\\s\\S]{0,}$"
                          yParity:
                            type: "string"
                            pattern: "^(0x)[\\s\\S]{0,}$"
                          r:
                            type: "string"
