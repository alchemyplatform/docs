                      blockHash:
                        type: "string"
                        pattern: "^(0x)[\\s\\S]{0,}$"
                        description: "Block hash of the block containing `UserOperation`."
                      transactionHash:
                        type: "string"
                        pattern: "^(0x)[\\s\\S]{0,}$"
                        description: "Transaction hash of the `UserOperation`."
                    additionalProperties: {}
