                            type: "string"
                            pattern: "^(0x)[\\s\\S]{0,}$"
                          r:
                            type: "string"
                            pattern: "^(0x)[\\s\\S]{0,}$"
                          s:
                            type: "string"
                            pattern: "^(0x)[\\s\\S]{0,}$"
                        additionalProperties: {}
                      aggregator:
