                      paymasterAndData:
                        type: "string"
                        pattern: "^(0x)[\\s\\S]{0,}$"
                        description: "Address of paymaster sponsoring the transaction, followed by extra data to send to the paymaster (empty for self-sponsored transaction)."
                      signature:
                        type: "string"
                        pattern: "^(0x)[\\s\\S]{0,}$"
