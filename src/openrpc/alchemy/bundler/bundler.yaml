  - name: eth_supportedEntryPoints
    description: "Returns an array of the `entryPoint` addresses supported by the client."
    x-compute-units: 10
    params: []
    result:
      name: "Supported entryPoints"
      description: "Array of supported `entryPoint` addresses."
      schema:
        type: "array"
