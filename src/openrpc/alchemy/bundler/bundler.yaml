                  description: "Data passed into the account along with the nonce during the verification step."
                eip7702Auth:
                  type: "object"
                  required:
                    - "chainId"
                    - "nonce"
                    - "address"
                    - "yParity"
                    - "r"
                    - "s"
                  properties:
                    chainId:
                      type: "string"
                      pattern: "^(0x)[\\s\\S]{0,}$"
                    nonce:
                      type: "string"
                      pattern: "^(0x)[\\s\\S]{0,}$"
                    address:
                      type: "string"
                      pattern: "^(0x)[\\s\\S]{0,}$"
                    yParity:
                      type: "string"
                      pattern: "^(0x)[\\s\\S]{0,}$"
                    r:
                      type: "string"
                      pattern: "^(0x)[\\s\\S]{0,}$"
                    s:
                      type: "string"
                      pattern: "^(0x)[\\s\\S]{0,}$"
                  additionalProperties: {}
                aggregator:
                  type: "string"
                  pattern: "^(0x)[\\s\\S]{0,}$"
              additionalProperties: {}
            - type: "object"
              required:
                - "sender"
                - "nonce"
                - "callData"
                - "signature"
              properties:
