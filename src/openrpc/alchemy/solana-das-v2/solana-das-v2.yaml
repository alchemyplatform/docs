$schema: https://meta.open-rpc.org/
openrpc: 1.2.4
info:
  title: Alchemy Solana DAS API v2 JSON-RPC Specification
  description: >
    v2 of the Solana Digital Asset Standard (DAS) API. This spec mirrors the
    canonical Helius DAS API upstream (method names and response shapes) and is
    served alongside the existing DAS API.
  version: 0.0.0
servers:
  - url: https://solana-mainnet.g.alchemy.com/v2
    name: Solana Mainnet
  - url: https://solana-devnet.g.alchemy.com/v2
    name: Solana Devnet

methods:
  - name: getAsset_v2
    description: >
      Returns detailed information for a single Solana NFT, compressed NFT, or
      token including metadata, ownership, price data, and on-chain attributes.
      **Price data caching:** `token_info.price_info` values are cached and may
      be up to 600 seconds old. Coverage is limited to the top 10,000 tokens by
      24-hour volume.
    x-compute-units: 160
    x-rate-limit-cus: 200
    paramStructure: by-name
    params:
      - name: id
        required: true
        description: The unique identifier (typically the mint address) of the asset to retrieve.
        schema:
          $ref: ../../chains/_components/solana/asset-v2.yaml#/components/schemas/AssetId
      - name: options
        required: false
        description: Display and formatting options for the asset data response.
        schema:
          $ref: ../../chains/_components/solana/asset-v2.yaml#/components/schemas/OptionsGetAsset
    examples:
      - name: getAsset_v2 example
        params:
          - name: id
            value: "F9Lw3ki3hJ7PF9HQXsBzoY8GyE6sPoEZZdXJBsTTD2rk"
        result:
          name: Asset
          value:
            last_indexed_slot: 365749093
            interface: ProgrammableNFT
            id: F9Lw3ki3hJ7PF9HQXsBzoY8GyE6sPoEZZdXJBsTTD2rk
            content:
              $schema: https://schema.metaplex.com/nft1.0.json
              json_uri: https://madlads.s3.us-west-2.amazonaws.com/json/8420.json
              files:
                - uri: https://madlads.s3.us-west-2.amazonaws.com/images/8420.png
                  cdn_uri: https://cdn.helius-rpc.com/cdn-cgi/image//https://madlads.s3.us-west-2.amazonaws.com/images/8420.png
                  mime: image/png
              metadata:
                attributes:
                  - value: Male
                    trait_type: Gender
                  - value: King
                    trait_type: Type
                description: Fock it.
                name: "Mad Lads #8420"
                symbol: MAD
                token_standard: ProgrammableNonFungible
              links:
                image: https://madlads.s3.us-west-2.amazonaws.com/images/8420.png
                external_url: https://madlads.com
            authorities:
              - address: 2RtGg6fsFiiF1EQzHqbd66AhW7R5bWeQGpTbv2UMkCdW
                scopes:
                  - full
            compression:
              eligible: false
              compressed: false
              data_hash: ""
              creator_hash: ""
              asset_hash: ""
              tree: ""
              seq: 0
              leaf_id: 0
            grouping:
              - group_key: collection
                group_value: J1S9H3QjnRtBbbuD4HjPV6RpRhwuk4zKbxsnCHuTgh9w
            royalty:
              royalty_model: creators
              target: null
              percent: 0.042
              basis_points: 420
              primary_sale_happened: true
              locked: false
            creators:
              - address: 5XvhfmRjwXkGp3jHGmaKpqeerNYjkuZZBYLVQYdeVcRv
                share: 0
                verified: true
              - address: 2RtGg6fsFiiF1EQzHqbd66AhW7R5bWeQGpTbv2UMkCdW
                share: 100
                verified: true
            ownership:
              frozen: true
              delegated: false
              delegate: null
              ownership_model: single
              owner: 4zdNGgAtFsW1cQgHqkiWyRsxaAgxrSRRynnuunxzjxue
            supply:
              print_max_supply: 0
              print_current_supply: 0
              edition_nonce: 254
            mutable: true
            burnt: false
            token_info:
              supply: 1
              decimals: 0
              token_program: TokenkegQfeZyiNwAJbNbGKPFXCWuBvf9Ss623VQ5DA
              mint_authority: TdMA45ZnakQCBt5XUvm7ib2htKuTWdcgGKu1eUGrDyJ
              freeze_authority: TdMA45ZnakQCBt5XUvm7ib2htKuTWdcgGKu1eUGrDyJ
    result:
      name: Asset
      description: Returns detailed information about the specified digital asset.
      schema:
        $ref: ../../chains/_components/solana/asset-v2.yaml#/components/schemas/Asset

  - name: getAssetBatch_v2
    description: >
      Returns detailed information for up to 1,000 Solana NFTs, compressed NFTs,
      or tokens in a single efficient batch request. Results are returned in the
      same order as the input `ids` array.
    x-compute-units: 480
    x-rate-limit-cus: 200
    paramStructure: by-name
    params:
      - name: ids
        required: true
        description: An array of asset IDs (typically mint addresses) to retrieve. Up to 1,000 per request.
        schema:
          type: array
          items:
            $ref: ../../chains/_components/solana/asset-v2.yaml#/components/schemas/AssetId
      - name: options
        required: false
        description: Display and formatting options for the batch response.
        schema:
          $ref: ../../chains/_components/solana/asset-v2.yaml#/components/schemas/OptionsGetAsset
    examples:
      - name: getAssetBatch_v2 example
        params:
          - name: ids
            value:
              - "F9Lw3ki3hJ7PF9HQXsBzoY8GyE6sPoEZZdXJBsTTD2rk"
              - "8vw7tdLGE3FBjaetsJrZAbbyssUrXai1aBJbUnj5S5uo"
        result:
          name: Asset batch
          value:
            - last_indexed_slot: 365750752
              interface: ProgrammableNFT
              id: F9Lw3ki3hJ7PF9HQXsBzoY8GyE6sPoEZZdXJBsTTD2rk
              content:
                $schema: https://schema.metaplex.com/nft1.0.json
                json_uri: https://madlads.s3.us-west-2.amazonaws.com/json/8420.json
                metadata:
                  name: "Mad Lads #8420"
                  symbol: MAD
              authorities:
                - address: 2RtGg6fsFiiF1EQzHqbd66AhW7R5bWeQGpTbv2UMkCdW
                  scopes:
                    - full
              grouping:
                - group_key: collection
                  group_value: J1S9H3QjnRtBbbuD4HjPV6RpRhwuk4zKbxsnCHuTgh9w
              ownership:
                frozen: true
                delegated: false
                delegate: null
                ownership_model: single
                owner: 4zdNGgAtFsW1cQgHqkiWyRsxaAgxrSRRynnuunxzjxue
              burnt: false
            - last_indexed_slot: 365750752
              interface: V1_NFT
              id: 8vw7tdLGE3FBjaetsJrZAbbyssUrXai1aBJbUnj5S5uo
              content:
                $schema: https://schema.metaplex.com/nft1.0.json
                metadata:
                  name: "Second asset"
                  symbol: NFT
              ownership:
                frozen: false
                delegated: false
                delegate: null
                ownership_model: single
                owner: 86xCnPeV69n6t3DnyGvkKobf9FdN2H9oiVDdaMpo2MMY
              burnt: false
    result:
      name: Asset batch
      description: Returns an ordered array of asset entries, one per requested ID.
      schema:
        $ref: ../../chains/_components/solana/asset-v2.yaml#/components/schemas/AssetBatch

  - name: getAssetProof_v2
    description: >
      Returns the cryptographic merkle proof for a compressed Solana NFT. The
      proof is required to validate a compressed asset's existence and data
      integrity on-chain (for transfers, burns, and other operations) without
      storing the full asset data.
    x-compute-units: 160
    x-rate-limit-cus: 200
    paramStructure: by-name
    params:
      - name: id
        required: true
        description: The unique identifier (mint address) of the compressed NFT to retrieve the merkle proof for.
        schema:
          $ref: ../../chains/_components/solana/asset-v2.yaml#/components/schemas/AssetId
    examples:
      - name: getAssetProof_v2 example
        params:
          - name: id
            value: "Bu1DEKeawy7txbnCEJE4BU3BKLXaNAKCYcHR4XhndGss"
        result:
