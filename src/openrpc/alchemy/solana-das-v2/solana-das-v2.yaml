  - name: getSignaturesForAsset_v2
    description: >
      Returns all historical transaction signatures for a Solana NFT or
      compressed NFT (mint, transfers, burns, and other state changes), with
      pagination.

      **Note:** this method is designed for compressed NFTs. For regular NFTs,
      use the standard Solana `getSignaturesForAddress` method instead. This
      DAS-specific endpoint exists because `getSignaturesForAddress` does not
      work with compressed NFTs.
    x-compute-units: 160
    x-rate-limit-cus: 200
    paramStructure: by-name
    params:
      - name: id
        required: true
        description: The unique identifier (mint address) of the compressed asset to retrieve transaction history for.
        schema:
          $ref: ../../chains/_components/solana/asset-v2.yaml#/components/schemas/AssetId
      - name: page
        required: true
        description: The page of results to return (1-based). Required.
        schema:
          type: integer
      - name: limit
        required: false
        description: The maximum number of transaction signatures to return per page.
        schema:
          type: integer
      - name: before
        required: false
        description: The cursor for paginating backwards through the signatures.
        schema:
          type: string
      - name: after
        required: false
        description: The cursor for paginating forwards through the signatures.
        schema:
          type: string
    examples:
      - name: getSignaturesForAsset_v2 example
        params:
          - name: id
            value: "FNt6A9Mfnqbwc1tY7uwAguKQ1JcpBrxmhczDgbdJy5AC"
