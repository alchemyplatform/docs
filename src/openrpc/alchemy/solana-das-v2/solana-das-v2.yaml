  - name: searchAssets_v2
    description: >
      Search and filter Solana NFTs, compressed NFTs, and tokens using flexible
      criteria including ownership, creators, collections, and custom
      attributes. Both `ownerAddress` and `tokenType` are required. The `tree`
      parameter is Helius-specific and not part of the official DAS
      specification.
    x-compute-units: 480
    x-rate-limit-cus: 200
    paramStructure: by-name
    params:
      - name: ownerAddress
        required: true
        description: The base-58 wallet address to filter search results by owner.
        schema:
          type: string
      - name: tokenType
        required: true
        description: Filter for specific token types.
        schema:
          type: string
          enum:
            - fungible
            - nonFungible
            - regularNft
            - compressedNft
            - all
      - name: page
        required: false
        description: The page of results to return (1-based).
        schema:
          type: integer
      - name: limit
        required: false
        description: The maximum number of assets to return per page.
        schema:
          type: integer
      - name: authorityAddress
        required: false
        description: Filter by program authority for assets controlled by a specific protocol or update authority.
        schema:
          type: string
      - name: creatorAddress
        required: false
        description: Filter by the creator wallet address.
        schema:
          type: string
      - name: creatorVerified
        required: false
        description: Filter by whether the creator is verified.
        schema:
          type: boolean
      - name: grouping
        required: false
        description: >
          Collection grouping tuple `[groupKey, groupValue]` for filtering by
          collection membership. For example: `["collection", "<collectionKey>"]`.
        schema:
          type: array
          items:
            type: string
      - name: sortBy
        required: false
        description: Sorting configuration for ordering the returned assets.
        schema:
          $ref: ../../chains/_components/solana/asset-v2.yaml#/components/schemas/SortBy
      - name: compressed
        required: false
        description: Filter for compressed NFTs (cNFTs) that use state compression.
        schema:
          type: boolean
      - name: compressible
        required: false
        description: Filter for assets that are eligible for compression but have not yet been compressed.
        schema:
          type: boolean
      - name: delegate
        required: false
        description: Delegate criteria for the asset search.
        schema:
          type: integer
      - name: tree
        required: false
        description: >
          Filter compressed NFTs by their merkle tree address. This parameter
          is Helius-specific and not part of the official DAS specification.
        schema:
          type: string
      - name: supply
        required: false
        description: Supply criteria for the asset search.
        schema:
          type: integer
      - name: supplyMint
        required: false
        description: Supply mint criteria for the asset search.
        schema:
          type: string
      - name: frozen
        required: false
        description: Filter by whether an asset is frozen.
        schema:
          type: boolean
      - name: burnt
        required: false
        description: Filter by whether an asset is burnt.
        schema:
          type: boolean
      - name: isAgent
        required: false
        description: Filter for assets that have an Agent Identity (MPL Core `AgentIdentity` external plugin).
        schema:
          type: boolean
      - name: agentToken
        required: false
        description: Filter by base58 agent token mint address from the Agent Registry program.
        schema:
          type: string
      - name: assetSigner
        required: false
        description: Filter by base58 asset-signer PDA (MPL Core).
        schema:
          type: string
      - name: interface
        required: false
        description: Filter by the token standard interface type.
        schema:
          $ref: ../../chains/_components/solana/asset-v2.yaml#/components/schemas/AssetInterface
      - name: royaltyTargetType
        required: false
        description: Royalty target type criteria.
        schema:
          type: string
      - name: royaltyTarget
        required: false
        description: Royalty target criteria.
        schema:
          type: integer
      - name: royaltyAmount
        required: false
        description: Royalty amount criteria (basis points).
        schema:
          type: integer
      - name: ownerType
        required: false
        description: Ownership model criteria.
        schema:
          type: integer
      - name: before
        required: false
        description: Cursor for paginating backwards through results.
        schema:
          type: string
      - name: after
        required: false
        description: Cursor for paginating forwards through results.
        schema:
          type: string
      - name: options
        required: false
        description: Advanced display options for the response.
        schema:
          $ref: ../../chains/_components/solana/asset-v2.yaml#/components/schemas/OptionsSearchAssets
    examples:
      - name: searchAssets_v2 example
        params:
          - name: ownerAddress
            value: "86xCnPeV69n6t3DnyGvkKobf9FdN2H9oiVDdaMpo2MMY"
          - name: tokenType
            value: "all"
          - name: page
            value: 1
          - name: limit
            value: 10
        result:
          name: searchAssets result
          value:
            assets:
              last_indexed_slot: 365750752
              total: 80
              limit: 10
              page: 1
              items:
                - interface: V1_NFT
                  id: JCfTS6dmJZY4NXhjMwHqayGGHUwxp59pzcYhZrYqMBce
                  ownership:
                    frozen: false
                    delegated: true
                    delegate: GVKwqsEC5YQZX4hG7Fdy6m7cJUi4DA3ezYx1CC9wkj34
                    ownership_model: single
                    owner: 86xCnPeV69n6t3DnyGvkKobf9FdN2H9oiVDdaMpo2MMY
                  content:
