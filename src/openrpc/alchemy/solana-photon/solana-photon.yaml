# yaml-language-server: $schema=https://meta.open-rpc.org/

$schema: https://meta.open-rpc.org/
openrpc: 1.2.4
info:
  title: Alchemy Solana Photon JSON-RPC Specification
  description: |-
    JSON-RPC specification for the Photon indexer methods that power
    [ZK Compression](https://www.zkcompression.com/) on Solana. These methods
    follow the [Photon](https://github.com/helius-labs/photon) spec maintained by
    Helius and are served through Alchemy's Solana RPC endpoints.
  version: 0.0.0
servers:
  - url: https://solana-mainnet.g.alchemy.com/v2
    name: Solana Mainnet
  - url: https://solana-devnet.g.alchemy.com/v2
    name: Solana Devnet
methods:
  - $ref: ../../chains/_components/solana/methods.yaml#/components/methods/getCompressedAccount
  - $ref: ../../chains/_components/solana/methods.yaml#/components/methods/getCompressedAccountProof
  - $ref: ../../chains/_components/solana/methods.yaml#/components/methods/getCompressedAccountsByOwner
  - $ref: ../../chains/_components/solana/methods.yaml#/components/methods/getCompressedBalance
  - $ref: ../../chains/_components/solana/methods.yaml#/components/methods/getCompressedBalanceByOwner
  - $ref: ../../chains/_components/solana/methods.yaml#/components/methods/getCompressedMintTokenHolders
  - $ref: ../../chains/_components/solana/methods.yaml#/components/methods/getCompressedTokenAccountBalance
  - $ref: ../../chains/_components/solana/methods.yaml#/components/methods/getCompressedTokenAccountsByDelegate
  - $ref: ../../chains/_components/solana/methods.yaml#/components/methods/getCompressedTokenAccountsByOwner
  - $ref: ../../chains/_components/solana/methods.yaml#/components/methods/getCompressedTokenBalancesByOwner
  - $ref: ../../chains/_components/solana/methods.yaml#/components/methods/getCompressedTokenBalancesByOwnerV2
  - $ref: ../../chains/_components/solana/methods.yaml#/components/methods/getCompressionSignaturesForAccount
  - $ref: ../../chains/_components/solana/methods.yaml#/components/methods/getCompressionSignaturesForAddress
  - $ref: ../../chains/_components/solana/methods.yaml#/components/methods/getCompressionSignaturesForOwner
  - $ref: ../../chains/_components/solana/methods.yaml#/components/methods/getCompressionSignaturesForTokenOwner
  - $ref: ../../chains/_components/solana/methods.yaml#/components/methods/getIndexerHealth
  - $ref: ../../chains/_components/solana/methods.yaml#/components/methods/getIndexerSlot
  - $ref: ../../chains/_components/solana/methods.yaml#/components/methods/getLatestCompressionSignatures
  - $ref: ../../chains/_components/solana/methods.yaml#/components/methods/getLatestNonVotingSignatures
  - $ref: ../../chains/_components/solana/methods.yaml#/components/methods/getMultipleCompressedAccountProofs
  - $ref: ../../chains/_components/solana/methods.yaml#/components/methods/getMultipleCompressedAccounts
  - $ref: ../../chains/_components/solana/methods.yaml#/components/methods/getMultipleNewAddressProofs
  - $ref: ../../chains/_components/solana/methods.yaml#/components/methods/getMultipleNewAddressProofsV2
