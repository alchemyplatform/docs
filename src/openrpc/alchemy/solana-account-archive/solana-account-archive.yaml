# yaml-language-server: $schema=https://meta.open-rpc.org/

$schema: https://meta.open-rpc.org/
openrpc: 1.2.4
info:
  title: Alchemy Solana Account Archive JSON-RPC Specification
  description: |-
    JSON-RPC specification for Solana Account Archive, Alchemy's historical
    account state service. Answers `getAccountInfo` for any Solana account at
    any historical slot from July 2025 onward, using the same request and
    response shapes as standard Solana RPC. Coverage is never pruned, so the
    queryable window only grows over time.

    The archive extends `getAccountInfo` with three mutually-exclusive
    parameters (`slot`, `lastUpdateBeforeSlot`, `firstUpdateAfterSlot`) that
    also cannot be combined with `minContextSlot`. Omit all three to get a
    normal, latest-state read: the archive is a drop-in superset of standard
    `getAccountInfo`.

    Vote accounts and the three per-slot sysvars (`SlotHashes`, `SlotHistory`,
    `RecentBlockhashes`) are excluded from the archive. All other accounts,
    including program accounts, token accounts, mints, PDAs, wallets, and the
    remaining sysvars, are covered.
  version: 0.0.0
servers:
  - url: https://solana-mainnet.g.alchemy.com/v2
    name: Solana Mainnet
methods:
  - name: getAccountInfo
    summary: >-
      Returns account information at a specific slot, or walks an account's
      update history using cursor parameters.
    description: |-
      Returns all information associated with the account at the given Pubkey,
      with optional historical lookups. Supports three mutually-exclusive
      history parameters in the configuration object:

      - `slot`: state *as of* slot `S` (inclusive: the latest write with
        `slot <= S`). Use for point-in-time snapshots.
      - `lastUpdateBeforeSlot`: the most recent write *strictly before* slot
        `S`. Use to walk an account's history backward.
      - `firstUpdateAfterSlot`: the first write *strictly after* slot `S`.
        Use to walk an account's history forward or catch an indexer up from
        a known slot.

      These three are also mutually exclusive with `minContextSlot`; pairing
      it with any of them returns an invalid-params error. Omit all three for
      a normal, latest-state `getAccountInfo`.

      The response is the standard `getAccountInfo` shape. When using
      `lastUpdateBeforeSlot` or `firstUpdateAfterSlot`, the `context.slot`
      field returns the actual slot of the write that was found, so each
      response is the cursor for the next request.

      `jsonParsed` encoding works on historical state: the same decoders a
      standard RPC node uses are applied to the historical bytes.
    params:
      - name: Pubkey
        required: true
        description: Pubkey of the account to query (base-58 encoded).
        schema:
          $ref: ../../chains/_components/solana/base-types.yaml#/components/schemas/Pubkey
      - name: Configuration
        required: false
        description: >-
          Optional configuration object. Includes the standard `getAccountInfo`
          options (`encoding`, `commitment`, `dataSlice`, `minContextSlot`)
          plus the three mutually-exclusive archive parameters.
        schema:
          $ref: "#/components/schemas/GetAccountInfoArchiveConfig"
    examples:
      - name: Point-in-time read at slot 400,000,000
        params:
          - name: Pubkey
            value: "3emsAVdmGKERbHjmGfQ6oZ1e35dkf5iYcS6U4CPKFVaa"
          - name: Configuration
            value:
              encoding: jsonParsed
              slot: 400000000
        result:
          name: Account information at slot
          value:
            context:
              apiVersion: "4.1.0"
              slot: 400000000
            value:
              lamports: 2040821
              owner: "TokenkegQfeZyiNwAJbNbGKPFXCWuBvf9Ss623VQ5DA"
              data:
                program: "spl-token"
                space: 165
                parsed:
                  type: "account"
                  info:
                    isNative: false
                    mint: "EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v"
                    owner: "7VHUFJHWu2CuExkJcJrzhQPJ2oygupTWkL2A2For4BmE"
                    state: "initialized"
                    tokenAmount:
                      amount: "1056153754430274"
                      decimals: 6
                      uiAmount: 1056153754.430274
                      uiAmountString: "1056153754.430274"
              executable: false
              rentEpoch: 18446744073709551615
              space: 165
      - name: Walk history backward with lastUpdateBeforeSlot
        params:
          - name: Pubkey
            value: "3emsAVdmGKERbHjmGfQ6oZ1e35dkf5iYcS6U4CPKFVaa"
          - name: Configuration
            value:
              encoding: base64
              lastUpdateBeforeSlot: 400000000
        result:
          name: Previous write on the account
          value:
            context:
              apiVersion: "4.1.0"
              slot: 399988788
            value:
              lamports: 2040821
              owner: "TokenkegQfeZyiNwAJbNbGKPFXCWuBvf9Ss623VQ5DA"
              data:
                - "xvp6877brTo9ZfNqq8l0MbG75MLS9uDkfKYCA0UvXWFgZQGzAuGAGJL4Cil59YX4hV0PIDR5CiRV90T6xQPXtUJrXPWQwAMAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAQAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"
                - "base64"
              executable: false
              rentEpoch: 18446744073709551615
              space: 165
      - name: Walk history forward with firstUpdateAfterSlot
        params:
          - name: Pubkey
            value: "3emsAVdmGKERbHjmGfQ6oZ1e35dkf5iYcS6U4CPKFVaa"
          - name: Configuration
            value:
              encoding: base64
              firstUpdateAfterSlot: 400000000
        result:
          name: Next write on the account
          value:
            context:
              apiVersion: "4.1.0"
              slot: 400005406
            value:
              lamports: 2040821
              owner: "TokenkegQfeZyiNwAJbNbGKPFXCWuBvf9Ss623VQ5DA"
              data:
                - "xvp6877brTo9ZfNqq8l0MbG75MLS9uDkfKYCA0UvXWFgZQGzAuGAGJL4Cil59YX4hV0PIDR5CiRV90T6xQPXtaI/d7WLwAMAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAQAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"
                - "base64"
              executable: false
              rentEpoch: 18446744073709551615
              space: 165
    result:
      name: Account information
      description: >-
        Returns the standard `getAccountInfo` shape. `context.slot` reflects
        the actual slot at which the write was found (for cursor queries) or
        the requested `slot` (for point-in-time reads). `value` is `null`
        when the account did not exist as of the resolved slot: for
        point-in-time reads, an account not created yet or already closed;
        for cursor reads, a write that deleted the account (its slot is
        still returned in `context.slot` and works as the next cursor).
      schema:
        $ref: "#/components/schemas/AccountInfoArchiveResult"
    errors:
      - code: -32020
        message: >-
          Cursor walked past the edge of the archive's coverage window. This
          is the only terminal for a cursor walk; a never-indexed account
          errors the same way. Coverage currently extends back to July 2025
          and grows over time.
      - code: -32602
        message: >-
          Invalid params. Common causes include combining more than one of
          `slot`, `lastUpdateBeforeSlot`, and `firstUpdateAfterSlot`,
          combining any of those three with `minContextSlot`, a slot value
          that is not a non-negative integer, or a malformed Pubkey.
      - code: -32601
        message: Method not found.
      - code: -32603
        message: >-
          Internal error. Retry the request; if it persists, contact support.

components:
  schemas:
    GetAccountInfoArchiveConfig:
      title: getAccountInfo (Archive) Configuration
      type: object
      description: >-
        Configuration for `getAccountInfo` with archive extensions. `slot`,
        `lastUpdateBeforeSlot`, and `firstUpdateAfterSlot` are mutually
        exclusive with each other and with `minContextSlot`; omit all three
        for a normal latest-state read.
      properties:
        commitment:
          $ref: ../../chains/_components/solana/base-types.yaml#/components/schemas/Commitment
        encoding:
          $ref: ../../chains/_components/solana/base-types.yaml#/components/schemas/Encoding
          description: Encoding format for account data.
        dataSlice:
          $ref: ../../chains/_components/solana/base-types.yaml#/components/schemas/DataSlice
        minContextSlot:
          $ref: ../../chains/_components/solana/base-types.yaml#/components/schemas/MinContextSlot
        slot:
          type: integer
          minimum: 0
          description: >-
            Return the account's state as of slot `S` (inclusive). The
            response is the latest write with `slot <= S`. Mutually
            exclusive with `lastUpdateBeforeSlot`, `firstUpdateAfterSlot`,
            and `minContextSlot`.
        lastUpdateBeforeSlot:
          type: integer
          minimum: 0
          description: >-
            Return the most recent write to this account strictly before
            slot `S`. The response's `context.slot` is the actual slot at
            which that write landed and can be used as the cursor for the
            next call. Mutually exclusive with `slot`,
            `firstUpdateAfterSlot`, and `minContextSlot`.
        firstUpdateAfterSlot:
          type: integer
          minimum: 0
          description: >-
            Return the first write to this account strictly after slot `S`.
            The response's `context.slot` is the actual slot at which that
            write landed and can be used as the cursor for the next call.
            Mutually exclusive with `slot`, `lastUpdateBeforeSlot`, and
            `minContextSlot`.

    AccountInfoArchiveResult:
      title: getAccountInfo (Archive) Result
      type: object
      properties:
        context:
          type: object
          properties:
            apiVersion:
              type: string
              description: RPC node API version.
            slot:
              type: integer
              description: >-
                The slot at which the returned state was written. For
                point-in-time reads (`slot` parameter set), this is the
                requested slot. For cursor reads
                (`lastUpdateBeforeSlot` / `firstUpdateAfterSlot`), this is
                the actual slot of the write that was found and can be used
                as the next cursor.
        value:
          oneOf:
            - $ref: ../../chains/_components/solana/account.yaml#/components/schemas/AccountInfo
            - type: "null"
          description: >-
            The account's state, or `null` when the account did not exist as
            of the resolved slot (for cursor reads, the write found at
            `context.slot` deleted the account).
