name: "Generate Fern Preview"
description: "Generate a Fern documentation preview for pull requests"

inputs:
  github-token:
    description: "GitHub token for authentication"
    required: true
  fern-token:
    description: "Fern token for documentation generation"
    required: true
  ref:
    description: "Git reference to build from"
    required: true

outputs:
  url:
    description: "Preview URL generated by Fern"
    value: ${{ steps.preview.outputs.url }}

runs:
  using: "composite"
  steps:
    - name: Add aa-sdk docs to fern
      uses: ./.github/actions/insert-wallets-tab

    - name: Set Build Comment to In Progress
      uses: actions/github-script@v7
      with:
        script: |
          const workspace = process.env.GITHUB_WORKSPACE;
          const { updatePreviewComment } = await import(`${workspace}/scripts/preview-comment.js`);

          await updatePreviewComment({
            github,
            context,
            status: 'building',
          });

    - name: Generate Preview
      uses: ./.github/actions/publish-fern
      id: preview
      with:
        github-token: ${{ inputs.github-token }}
        fern-token: ${{ inputs.fern-token }}
        environment: docs-preview
        ref: ${{ inputs.ref }}
        preview: "true"

    - name: Comment Preview URL in PR
      uses: actions/github-script@v7
      if: always()
      with:
        script: |
          const workspace = process.env.GITHUB_WORKSPACE;
          const { updatePreviewComment } = await import(`${workspace}/scripts/preview-comment.js`);

          await updatePreviewComment({
            github,
            context,
            previewUrl: '${{ steps.preview.outputs.url }}',
            status: '${{ steps.preview.outcome }}',
          });
