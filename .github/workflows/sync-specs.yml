name: Sync Specs

on:
  push:
    branches: [main]
    paths:
      - "src/openapi/**"
      - "src/openrpc/**"
  workflow_dispatch: {}

jobs:
  sync:
    name: Upload specs and revalidate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-pnpm

      - name: Generate API specs
        run: pnpm generate

      - name: Upload specs to Redis
        id: upload
        run: |
          CHANGED=$(pnpm -s upload-specs)
          echo "changedSpecs=$CHANGED" >> $GITHUB_OUTPUT
        env:
          KV_REST_API_URL: ${{ secrets.KV_REST_API_URL }}
          KV_REST_API_TOKEN: ${{ secrets.KV_REST_API_TOKEN }}

      - name: Revalidate changed specs
        if: ${{ steps.upload.outputs.changedSpecs != '[]' && steps.upload.outputs.changedSpecs != '' }}
        run: |
          PAYLOAD=$(jq -n --argjson urls '${{ steps.upload.outputs.changedSpecs }}' '{specUrls: $urls}')
          curl -X POST "${{ secrets.DOCS_SITE_URL }}/api/revalidate/specs" \
            -H "Authorization: Bearer ${{ secrets.DOCS_SITE_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            --max-time 120 \
            --fail-with-body
