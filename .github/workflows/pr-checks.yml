name: Run checks on PR

on: pull_request

jobs:
  open-api-specs:
    name: OpenAPI Specs
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Validate REST API specs
        run: pnpm run generate:rest

  rpc-specs:
    name: JSON-RPC Specs
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: ./.github/actions/setup-pnpm
      - name: Validate RPC specs
        run: pnpm run generate:rpc

  lint:
    name: Lint Files
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: ./.github/actions/setup-pnpm
      - name: Run ESLint
        run: pnpm run lint:eslint

  fern-check:
    name: Fern Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Generate API Specs
        run: pnpm run generate

      - name: Check API is valid
        run: pnpm fern check

  generate-preview:
    name: Generate Preview
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Post building comment
        uses: actions/github-script@v7
        with:
          script: |
            const workspace = process.env.GITHUB_WORKSPACE;
            const { updatePreviewComment } = await import(`${workspace}/scripts/preview-comment.js`);

            await updatePreviewComment({
              github,
              context,
              status: 'building',
            });

      - name: Run preview indexer
        id: preview
        run: npx tsx src/content-indexer/preview.ts --branch=${{ github.head_ref }}
        env:
          KV_REST_API_URL: ${{ secrets.KV_REST_API_URL }}
          KV_REST_API_TOKEN: ${{ secrets.KV_REST_API_TOKEN }}
          DOCS_SITE_URL: ${{ secrets.DOCS_SITE_URL }}
          DOCS_SITE_API_KEY: ${{ secrets.DOCS_SITE_API_KEY }}

      - name: Post result comment
        uses: actions/github-script@v7
        if: always()
        with:
          script: |
            const workspace = process.env.GITHUB_WORKSPACE;
            const { updatePreviewComment } = await import(`${workspace}/scripts/preview-comment.js`);

            await updatePreviewComment({
              github,
              context,
              status: '${{ steps.preview.outcome }}',
              previewUrl: '${{ steps.preview.outputs.preview-url }}',
            });
