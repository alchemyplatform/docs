name: Run checks on PR

on: pull_request

jobs:
  open-api-specs:
    name: OpenAPI Specs
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Validate REST API specs
        run: pnpm run generate:rest

  rpc-specs:
    name: JSON-RPC Specs
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: ./.github/actions/setup-pnpm
      - name: Validate RPC specs
        run: pnpm run generate:rpc

  lint:
    name: Lint Files
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: ./.github/actions/setup-pnpm
      - name: Run ESLint
        run: pnpm run lint:eslint

  generate-preview:
    name: Generate Preview
    runs-on: ubuntu-latest
    outputs:
      preview_url: ${{ steps.generate_preview.outputs.preview_url }}
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generate Preview
        id: generate_preview
        uses: ./.github/actions/generate-preview
        with:
          github-token: ${{ github.token }}
          branch: ${{ github.head_ref }}
          kv-rest-api-url: ${{ secrets.KV_REST_API_URL }}
          kv-rest-api-token: ${{ secrets.KV_REST_API_TOKEN }}
          docs-site-url: ${{ secrets.DOCS_SITE_URL }}
          docs-site-api-key: ${{ secrets.DOCS_SITE_API_KEY }}

  link-check:
    name: Link Check
    runs-on: ubuntu-latest
    needs: generate-preview
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect content changes
        id: changed-files
        shell: bash
        run: |
          set +e
          CHANGED_FILES=$(git diff --name-only \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}" \
            -- 'content/**/*.md' 'content/**/*.mdx')
          EXIT_CODE=$?
          set -e

          if [ $EXIT_CODE -ne 0 ]; then
            echo "::error::git diff failed with exit code $EXIT_CODE"
            exit 1
          fi

          if [ -z "$CHANGED_FILES" ]; then
            echo "No content markdown files changed. Skipping lychee."
            echo "has-content-changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Changed markdown files:"
          echo "$CHANGED_FILES"
          echo "has-content-changes=true" >> "$GITHUB_OUTPUT"

      - name: Bootstrap preview cookies
        if: steps.changed-files.outputs.has-content-changes == 'true'
        shell: bash
        env:
          PREVIEW_URL: ${{ needs['generate-preview'].outputs.preview_url }}
        run: |
          set -euo pipefail

          if [ -z "${PREVIEW_URL:-}" ]; then
            echo "::error::Missing preview URL from generate-preview job output"
            exit 1
          fi

          curl --silent --show-error --fail --location \
            --cookie-jar .lychee-cookies \
            "$PREVIEW_URL" > /dev/null

      - name: Link Checker
        if: steps.changed-files.outputs.has-content-changes == 'true'
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: "--config ./lychee.toml --no-progress --cookie-jar ./.lychee-cookies ./content"
          fail: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
