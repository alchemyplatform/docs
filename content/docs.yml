# yaml-language-server: $schema=./docs-yml.schema.json

tabs:
  chains:
    display-name: Chains
    slug: chains
  data:
    display-name: Data
    slug: data
  wallets:
    display-name: Wallets
    slug: wallets
  build-with-ai:
    display-name: Build with AI
    slug: build-with-ai
  # Former "Get Started" tab, renamed "Tools & Resources". Keeps the
  # "get-started" key (the frontend header matches its active tab against it)
  # and the "tutorials" slug so existing URLs under /docs/tutorials/... keep
  # working.
  get-started:
    display-name: Tools & Resources
    slug: tutorials
  changelog:
    display-name: Changelog
    slug: changelog

navigation:
  # The former "Node" tab is merged into Chains: the Node API is our
  # implementation of the standard JSON-RPC API and the per-chain APIs below
  # are where those endpoints live, so they now share one tab.
  #
  # COUPLING (OMGWINNING/dashboard temporal-worker daikon-docs workflows):
  # the Daikon bot requires a tab keyed exactly `chains` and inserts new
  # chain sections before the next "- tab:" line after it — if `chains`
  # ever becomes the last tab, new chains silently stop being added to the
  # nav. It only scans top-level sections of this tab for per-chain
  # api-name entries, so keep those one level deep.
  - tab: chains
    layout:
      # The cross-chain sections (WebSockets, Yellowstone gRPC, Trace API,
      # Debug API, Rollups) are nested inside this first section: the docs
      # site renders every later top-level section of this tab as a chain in
      # the chain selector. skip-slug keeps their endpoint URLs at
      # /chains/<section>/... .
      - section: Introduction
        skip-slug: true
        contents:
          - page: API Overview
            path: api-reference/node-api/chain-apis-overview.mdx
          - page: Supported Chains
            path: api-reference/node-api/node-supported-chains.mdx
          - page: Feature Support by Chain
            path: >-
              api-reference/pricing-resources/resources/feature-support-by-chain.mdx
          - page: MEV Protection
            path: api-reference/node-api/mev-protection.mdx
          - link: Pricing
            href: /docs/reference/pricing-plans

          - section: WebSockets
            contents:
              - page: Subscription API Overview
                path: api-reference/websockets/subscription-api.mdx
